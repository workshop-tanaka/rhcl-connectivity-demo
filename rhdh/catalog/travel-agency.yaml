# ---------------------------------------------------------------------------
# Consumidores da API.
#
# Cada um corresponde a uma API key em base/identity/apikeys.yaml. O tier nao
# vem da chave em si: vem do label kuadrant.io/plan-id nela, que o PlanPolicy
# le no predicate. Uma chave 'app: partner' SEM esse label cai no plano
# catch-all -- e a falha e silenciosa.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: globex-travel
  title: Globex Travel
  description: Parceiro tier gold — 30 req/10s, 5000/dia (apikey-gold-globex).
  # Os parceiros nao tem servico nem trace proprio -- sao consumidores. O que
  # existe deles e consumo, e e exatamente o que o dashboard rhcl-negocio-parceiros
  # mede. A tag 'rhcl' traz os tres dashboards autorais para a pagina de cada
  # um; o de consumo e o que faz sentido aqui.
  annotations:
    backstage.io/techdocs-ref: url:${DEMO_REPO_URL}/docs/componentes/globex-travel
    grafana/dashboard-selector: rhcl
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/kuadrant-system/core~v1~Secret/apikey-gold-globex
      title: Chave de API no console
      icon: web
    - url: https://${GRAFANA_HOST}/d/rhcl-negocio-parceiros
      title: Consumo deste parceiro
      icon: dashboard
  tags:
    - parceiro
    - tier-gold
    - rhcl
    - ato-2
  labels:
    rhcl.demo/camada: consumidor
    rhcl.demo/origem: repo
    rhcl.demo/produto: travels
spec:
  type: api-consumer
  lifecycle: production
  # O parceiro responde pelo proprio consumo. Com o dono no platform-team,
  # a aba Owned do grupo 'parceiros' abria VAZIA -- o grupo existia e nao
  # tinha nada, que e um beco sem saida no meio da demo.
  owner: group:default/parceiros
  system: travel-agency
  consumesApis:
    - travels-api
