# ===========================================================================
# O coletor da amostra -- LOG DE ACESSO em OTLP, e nao trace.
#
# ---------------------------------------------------------------------------
# POR QUE ACCESS LOG E NAO TRACE, sendo que a amostra do upstream faz trace
#
# Este cluster JA TEM a ponta de trace montada e funcionando: coletor em
# tracing-system, Tempo com multitenancy, e a aba Observe -> Traces do console
# (platform-reference/tracing/). Repetir isso numa amostra nao acrescentaria
# nada -- seria um segundo caminho para o mesmo destino, e a primeira duvida de
# quem operasse seria "qual dos dois esta valendo?".
#
# O que o ambiente NAO tem e o log de acesso do mesh como TELEMETRIA
# ESTRUTURADA. Hoje o log de acesso do Envoy e texto no stdout do sidecar: para
# le-lo e preciso saber em qual pod olhar, e ele morre com o pod. O upstream do
# Istio cobre exatamente isso em samples/open-telemetry/als/.
#
# E o argumento que a demo precisa: o MESMO control plane que aplica policy
# decide o que vira telemetria e para onde ela vai -- por configuracao, sem
# tocar em aplicacao nenhuma. Um gateway nao tem onde colocar essa decisao.
# ---------------------------------------------------------------------------
#
# CR do operador, e nao Deployment cru. O upstream traz ConfigMap + Service +
# Deployment escritos a mao porque nao pode pressupor operador; aqui o
# OpenTelemetry Operator ja esta instalado (e ele que sustenta
# platform-reference/tracing/otel-collector.yaml), e usar o CR e o que faz esta
# amostra parecer com o resto do cluster em vez de um corpo estranho.
#
# UM exportador so -- 'debug' --, e a ausencia do segundo e uma MEDICAO de
# 2026-08-28, nao uma simplificacao.
#
# A primeira versao tambem exportava para o Tempo do cluster, com o mesmo bloco
# de bearer token e service CA que platform-reference/tracing/otel-collector.yaml
# usa. O access log chegou ao coletor e o Tempo o RECUSOU, uma vez por linha:
#
#   Exporting failed. Dropping data.
#   error: not retryable error: Permanent error: rpc error:
#          code = PermissionDenied desc = method never permitted
#
# Tempo e backend de TRACE. Ele nao aceita o metodo OTLP de logs, e a recusa nao
# tem nada a ver com o token nem com o tenant -- a mesma credencial funciona
# para trace no coletor vizinho. Insistir seria trocar um erro claro por um
# retry infinito.
#
# CONSEQUENCIA HONESTA: o access log VIVE ENQUANTO O POD VIVER. Para persistir,
# seria preciso um backend de log -- o upstream do Istio usa Loki na variante
# samples/open-telemetry/loki/, e este cluster nao tem Loki. Acrescentar um por
# causa de uma amostra seria caro para o que ela demonstra.
#
# 'debug' com verbosity detailed e o que se abre no palco: 'oc logs -f' e a
# linha aparece no momento do curl, com Trace ID -- o que liga o access log ao
# trace que o Ato 5 ja mostra.
# ===========================================================================
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-als
  namespace: otel-sample
  labels:
    app: otel-als
spec:
  mode: deployment
  replicas: 1
  podLabels:
    # Cinto e suspensorio: o namespace ja nao tem injecao (00-), e este rotulo
    # mantem o pod de fora se alguem rotular o namespace por engano.
    sidecar.istio.io/inject: "false"
    app: otel-als
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
