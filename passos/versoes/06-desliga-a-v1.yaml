# PASSO 6 -- a v1 desligada: 410 Gone para todos, com ou sem chave.
# A policy alcanca SO a regra 'v1'. Ela nao autentica (o desligamento vale
# para quem tem chave e para quem nao tem) e nega tudo, com o codigo e o
# texto que dizem para onde ir. O 'Link' para a v2 continua vindo da rota.
# Desfazer e apagar esta policy: a v1 volta a responder em cerca de 1 s
# (medido no cluster-mz8j7 em 2026-10-26).
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: v1-desligada
  namespace: travel-agency
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: travels-versoes, sectionName: v1}
  rules:
    authorization:
      desligada:
        opa: {rego: allow = false}
    response:
      unauthorized:
        code: 410
        headers:
          content-type: {value: application/json}
        body:
          value: '{"error": "Gone", "message": "a v1 foi desligada em 30/06/2027. Use /v2."}'
