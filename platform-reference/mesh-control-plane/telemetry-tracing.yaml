# ===========================================================================
# Telemetry do Service Mesh — a ordem de EMITIR span, separada do CR do Istio.
#
# Arquivo proprio, e nao mais um documento dentro de istio.yaml, por uma razao
# operacional: o CR Istio nao pode levar 'oc apply' cego num cluster que ja tem
# Service Mesh de pe (o apply removeria o 'version' gravado e dispararia
# upgrade/downgrade do plano de controle no meio do provisionamento). Esta
# Telemetry, sim: ela e inofensiva de reaplicar, e e a peca que costuma faltar.
#
# O provider 'otel-tracing' referenciado aqui e declarado em istio.yaml, ao
# lado, como meshConfig.extensionProviders. Um sem o outro nao produz trace:
#   - provider sem Telemetry -> ninguem emite. Tela vazia, sem erro.
#   - Telemetry sem provider  -> o proxy reclama de provider desconhecido.
# ===========================================================================
# 100% de amostragem porque isto e demo: com o default (1%) uma rajada de 14
# requisicoes do Ato 2 tem chance real de nao produzir NENHUM trace, e a
# conclusao errada ('o tracing nao esta funcionando') e indistinguivel da
# certa. Em producao, nao.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  tracing:
    - providers:
        - name: otel-tracing
      randomSamplingPercentage: 100
