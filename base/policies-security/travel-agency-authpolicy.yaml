# ===========================================================================
# AuthPolicy da rota travel-agency — quem entra.
#
# Autenticacao por API key: o Authorino procura Secrets com 'app: partner' no
# proprio namespace (allNamespaces: false => kuadrant-system, onde ele roda) e
# casa contra o parametro de query APIKEY. Os Secrets estao em base/identity/.
#
# ---------------------------------------------------------------------------
# NAO adicione aqui um bloco response.success.dynamicMetadata.
#
# A tentacao e obvia -- exportar a identidade para poder rotular metricas por
# parceiro em base/policies-telemetry/. Nao funciona: o controller do
# PlanPolicy reescreve o response.success.dynamicMetadata inteiro do AuthConfig
# gerado, e o que for declarado aqui e descartado em silencio (sem erro, sem
# status degradado). Testado neste cluster; ver o comentario extenso em
# base/policies-telemetry/prod-web-telemetry.yaml.
#
# Enquanto houver PlanPolicy nesta rota, a unica dimensao de identidade que
# chega ao data plane e 'auth.kuadrant.plan'.
# ---------------------------------------------------------------------------
# ===========================================================================
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  annotations:
    rhcl.demo/autor: Sandro Tanaka
  # 'app: travels' nao e usado por nenhum controlador do Kuadrant -- serve ao
  # portal: e por este label que o RHDH liga esta policy ao componente
  # travels (backstage.io/kubernetes-label-selector) e a mostra na aba
  # Kubernetes. Nao existe plugin de Connectivity Link; este e o caminho.
  labels:
    app: travels
  name: travel-agency-authpolicy
  namespace: travel-agency
spec:
  # 'rules' direto, NAO 'defaults.rules'.
  #
  # As duas formas sao equivalentes para esta policy (rules == defaults
  # implicitos, e 'atomic' e a estrategia default; com uma policy so na rota nao
  # ha merge com que interagir). Mas a descoberta do developer portal le
  # 'spec.rules' e IGNORA 'spec.defaults.rules': com o wrapper, o APIProduct
  # fica sem 'status.discoveredAuthScheme' e todo APIKey criado contra ele morre
  # em 'Failed=True reason=AuthSchemeNotFound'. Ver a armadilha no RUNBOOK.
  rules:
    authentication:
      api-key-authn:
        apiKey:
          allNamespaces: false
          selector:
            matchLabels:
              app: partner
        credentials:
          queryString:
            name: APIKEY
        metrics: false
        priority: 0
    # IDENTIDADE COMO HEADER -- e o que torna possivel medir consumo POR
    # PARCEIRO, e nao so por plano.
    #
    # A armadilha 3 (RUNBOOK) documenta que nao da para rotular a metrica do
    # LIMITADOR por parceiro: o PlanPolicy reescreve o bloco
    # response.success.dynamicMetadata inteiro do AuthConfig gerado e descarta o
    # que o AuthPolicy declarar ali. Isso continua verdade.
    #
    # O que NAO e verdade -- medido neste cluster -- e que o PlanPolicy leve
    # junto os HEADERS. Ele nao leva:
    #
    #   oc get authconfig -n kuadrant-system -o json | \
    #     python3 -c "...['spec']['response']['success'].keys()"
    #   -> headers: ['x-partner']   dynamicMetadata: ['kuadrant']
    #
    # Com o header injetado, o Telemetry do Istio o transforma em dimensao das
    # metricas do gateway (ver base/policies-telemetry/istio-partner-dimension.yaml),
    # e ai existe consumo e recusa por parceiro. Inclusive o 429, que nasce no
    # gateway e nunca chega a aplicacao:
    #
    #   istio_requests_total{partner="apikey-blue", response_code="429"} = 2
    #
    # O 401 sai com partner="unknown" (e assim que o Istio preenche dimensao
    # cujo header nao existe), o que esta correto: a autenticacao falhou e nao
    # ha identidade para injetar. Medido: chave do portal vira 'bob'; chave do
    # repo, sem a annotation, vira 'apikey-gold-globex'.
    #
    # O valor prefere a annotation que o developer portal grava (user-id, o
    # nome de quem pediu a chave) e cai para o nome do Secret quando ela nao
    # existe -- que e o caso das chaves criadas pelo repo. Mesma forma de
    # guarda dos predicados do PlanPolicy: indexar chave ausente em CEL ERRA.
    response:
      success:
        headers:
          x-partner:
            plain:
              expression: 'has(auth.identity.metadata.annotations) && "secret.kuadrant.io/user-id" in auth.identity.metadata.annotations ? auth.identity.metadata.annotations["secret.kuadrant.io/user-id"] : auth.identity.metadata.name'
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: travel-agency
