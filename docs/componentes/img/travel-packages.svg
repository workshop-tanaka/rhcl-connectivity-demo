<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif">
  <defs>
    <marker id="seta-verde" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="seta-vermelha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fff"/>
  <text x="360" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">travel-packages: caminho da requisição e cadeia do CDC</text>

  <!-- cliente -->
  <rect x="12" y="34" width="76" height="40" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="50" y="58" text-anchor="middle" font-size="11" fill="#1e293b">cliente</text>

  <!-- Gateway prod-web -->
  <rect x="116" y="26" width="140" height="56" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="186" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Gateway prod-web</text>
  <text x="186" y="58" text-anchor="middle" font-size="9" fill="#64748b">ingress-gateway (istio)</text>
  <text x="186" y="70" text-anchor="middle" font-size="9" fill="#64748b">Route passthrough :443</text>

  <!-- fluxo cliente -> gateway -->
  <line x1="88" y1="66" x2="112" y2="66" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-verde)"/>

  <!-- fluxo gateway -> EAP -->
  <line x1="256" y1="66" x2="316" y2="66" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-verde)"/>
  <text x="288" y="50" text-anchor="middle" font-size="9" fill="#16a34a">HTTPRoute /api</text>

  <!-- EAP: componente central -->
  <rect x="320" y="26" width="180" height="64" rx="8" fill="#2563eb"/>
  <text x="410" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">travel-packages</text>
  <text x="410" y="60" text-anchor="middle" font-size="10" fill="#fff">JBoss EAP 8 · WildFlyServer</text>
  <text x="410" y="74" text-anchor="middle" font-size="10" fill="#fff">2 réplicas · :8080 · /api</text>

  <!-- cano paralelo vetado (disableHTTPRoute) -->
  <polyline points="50,74 50,120 340,120 340,96" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#seta-vermelha)"/>
  <text x="60" y="110" font-size="9" fill="#dc2626">rota direta do operador: desativada (disableHTTPRoute)</text>
  <text x="60" y="133" font-size="9" fill="#dc2626">entraria sem AuthPolicy — cano paralelo</text>

  <!-- Data Grid -->
  <rect x="540" y="120" width="168" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="624" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Data Grid travel-cache</text>
  <text x="624" y="156" text-anchor="middle" font-size="9" fill="#64748b">Infinispan · 3 nós · :11222</text>
  <text x="624" y="170" text-anchor="middle" font-size="9" fill="#64748b">cache 'pacotes' · owners=2 · 5 min</text>

  <!-- fluxo EAP -> Data Grid -->
  <line x1="500" y1="80" x2="536" y2="126" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-verde)"/>
  <text x="624" y="112" text-anchor="middle" font-size="9" fill="#16a34a">Hot Rod · get/put 'contagem:&lt;destino&gt;'</text>

  <!-- Postgres -->
  <rect x="300" y="214" width="190" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="395" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Postgres travel-packages-db</text>
  <text x="395" y="250" text-anchor="middle" font-size="9" fill="#64748b">CloudNativePG · travel-db · :5432</text>
  <text x="395" y="264" text-anchor="middle" font-size="9" fill="#64748b">2 instâncias · wal_level=logical</text>

  <!-- fluxo EAP -> Postgres -->
  <line x1="410" y1="90" x2="410" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-verde)"/>
  <text x="418" y="152" font-size="9" fill="#16a34a">JPA (TravelPackagesDS)</text>
  <text x="418" y="166" font-size="9" fill="#16a34a">cache fora = degrada, não cai</text>

  <!-- CronJob mutador -->
  <rect x="12" y="214" width="170" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="97" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">CronJob cdc-mutador</text>
  <text x="97" y="250" text-anchor="middle" font-size="9" fill="#64748b">travel-db · a cada 1 min</text>
  <text x="97" y="264" text-anchor="middle" font-size="9" fill="#64748b">UPDATE / INSERT / DELETE</text>

  <!-- fluxo mutador -> Postgres -->
  <line x1="182" y1="246" x2="296" y2="246" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-verde)"/>
  <text x="239" y="238" text-anchor="middle" font-size="9" fill="#16a34a">mutador.sql</text>

  <!-- Debezium -->
  <rect x="300" y="320" width="190" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="395" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Debezium travel-cdc</text>
  <text x="395" y="356" text-anchor="middle" font-size="9" fill="#64748b">KafkaConnector · pgoutput</text>
  <text x="395" y="370" text-anchor="middle" font-size="9" fill="#64748b">no KafkaConnect 'cdc'</text>

  <!-- fluxo Postgres -> Debezium -->
  <line x1="395" y1="278" x2="395" y2="316" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-verde)"/>
  <text x="403" y="302" font-size="9" fill="#16a34a">WAL · publication travel_pub</text>

  <!-- Kafka -->
  <rect x="540" y="318" width="168" height="66" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="624" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Kafka travel-streams</text>
  <text x="624" y="354" text-anchor="middle" font-size="9" fill="#64748b">3 nós KRaft · :9092</text>
  <text x="624" y="368" text-anchor="middle" font-size="9" fill="#64748b">tópicos travel.public.*</text>

  <!-- fluxo Debezium -> Kafka -->
  <line x1="490" y1="352" x2="536" y2="352" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-verde)"/>
  <text x="513" y="344" text-anchor="middle" font-size="9" fill="#16a34a">eventos</text>

  <!-- legenda -->
  <line x1="16" y1="330" x2="44" y2="330" stroke="#16a34a" stroke-width="1.5"/>
  <text x="50" y="334" font-size="9" fill="#1e293b">fluxo de dados</text>
  <line x1="16" y1="350" x2="44" y2="350" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="50" y="354" font-size="9" fill="#1e293b">caminho desativado</text>
</svg>
