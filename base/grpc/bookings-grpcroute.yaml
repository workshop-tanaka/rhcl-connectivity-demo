# ===========================================================================
# GRPCRoute -- o roteamento gRPC no MESMO Gateway dos demais.
#
# Hostname de UM rotulo sob .apps, como todo o resto desta demo:
# 'grpc-travels.apps...' e nao 'grpc.travels.apps...'. O wildcard do cluster
# cobre um nivel so, e o segundo ponto quebra a resolucao -- ver a §5.6 do
# CONHECIMENTO.
#
# O matches por servico e metodo e o que torna a cena interessante: da para
# aplicar policy diferente por METODO gRPC, do mesmo jeito que se faz por path
# em HTTP.
# ===========================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  annotations:
    rhcl.demo/autor: Sandro Tanaka
  name: bookings-grpc
  namespace: travel-agency
spec:
  parentRefs:
    - name: prod-web
      namespace: ingress-gateway
  hostnames:
    # __DOMAIN__ e substituido por quem aplica (provision.sh / o snippet do
    # README). Ate 2026-09-20 este arquivo trazia o dominio de um cluster
    # ANTIGO cravado: aplicado noutro cluster, a GRPCRoute nascia Accepted com
    # um hostname que nao resolve, e a falha so aparecia no primeiro grpcurl.
    - grpc-travels.__DOMAIN__
  # UMA regra, sem match por metodo -- e a escolha custou uma investigacao.
  #
  # A versao anterior tinha duas regras (uma para helloworld.Greeter, outra para
  # os servicos de reflection do grpcurl). O Kuadrant gera uma entrada de filtro
  # POR REGRA, e a RateLimitPolicy acabou ancorada apenas nas regras de
  # reflection: o predicado do limite era
  # request.url_path.startsWith('/grpc.reflection.v1alpha.ServerReflection/').
  #
  # Efeito: chamadas ao Greeter passavam sem contar, com a policy reportando
  # Enforced=True e o limite corretamente carregado no Limitador. Oito chamadas
  # seguidas passavam num teto de cinco. Medido em 2026-08-28.
  #
  # Roteando tudo numa regra so, auth e limite valem para o hostname inteiro --
  # que e o que a cena precisa. Match por metodo continua possivel e fica para
  # quando houver policy distinta por metodo para mostrar.
  rules:
    - backendRefs:
        - name: bookings-grpc
          port: 9000
