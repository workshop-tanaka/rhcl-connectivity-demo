apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.name }}
  template:
    metadata:
      labels:
        app: ${{ values.name }}
      annotations:
        # A demo roda com Service Mesh; sem o sidecar a rota funciona, mas o
        # trafego nao aparece no Kiali junto com o resto do travel-agency.
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: ${{ values.name }}
          image: ${{ values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${{ values.port }}
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
