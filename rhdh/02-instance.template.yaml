# ===========================================================================
# Red Hat Developer Hub — instancia (CR Backstage) + configuracao.
#
# Template: ${RHDH_HOST} e ${RHDH_NS} sao substituidos pelo install.sh -- o
# hostname real da rota (derivado do dominio de apps) e o namespace de destino.
# O namespace era fixo em 'rhdh' ate 2026-08-17, o que fazia RHDH_NS ser aceito
# pelo script e ignorado aqui: uma instancia "isolada" caia por cima da que ja
# existia. Nada mais e interpolado --
# ${BACKEND_SECRET} abaixo e resolvido pelo PROPRIO Backstage em runtime, a
# partir da variavel de ambiente injetada pelo Secret; nao pode ser expandido
# aqui, senao o segredo iria em claro para dentro do ConfigMap.
# ===========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ${RHDH_NS}
---
# ---------------------------------------------------------------------------
# Configuracao da aplicacao.
#
# baseUrl/cors precisam bater EXATAMENTE com a URL publica da rota: o frontend
# do Backstage monta as chamadas de API a partir de app.baseUrl, e o backend
# recusa origens que nao constem em backend.cors.origin. Por isso a rota tem
# host fixo (spec.application.route.host no CR) em vez do host gerado pelo
# OpenShift -- o host precisa ser conhecido ANTES de o pod subir.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: ${RHDH_NS}
data:
  app-config-rhdh.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://${RHDH_HOST}

    backend:
      baseUrl: https://${RHDH_HOST}
      cors:
        origin: https://${RHDH_HOST}
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: "${BACKEND_SECRET}"
          # ----- automacao -----
          # O guest saiu, e com ele o caminho que scripts usavam para falar com
          # a API ('api/auth/guest/refresh'). Automacao nao deve entrar como
          # usuario: entra como SERVICO, que e para isto que serve o
          # externalAccess.
          #
          # 'static' e nao 'legacy': o legacy espera um JWT assinado com o
          # segredo, nao o segredo cru -- mandar o BACKEND_SECRET como Bearer
          # devolve 'Illegal token' (medido em 2026-08-25). O static aceita o
          # valor como esta.
          - type: static
            options:
              token: "${AUTOMATION_TOKEN}"
              subject: automation

    # ----- login -----
    # GitLab como IdP, e nao apenas como SCM. Resolve duas coisas de uma vez:
    # quem a pessoa e no portal, E o token que o scaffolder usa para agir como
    # ela no GitLab. Um mecanismo em vez de dois -- e e o que torna literal a
    # frase do RUNBOOK sobre a assinatura ficar "em git, com autor e data".
    #
    # SEM guest. Ele nao esta comentado nem desabilitado: nao existe mais.
    # 'environment: production' tambem passa a valer, entao nao ha porta lateral.
    #
    # O resolver casa o username do GitLab com User:default/<nome>. As quatro
    # personas existem no catalogo (rhdh/catalog/travel-agency.yaml); sem a
    # entidade, o login acontece e a sessao morre em "user not found".
    auth:
      environment: production
      providers:
        gitlab:
          production:
            clientId: ${GITLAB_OAUTH_CLIENT_ID}
            clientSecret: ${GITLAB_OAUTH_CLIENT_SECRET}
            audience: https://${GITLAB_HOST}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
    signInPage: gitlab

    # 'locations' NAO e definido aqui de proposito: quem define e o
    # app-config-rhdh-catalog (setup-catalog.sh). Arrays nao se somam entre
    # arquivos de config do Backstage -- o ultimo vence -- entao declarar uma
    # lista vazia aqui competiria com a camada de catalogo.
    catalog:
      rules:
        - allow: [Component, System, Domain, Group, User, Resource, Location, Template, API, APIProduct]
---
# ---------------------------------------------------------------------------
# Instancia RHDH.
#
# database.enableLocalDb: o operator sobe um PostgreSQL proprio com PVC
# (storageClass default do cluster). Para producao, apontar para um Postgres
# externo via spec.database.authSecretName e enableLocalDb: false.
# ---------------------------------------------------------------------------
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: ${RHDH_CR}
  namespace: ${RHDH_NS}
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    extraEnvs:
      secrets:
        - name: rhdh-backend-secret
    route:
      enabled: true
      host: ${RHDH_HOST}
  database:
    enableLocalDb: true
