# Valida os manifests da demo a cada push.
#
# Existe por dois motivos. O primeiro e util de verdade: esta sessao perdeu
# tempo mais de uma vez com YAML invalido que so aparecia depois de um rollout
# de ~7 min -- um 'description:' nao-quotado contendo ': ' derrubou 6 entidades
# do catalogo sem erro visivel. Isso e barato de pegar aqui.
#
# O segundo: a aba GitHub Actions do portal precisa de execucoes reais para
# deixar de ser uma aba vazia.
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  yaml:
    name: YAML e catalogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Parsear todo YAML versionado
        run: |
          fail=0
          # skeleton/ fica de fora: contem ${{ }} do scaffolder, que nao e YAML final
          while IFS= read -r f; do
            case "$f" in */skeleton/*) continue;; esac
            if ! yq 'true' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::YAML invalido"
              yq 'true' "$f" 2>&1 | head -2
              fail=1
            fi
          done < <(git ls-files '*.yaml' '*.yml')
          exit $fail

      - name: Entidades do catalogo tem kind e name
        run: |
          fail=0
          for f in rhdh/catalog/*.yaml; do
            [ -f "$f" ] || continue
            n=$(yq 'select(.kind != null) | .metadata.name' "$f" 2>/dev/null | grep -c . || true)
            k=$(yq 'select(.kind != null) | .kind' "$f" 2>/dev/null | grep -c . || true)
            echo "  $f: $k kinds, $n names"
            [ "$k" = "$n" ] || { echo "::error file=$f::kind sem name correspondente"; fail=1; }
          done
          exit $fail

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n em todo script
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::erro de sintaxe"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail
