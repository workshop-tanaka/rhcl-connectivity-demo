# ===========================================================================
# A entidade que o PROPRIO REPOSITORIO declara.
#
# POR QUE AQUI E NAO EM rhdh/catalog/: as entidades daquele diretorio sao
# servidas por um httpd interno e registradas por location fixa -- corretas
# para o que a demo descreve (policies, APIs, personas), mas nao para codigo.
# Este arquivo faz o servico se registrar SOZINHO: o
# catalog-backend-module-gitlab varre o grupo rhcl a cada 30 minutos e importa
# todo projeto que tenha um catalog-info.yaml na raiz.
#
# Foi medido em 2026-08-28: com o provider ligado e nenhum catalog-info.yaml,
# o log dizia "Processed 0 from scanned 12 projects" -- ele encontrava os
# projetos e nao tinha o que importar.
#
# ---------------------------------------------------------------------------
# __DOMAIN__ E __GITLAB_HOST__ sao substituidos pelo scripts/gitlab-seed.sh no
# momento da semeadura. Hostname embutido em arquivo versionado e proibido
# neste repo -- o cluster e efemero, e um link para o cluster anterior no
# portal e pior que link nenhum.
#
# AS ANOTACOES SAO O QUE ACENDE CADA ABA, e cada uma tem um par no cluster.
# Anotacao sem o recurso do outro lado produz aba vazia, que e pior que aba
# ausente -- a regra que o rhdh/README.md estabeleceu.
# ===========================================================================
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: travel-packages
  title: Travel Packages
  description: >-
    Catalogo de pacotes de viagem: JBoss EAP 8 sobre PostgreSQL, com cache no
    Data Grid e mudancas publicadas por CDC no Kafka. E o primeiro artefato
    desta demo que passa pela cadeia de suprimento inteira -- compilado,
    analisado, assinado e registrado no log de transparencia.
  annotations:
    # O par que faz a aba Kubernetes e a Topology mostrarem os pods. E o
    # SELETOR que decide o que o plugin enxerga, e nao o kubernetes-id.
    backstage.io/kubernetes-id: travel-packages
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=travel-packages

    # A aba CI. O par com os labels da Pipeline e do PipelineRun em
    # platform-reference/pipelines/build-travel-packages.yaml.
    janus-idp.io/tekton: travel-packages

    # Merge requests e issues ficam no GitLab, alcancaveis pelos links abaixo:
    # o plugin de frontend do GitLab nao tem versao para o Backstage 1.49.x
    # (a apuracao esta em rhdh/setup-plugins.sh). A anotacao fica porque e
    # correta e inerte, e volta a valer no dia em que houver build.
    gitlab.com/project-slug: rhcl/travel/travel-packages

    # Qualidade: o projeto que a task 'portao-de-qualidade' analisa.
    sonarqube.org/project-key: com.redhat.travel:travel-packages

    # Dashboards do Grafana etiquetados para este servico.
    grafana/dashboard-selector: "tags @> 'travel-packages'"
  tags:
    - java
    - jakarta-ee
    - eap
    - postgresql
    - datagrid
    - kafka
    - cdc
  links:
    - url: https://pacotes-travels.__DOMAIN__/api/pacotes
      title: API de pacotes (pela borda do RHCL)
      icon: web
    - url: https://__GITLAB_HOST__/rhcl/travel/travel-packages/-/merge_requests
      title: Merge requests
      icon: web
    - url: https://__GITLAB_HOST__/rhcl/travel/travel-packages/-/issues
      title: Issues
      icon: web
    - url: https://registry-quay-quay.__DOMAIN__/repository/rhcl/travel-packages
      title: Imagem assinada no Quay
      icon: web
spec:
  type: service
  lifecycle: production
  owner: group:default/plataforma
  system: travel-agency
  providesApis:
    - travel-packages-api
  dependsOn:
    - resource:default/travel-packages-db
    - resource:default/travel-cache
