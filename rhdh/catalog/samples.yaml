# ---------------------------------------------------------------------------
# A API do bookinfo -- descrita AQUI, e nao ingerida de um APIProduct.
#
# A travels-api chega ao portal pelo provider do plugin Kuadrant, que ingere o
# APIProduct do cluster (por isso ela esta em entidades-externas.txt). O
# bookinfo nao tem APIProduct: a AuthPolicy dele seleciona a chave por LABEL
# (devportal.kuadrant.io/apiproduct=bookinfo-api), que e so um label -- nao
# exige o CR. Criar um APIProduct so para a entidade existir poria a amostra na
# dependencia das CRDs de devportal, que so existem no RHCL 1.4.2+.
#
# O spec e INLINE e nao uma URL: o backend do RHDH busca definicao remota, e um
# 'openAPISpecURL' apontando para o raw do GitLab do cluster e mais uma coisa
# que quebra quando o cluster muda. Os quatro caminhos abaixo sao os que o
# bookinfo publica de verdade -- estao no swagger.yaml do upstream.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: bookinfo-api
  title: Bookinfo API
  description: >-
    A API de produtos do bookinfo, publicada em /api/v1 e governada na borda
    pela AuthPolicy bookinfo-api-authpolicy. O servico nao valida credencial por
    conta propria, e o limite depende do plano da chave.
  annotations:
    rhcl.demo/cluster-object: httproute/bookinfo/bookinfo-api
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: sample-bookinfo
  definition: |
    openapi: 3.0.3
    info:
      title: Bookinfo API
      version: "1.0.0"
      description: >-
        API de produtos da amostra bookinfo do Istio, exposta pelo Gateway
        prod-web e governada pelo Red Hat Connectivity Link. A autenticacao e
        por API key na query string, imposta na borda pela AuthPolicy -- o
        productpage nao valida credencial por conta propria.
    security:
      - ApiKeyQuery: []
    paths:
      /api/v1/products:
        get:
          summary: Lista os produtos
          responses:
            "200": { description: OK }
            "401": { description: API key ausente ou invalida (vem da AuthPolicy) }
            "429": { description: "Limite do plano excedido: gold 20/10s, silver 5/10s, free 2/10s" }
      /api/v1/products/{id}:
        get:
          summary: Detalhes de um produto
          parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer }
          responses:
            "200": { description: OK }
            "401": { description: API key ausente ou invalida }
      /api/v1/products/{id}/reviews:
        get:
          summary: Resenhas de um produto
          description: >-
            A versao que responde depende do VirtualService reviews -- 90% v1,
            10% v3, e v2 declarada com zero por cento.
          parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer }
          responses:
            "200": { description: OK }
