# ===========================================================================
# Namespace unico do travel-packages -- servico E dependencias juntos.
#
# Consolidado em 2026-08-31 (eram tres: travel-cache e travel-streams alem
# deste). O QUE NAO MUDOU e o desenho de mesh: so o SERVICO entra na malha.
# O namespace carrega istio-injection: enabled (label -- o webhook nunca le
# annotation, armadilha 5.4), e cada workload que NAO deve ter sidecar faz
# opt-out por label de pod 'sidecar.istio.io/inject: "false"':
#   - Infinispan: JGroups/DNS_PING quebra sob mTLS estrito sem mensagem util;
#   - Kafka/Connect: advertised listeners nao convivem com o sidecar;
#   - CNPG e os Jobs ja faziam opt-out desde 2026-08-28.
# O MySQL do fan-out NAO mora aqui: e do travel-agency e segue em travel-db.
# ===========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: travel-packages
  labels:
    istio-injection: enabled
