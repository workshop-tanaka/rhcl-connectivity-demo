# DestinationRule -- agora com os DOIS subsets. Este arquivo nao move trafego:
# so declara que existem dois grupos e como distingui-los (label 'version').
# Quem move e o VirtualService ao lado.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
spec:
  host: ${{ values.name }}.${{ values.namespace }}.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
