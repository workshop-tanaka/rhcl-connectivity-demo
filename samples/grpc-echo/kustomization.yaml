apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ===========================================================================
# grpc-echo -- a mesma policy sobre gRPC, mais o canario que base/grpc/ nao tem.
#
# Prefixo numerico: o ApplicationSet 'rhcl-samples' sincroniza
# 'manifests/[0-9]*.yaml'. Renomear um arquivo para algo que nao comece com
# digito o tira do Argo EM SILENCIO.
#
# NAO APLICAR COM 'oc apply -k' DIRETO: 20- traz __DOMAIN__.
# ===========================================================================

resources:
  - 00-namespace.yaml
  - 01-echo.yaml
  - 10-mesh-peerauthentication.yaml
  - 11-mesh-destinationrule.yaml
  - 12-mesh-virtualservice.yaml
  - 13-mesh-telemetry.yaml
  - 20-grpcroute.yaml
  - 21-authpolicy.yaml
  - 22-ratelimitpolicy.yaml
  - 23-identity-apikeys.yaml

