# ===========================================================================
# Catalogo RHDH — as quatro amostras do Istio (samples/).
#
# Modela samples/bookinfo, samples/websockets, samples/grpc-echo e
# samples/open-telemetry: o servico, as policies do RHCL, os recursos do
# Service Mesh e a cadeia de suprimento de cada uma.
#
# ---------------------------------------------------------------------------
# POR QUE UM DOMAIN PROPRIO, E NAO 'travel' NEM 'plataforma'
#
# As amostras nao sao produto de negocio: nao vendem passagem nem seguro, e
# poe-las em 'travel' repetiria o erro que o Domain 'plataforma' foi criado
# para corrigir (Authorino e Tempo dentro do dominio de viagens).
#
# E tambem nao sao plataforma: elas nao sustentam a demo -- a demo funciona
# inteira sem elas. Sao MATERIAL DE APOIO, que entra e sai sem tocar no
# roteiro, e e exatamente essa a fronteira que samples/README.md defende.
#
# ---------------------------------------------------------------------------
# TODA ENTIDADE AQUI TEM rhcl.demo/cluster-object, e isso e o que torna este
# arquivo seguro num cluster onde as amostras nao foram aplicadas: o
# setup-catalog.sh confere cada objeto com um 'oc get' e DESCARTA quem nao
# existe. Sem isso, o portal ganharia trinta e poucos cards que nunca carregam
# -- e um portal que mente sobre o cluster e pior do que um portal incompleto.
#
# ---------------------------------------------------------------------------
# O WEBSOCKETS ESTA ADIADO, e as entidades dele FICAM. Nao e contradicao com o
# paragrafo seguinte: elas trazem rhcl.demo/cluster-object como todas as outras,
# entao o setup-catalog.sh as descarta sozinho enquanto o namespace nao existir.
# Quando a amostra voltar -- 'SAMPLES=websockets bash scripts/provision.sh
# samples' --, o catalogo ja a descreve, sem ninguem lembrar de reescrever nada.
#
# E a diferenca entre 'adiado' e 'removido' escrita em codigo: policy do
# Kuadrant nao aplicada SAI daqui, porque nao ha decisao de aplica-la; amostra
# adiada FICA, porque ha.
#
# ---------------------------------------------------------------------------
# NAO HA ENTIDADE DE POLICY DO KUADRANT AQUI, e a ausencia e a decisao de
# 2026-08-28: as amostras sobem SEM RHCL. A camada de policies de cada uma
# existe, pronta, em samples/<nome>/rhcl/, fora do kustomization -- e o catalogo
# so descreve o que e aplicado. Descrever policy que ninguem aplicou daria
# cards que o setup-catalog.sh descartaria de qualquer jeito, e um arquivo que
# mente sobre o cluster ate alguem rodar o filtro.
#
# Quando a camada rhcl/ entrar, as entidades voltam -- elas estao no historico,
# no commit que as tirou.
#
# ---------------------------------------------------------------------------
# ROTULOS: vocabulario de docs/CATALOGO.md. Tres valores novos de
# rhcl.demo/produto entraram por causa deste arquivo -- bookinfo, websockets e
# grpc-echo --, e o scripts/valida-catalogo.sh foi atualizado junto. Eles ficam
# mesmo sem as policies aplicadas: o produto existe, e o que esta pendente e a
# governanca dele. A amostra open-telemetry NAO leva 'produto': ela nao publica
# rota e nao tem chave, e inventar um produto para ela seria dizer que ela vende
# algo.
#
# ${GITLAB_HOST}, ${DEMO_REPO_URL}, ${CONSOLE_HOST} e ${DEVSPACES_HOST} sao
# substituidos pelo rhdh/setup-catalog.sh com valores lidos do cluster.
# ===========================================================================
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: samples
  title: Amostras
  description: >-
    Amostras do projeto Istio adaptadas para Red Hat Connectivity Link e
    OpenShift Service Mesh. Material de apoio: cada uma defende um pedaco da
    tese de que o RHCL e plataforma de API e nao gateway, e nenhuma faz parte
    do roteiro.
  labels:
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - sample
    - istio
spec:
  owner: group:default/platform-team
---
# ---------------------------------------------------------------------------
# System: bookinfo -- a amostra canonica, e a unica com DUAS rotas.
#
# E a segunda coisa a olhar depois do travel-agency, porque e onde a fronteira
# por PRODUTO fica visivel sem explicacao: a mesma aplicacao, no mesmo
# hostname, com a UI publica e a API sob chave e plano.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sample-bookinfo
  title: Amostra — bookinfo
  description: >-
    A amostra canonica do Istio sobre o Service Mesh, com o gateway do upstream.
    Tres versoes vivas de 'reviews' -- canario 90/10 com a v2 declarada em zero
    --, mais quem-fala-com-quem por identidade SPIFFE. A camada de RHCL, que
    acrescenta as duas fronteiras por rota, esta em samples/bookinfo/rhcl/ e nao
    e aplicada.
  annotations:
    # Ancorado no Namespace, como os demais Systems deste catalogo: num cluster
    # sem a etapa 'samples' do provision.sh, o System inteiro sai sozinho.
    # Namespace e cluster-scoped, dai o campo do meio vazio.
    rhcl.demo/cluster-object: namespace//bookinfo
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - istio
    - service-mesh
spec:
  owner: group:default/platform-team
  domain: samples
---
apiVersion: backstage.io/v1alpha1
