# ===========================================================================
# Catalogo RHDH — a camada de DADOS dos pacotes de viagem.
#
# Modela platform-reference/travel-packages/: o Postgres com os pacotes, o
# cache do Data Grid, o topico do AMQ Streams e o CDC que liga os dois. Ate
# 2026-08-28 nada disso existia no catalogo -- o Ato 6 dizia que o portal
# reflete a plataforma, e a plataforma tinha uma camada inteira invisivel.
#
# ROTULOS: vocabulario de docs/CATALOGO.md, conferido por
# scripts/valida-catalogo.sh. Aqui a camada e 'dados', que estava reservada na
# tabela justamente para isto.
#
# rhcl.demo/cluster-object em TODAS as entidades: e o que faz o filtro do
# setup-catalog.sh conferir a existencia antes de publicar. Num cluster sem a
# etapa 'pacotes' do provision.sh, este arquivo inteiro sai do portal sozinho,
# em vez de descrever recursos que nao existem.
# ===========================================================================
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: travel-packages
  title: Pacotes de viagem
  description: >-
    O lastro de dados da demo: pacotes em Postgres, replicados para o cache do
    Data Grid por CDC via Kafka. Existe para a demo ter volume e movimento
    reais -- topico parado se le como integracao quebrada.
  annotations:
    # O System tambem se ancora num objeto real, e o objeto e o NAMESPACE. Sem
    # isto, num cluster sem a etapa 'pacotes' os seis Resources caem e sobra um
    # System vazio -- um card que abre e nao tem nada dentro.
    #
    # Namespace e cluster-scoped, entao o campo do meio fica vazio. O formato
    # aguenta: o setup-catalog.sh monta 'oc get namespace travel-packages -n ""',
    # e o -n vazio e ignorado para recurso sem namespace (medido em 2026-08-28).
    rhcl.demo/cluster-object: namespace//travel-packages
  labels:
    rhcl.demo/camada: dados
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  owner: group:default/platform-team
  domain: travel
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: travel-packages-db
  title: Postgres — pacotes
  description: >-
    Cluster CNPG com a tabela de pacotes. E a FONTE do CDC: o Debezium le o WAL
    daqui, entao o slot de replicacao vive neste cluster e nao no consumidor.
  annotations:
    rhcl.demo/cluster-object: cluster.postgresql.cnpg.io/travel-packages/travel-packages-db
    backstage.io/kubernetes-namespace: travel-packages
  labels:
    rhcl.demo/camada: dados
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  type: database
  owner: group:default/platform-team
  system: travel-packages
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: travel-cache
  title: Data Grid — cache de pacotes
  description: >-
    Infinispan que serve as consultas de pacote sem ir ao banco. E o DESTINO do
    CDC: quem escreve aqui e o conector, nao a aplicacao.
  annotations:
    rhcl.demo/cluster-object: infinispan/travel-packages/travel-cache
    backstage.io/kubernetes-namespace: travel-packages
  labels:
    rhcl.demo/camada: dados
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  type: cache
  owner: group:default/platform-team
  system: travel-packages
  dependsOn:
    - resource:default/travel-cdc
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: travel-streams
  title: AMQ Streams — travel-streams
  description: >-
    O broker Kafka por onde passa a mudanca capturada no Postgres. Um cluster
    dedicado a demo; o topico do CDC nasce do conector, nao declarado a mao.
  annotations:
    rhcl.demo/cluster-object: kafka/travel-packages/travel-streams
    backstage.io/kubernetes-namespace: travel-packages
    # formato do plugin: <nome-do-cluster-no-app-config>/<consumer-group>.
    # 'cache-updater' e o grupo REAL (o consumidor que invalida o Data Grid);
    # 'cdc' e grupo de CONNECT, que a API de consumer groups recusa -- a aba
    # morreria com 'GroupId cdc is not a consumer group' (medido 2026-08-31).
    kafka.apache.org/consumer-groups: travel-streams/cache-updater
  labels:
    rhcl.demo/camada: dados
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  type: message-broker
  owner: group:default/platform-team
  system: travel-packages
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cdc-connect
  title: KafkaConnect — cdc
  description: >-
    O runtime do Connect. Separado do conector de proposito: este e o processo
    que hospeda plugins; o que le o Postgres e o KafkaConnector travel-cdc.
    Confundir os dois e o que faz procurar erro de conexao no lugar errado.
  annotations:
    rhcl.demo/cluster-object: kafkaconnect/travel-packages/cdc
    backstage.io/kubernetes-namespace: travel-packages
  labels:
    rhcl.demo/camada: dados
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  type: stream-processing
  owner: group:default/platform-team
  system: travel-packages
  dependsOn:
    - resource:default/travel-streams
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: travel-cdc
  title: Debezium — travel-cdc
  description: >-
    O conector que captura mudanca no Postgres e publica no Kafka. E a peca que
    torna a replicacao observavel: parar este conector para o cache sem parar o
    banco nem o broker.
  annotations:
    rhcl.demo/cluster-object: kafkaconnector/travel-packages/travel-cdc
    backstage.io/kubernetes-namespace: travel-packages
  labels:
    rhcl.demo/camada: dados
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  type: cdc-connector
  owner: group:default/platform-team
  system: travel-packages
  dependsOn:
    - resource:default/cdc-connect
    - resource:default/travel-packages-db
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cdc-mutador
  title: CronJob — mutador do CDC
  description: >-
    Roda o mutador.sql a cada minuto para o fluxo nao ficar parado. E CronJob e
    nao loop num Deployment: cada rodada e transacao curta, o custo aparece em
    'oc get jobs', e pausar a demo e um patch de suspend -- sem matar pod.
  annotations:
    rhcl.demo/cluster-object: cronjob/travel-packages/cdc-mutador
    backstage.io/kubernetes-namespace: travel-packages
  labels:
    rhcl.demo/camada: dados
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  type: scheduled-job
  owner: group:default/platform-team
  system: travel-packages
  dependsOn:
    - resource:default/travel-packages-db
---
# ---------------------------------------------------------------------------
# A APLICACAO EAP -- o que consome tudo o que esta acima.
#
# Entrou em 2026-08-28. Ate aqui o System travel-packages tinha seis Resources
# e nenhum Component: o portal descrevia o lastro de dados e nao dizia quem o
# le. Consequencia pratica, e nao estetica: o SonarQube, a pipeline e o ACS ja
# mediam este servico, e nao havia entidade onde pendurar as abas.
#
# TODA anotacao abaixo foi conferida na FONTE antes de entrar -- a regra
# real-only vale aqui na forma mais dura: anotacao que aponta para o nada
# produz aba que abre vazia, e vazio no palco le-se como integracao quebrada.
#   sonarqube      api/components/search -> com.redhat.travel:travel-packages
#   acs            api/v1/deployments    -> travel-packages/travel-packages
#   jaeger         api/.../services      -> travel-packages.travel-packages
#   gitlab         api/v4/projects       -> rhcl/travel/travel-packages
#
# SEM anotacao do Quay, de proposito: a pipeline empurra para o registry DO
# CLUSTER, e o plugin de Quay do portal aponta para o quay.io publico. A
# anotacao existiria e mostraria repositorio de outra pessoa.
#
# SEM anotacao do Nexus (nexus-repository-manager/maven.*): o Nexus deste
# cluster esta VAZIO -- nao ha artefato deste build la. Ver o comentario da
# maven-settings em platform-reference/pipelines/build-travel-packages.yaml.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: travel-packages
  title: Pacotes de viagem — EAP
  description: >-
    A aplicacao JBoss EAP que serve o catalogo de pacotes. Le do cache do Data
    Grid, nao do Postgres: quem escreve no cache e o CDC, entao pacote
    desatualizado na tela e sintoma do conector, nao desta aplicacao.
  annotations:
    backstage.io/techdocs-ref: url:${DEMO_REPO_URL}/docs/componentes/travel-packages
    # StatefulSet, e nao Deployment: quem o cria e o operator do EAP a partir
    # do WildFlyServer. Procurar 'deployment/travel-packages' nao acha nada.
    rhcl.demo/cluster-object: statefulset/travel-packages/travel-packages
    # A CHAVE DO SONARQUBE E groupId:artifactId, nao o nome do repositorio.
    # A pipeline nao passa -Dsonar.projectKey: o maven-sonar-plugin a deriva do
    # POM, entao o valor certo so se descobre perguntando ao proprio SonarQube.
    sonarqube.org/project-key: com.redhat.travel:travel-packages
    # O ACS conhece pelo nome do workload, que aqui coincide com o do servico
    # -- diferente do travel-agency, onde os deployments levam sufixo -v1.
    acs/deployment-name: travel-packages
    janus-idp.io/tekton: travel-packages
    gitlab.com/instance: ${GITLAB_HOST}
    gitlab.com/project-slug: rhcl/travel/travel-packages
    backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of=travel-packages
    backstage.io/kubernetes-namespace: travel-packages
    kiali.io/namespace: travel-packages
    jaegertracing.io/service: travel-packages.travel-packages
    # 168h pelo mesmo motivo dos demais: 'd' derruba a aba inteira, e a janela
    # de 1h deixa vazio num cluster sem trafego recente.
    jaegertracing.io/lookback: 168h
    kafka.apache.org/consumer-groups: travel-streams/cache-updater
    # A aba do Nexus so entrou quando o artefato passou a EXISTIR (real-only):
    # a task publica-artefato poe o .war em maven-releases desde 2026-08-31.
    # o app existe desde que o seed rende o manifests/ (modo observacao --
    # quem aplica segue sendo a etapa entrega; o Argo mostra sync/health)
    argocd/app-name: travel-travel-packages
    # 'travel-' duplicado NAO e erro: o AppSet nomeia 'travel-{{repo}}' e o
    # repo ja se chama travel-packages -- medido no controller (7 geradas)
    nexus-repository-manager/config.query: 'maven.groupId=com.redhat.travel&maven.artifactId=travel-packages'
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - ato-6
spec:
  type: service
  lifecycle: production
  # tanaka, e nao platform-team: com o servico em GitOps automatizado
  # (2026-08-31), o dono passa a ser quem responde pelo repositorio.
  owner: user:default/tanaka
  system: travel-packages
  dependsOn:
    - resource:default/travel-cache
    - resource:default/travel-packages-db
