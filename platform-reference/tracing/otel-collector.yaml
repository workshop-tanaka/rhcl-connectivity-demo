# ===========================================================================
# Collector que recebe os spans dos proxies do Istio e entrega ao Tempo.
#
# O 'extensionProviders' do Service Mesh aponta para otel-collector:4317
# (oc get istio default -o jsonpath='{.spec.values.meshConfig.extensionProviders}'),
# entao o caminho inteiro do Ato 5 e:
#
#   proxies Istio -> otel-collector:4317 -> gateway do Tempo -> Tempo
#
# ---------------------------------------------------------------------------
# POR QUE NAO E MAIS 'tempo-tempo:4317' COM TLS INSECURE:
#
# Ligar multitenancy no TempoMonolithic apaga o Service 'tempo-tempo' e poe um
# gateway na frente. O export passa a exigir TRES coisas, e a falta de qualquer
# uma derruba a ingestao inteira sem erro no lado do Service Mesh -- o sintoma fica
# escondido no log do collector:
#
#   Exporting failed. ... "rpc error: code = Unavailable desc = no children to
#   pick from"                      <- Service que sumiu, DNS sem endpoint
#
#   1. TLS de verdade contra a service CA (o gateway serve certificado da CA
#      interna; 'insecure: true' nao passa mais).
#   2. token da ServiceAccount, via extensao bearertokenauth.
#   3. header do tenant. O gateway le 'x-scope-orgid' (--traces.tenant-header).
#
# E RBAC: sem o ClusterRole de escrita no tenant, o gateway aceita a conexao e
# recusa o dado. Ver rbac-tenant-dev.yaml.
#
# A porta 4317 do Service do gateway aponta para o container em 8090
# (grpc-public) -- use 4317, que e o nome estavel do Service.
# ===========================================================================
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: tracing-system
spec:
  mode: deployment
  config:
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # O SPAN PRECISA DIZER DE QUE NAMESPACE E, e quem diz e o COLETOR.
      #
      # O Tempo restringe a leitura de trace por namespace (spec.query.rbac,
      # ligado por 'tenant.sh traces' no cluster de turma) olhando o atributo
      # de recurso 'k8s.namespace.name'. Duas regras, nesta ordem:
      #
      # 1. APAGAR o que o cliente mandou. Qualquer pod do cluster alcanca
      #    otel-collector:4317 e pode enviar um span com o atributo que quiser.
      #    Se o valor do cliente ficasse, um participante carimbaria os spans
      #    dele com o namespace de outro -- e o k8sattributes NAO sobrescreve
      #    atributo que ja existe.
      # 2. GRAVAR o namespace do pod que abriu a conexao. 'from: connection'
      #    e o IP de origem, que o remetente nao escolhe.
      #
      # Isto mora AQUI, e nao so no tenant.sh, porque o provisionamento
      # reaplica este arquivo a cada sync: na primeira versao o processador
      # entrava por 'oc patch' e SUMIA no sync seguinte, sem erro. E com o
      # controle do Tempo ligado e os spans sem a marca, NINGUEM le atributo
      # nenhum, nem o dono, nem o admin (medido em 2026-10-05, cluster-x2gsq:
      # 3 spans, 0 atributos, para os tres) -- falha fechada, e o Modulo 3 fica
      # com a tela vazia.
      #
      # Num ambiente de um participante so o atributo e inofensivo: so mais
      # uma etiqueta no span.
      resource/sem-namespace-do-cliente:
        attributes:
          - key: k8s.namespace.name
            action: delete
      k8sattributes:
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name]
        pod_association:
          - sources:
              - from: connection
      batch: {}
    exporters:
      otlp:
        endpoint: tempo-tempo-gateway.tracing-system.svc.cluster.local:4317
        tls:
          insecure: false
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        auth:
          authenticator: bearertokenauth
        headers:
          X-Scope-OrgID: dev
    service:
      extensions: [bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource/sem-namespace-do-cliente, k8sattributes, batch]
          exporters: [otlp]
---
# O k8sattributes descobre o pod pelo IP da conexao, e para isso le pods,
# namespaces e replicasets do cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8sattributes
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: tracing-system
