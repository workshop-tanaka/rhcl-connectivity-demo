# ===========================================================================
# echo-api como SEGUNDO produto do catalogo.
#
# Por que os tres recursos moram juntos aqui, e nao espalhados como os do
# travel-agency: o echo-api nao faz parte do roteiro original -- ele entra
# inteiro como item de catalogo, e um APIProduct so existe se a rota tiver
# AuthPolicy (identidade) e PlanPolicy (planos) para o controller descobrir.
# Separar em base/ nao serviria: APIProduct e CRD de 1.4, e a base tem de
# continuar aplicavel no cluster 1.2.
#
# Antes disto o echo-api respondia 403 a todos: sem AuthPolicy propria, a rota
# herdava o prod-web-deny-all do Gateway. Desde 2026-09-01 o echo tem gateway
# DEDICADO (echo-web, criado pela etapa 'gateway' do provision.sh) -- e as duas
# herancas que ele perdeu ao sair do prod-web estao espelhadas no fim deste
# arquivo: echo-web-deny-all e echo-web-telemetry.
# ---------------------------------------------------------------------------
# ISOLAMENTO ENTRE PRODUTOS -- a diferenca deliberada em relacao ao travels.
#
# O selector aqui exige DOIS labels: 'app: partner' E
# 'devportal.kuadrant.io/apiproduct: echo-api'. Sem o segundo, qualquer chave
# de parceiro do travels abriria tambem o echo -- e o portal deixaria de
# significar "assinei ESTE produto".
#
# A rota do travels continua so com 'app: partner', de proposito: apertar o
# selector la invalidaria as chaves estaticas de base/identity/, que nao
# carregam o label de produto, e quebraria o Ato 2.
# ===========================================================================
# OIDCPOLICY DESDE 2026-09-01 -- era uma AuthPolicy com regra JWT.
#
# A troca e o que popula a aba OIDC da console do Kuadrant e liga o fluxo de
# navegador: sem credencial, o gateway responde 302 para o Keycloak (antes era
# 401 seco). O CRD gera DUAS AuthPolicies por baixo (echo-api-oidc e
# echo-api-oidc-callback) -- e o APIProduct descobre a primeira, entao a
# vitrine continua Ready.
#
# TRES escolhas medidas neste cluster:
#   endpoints   explicitos porque o default (issuer + /oauth/authorize) nao e
#               o caminho do Keycloak -- o redirect ia para 404;
#   tokenSource authorizationHeader, e nao o default (cookie): as fontes sao
#               EXCLUSIVAS, e cookie quebraria todo o contrato Bearer
#               (Postman, traffic.sh, PlanPolicy por claim -- 403/429). O
#               fluxo de navegador completo (login -> cookie jwt -> sessao)
#               foi validado e fica a um switch: trocar tokenSource para
#               cookie {name: jwt}. O client echo-api ja tem o redirectUri.
#   x-partner   se foi: OIDCPolicy nao tem secao de response. As series por
#               parceiro do echo param; as por PLANO continuam, via
#               TelemetryPolicy (auth.kuadrant.plan).
#
# As URLs abaixo sao do cluster de REFERENCIA e sao reescritas pela camada
# env/cluster-<slug> (patch-authpolicy-echo-issuer.yaml, gerado por
# new-env.sh -- o nome do arquivo ficou pelo historico).
apiVersion: extensions.kuadrant.io/v1alpha1
kind: OIDCPolicy
metadata:
  name: echo-api-oidc
  namespace: echo-api
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo-api
  provider:
    issuerURL: https://sso.apps.cluster-w4xtj.dyn.redhatworkshops.io/realms/sso
    clientID: echo-api
    authorizationEndpoint: https://sso.apps.cluster-w4xtj.dyn.redhatworkshops.io/realms/sso/protocol/openid-connect/auth
    tokenEndpoint: https://sso.apps.cluster-w4xtj.dyn.redhatworkshops.io/realms/sso/protocol/openid-connect/token
  auth:
    tokenSource:
      authorizationHeader:
        prefix: Bearer
---
# UM plano so, e o predicate e 'true'.
#
# O PlanPolicy nao esta aqui para contar a historia de tiers -- isso e o Ato 2,
# no travels. Ele esta aqui porque sem ele NAO SE EMITE CHAVE: 'spec.planTier' e
# obrigatorio no CRD do APIKey e tem de resolver para um tier existente na rota.
# Sem PlanPolicy o APIProduct continua Ready, mas todo APIKey fica preso em
# 'Pending=AwaitingApproval' e o produto vira vitrine sem assinatura possivel.
# Medido neste cluster.
#
# Com um unico tier de predicate 'true' nao existe o fail-open do plan-id: nao
# ha indexacao de label para errar em CEL, e nao ha identidade sem plano. Por
# isso tambem nao ha catch-all -- este plano JA e o catch-all.
apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: echo-plans
  namespace: echo-api
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo-api
  # Planos por IDENTIDADE (claim), nao por label de Secret -- o argumento que
  # a versao por chave nao consegue fazer: o tier acompanha QUEM voce e no
  # Keycloak. Mesmos limites do travels para a historia ficar simetrica; o
  # free e o catch-all com 'true' por ultimo (ordem importa).
  plans:
    - tier: gold
      predicate: 'auth.identity.preferred_username in ["globex-travel", "sistema-teste"]'
      limits:
        custom:
          - limit: 30
            window: 10s
    - tier: silver
      predicate: 'auth.identity.preferred_username == "initech-voyages"'
      limits:
        custom:
          - limit: 10
            window: 10s
    - tier: free
      predicate: 'true'
      limits:
        custom:
          - limit: 3
            window: 10s
---
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  annotations:
    backstage.io/owner: group:default/platform-team
  name: echo-api
  namespace: echo-api
spec:
  displayName: Echo API
  # O workload por tras e um httpd (ubi9/httpd-24) servindo a pagina de teste
  # padrao do RHEL -- que o proprio httpd entrega com status 403, pelo
  # welcome.conf. Nao e um echo: nao devolve o request. A descricao diz o que a
  # coisa e, para ninguem no catalogo esperar 200 com o payload de volta.
  description: >-
    Endpoint de teste da plataforma. Serve uma pagina estatica atras do mesmo
    Gateway das APIs de negocio -- util para validar chave, rota e limite de
    ponta a ponta antes de integrar com a API real. Responde 403 por design
    (pagina de boas-vindas do httpd); o que importa aqui e o 401 sem chave e o
    429 acima do limite.
  version: v1
  approvalMode: automatic
  publishStatus: Published
  tags:
    - utility
    - diagnostics
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo-api
---
# ===========================================================================
# AS DUAS HERANCAS DO GATEWAY DEDICADO -- "de resto tudo igual" (2026-09-01).
#
# Ao sair do prod-web, o echo perdia o que toda rota atras daquele Gateway
# herda: o deny-all (rota sem policy propria fica FORA DO AR, nao aberta) e a
# TelemetryPolicy (as series por plan/method/vhost do Ato 4). Os dois espelhos
# abaixo moram no namespace do alvo -- policy de Gateway exige isso -- e por
# isso declaram ingress-gateway, nao echo-api.
#
# A OIDC do echo NAO esta aqui e nao mudou: a AuthPolicy keycloak-jwt acima
# mira a HTTPRoute, e policy de rota SOBREPOE a de gateway -- exatamente como
# no par prod-web / travels.
# ===========================================================================
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: echo-web-deny-all
  namespace: ingress-gateway
spec:
  rules:
    authorization:
      deny-all:
        metrics: false
        opa:
          allValues: false
          # 'false' nega. A historia do 'allow = true' que nao negava esta em
          # base/policies-security/prod-web-deny-all.yaml -- mesma regra aqui.
          rego: allow = false
        priority: 0
    response:
      unauthorized:
        body:
          value: |
            {
              "error": "Forbidden",
              "message": "Access denied by default by the gateway operator. If you are the administrator of the service, create a specific auth policy for the route."
            }
        headers:
          content-type:
            value: application/json
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: echo-web
---
apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: echo-web-telemetry
  namespace: ingress-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: echo-web
  metrics:
    default:
      labels:
        # Identicas as do prod-web-telemetry -- e a mesma tela do Grafana que
        # quebra a serie por plano, agora tambem para o gateway do echo.
        plan: 'auth.kuadrant.plan'
        method: 'request.method'
        vhost: 'request.host'
