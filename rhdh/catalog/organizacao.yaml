apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: travel
  description: Dominio de negocio da demo de conectividade.
  labels:
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  owner: group:default/platform-team
---
# ---------------------------------------------------------------------------
# Domain: plataforma.
#
# EXISTE PARA TIRAR A PLATAFORMA DE DENTRO DO NEGOCIO. Ate 2026-08-28 os tres
# Systems declaravam 'domain: travel' -- inclusive o 'plataforma', o que punha
# Authorino, Limitador, Tempo, Argo CD, GitLab e Keycloak dentro do dominio de
# negocio de viagens. Nao quebrava nada: o Backstage aceita, a pagina do
# dominio abre, e a lista simplesmente mistura o que sustenta a demo com o que
# a demo vende.
#
# A separacao e o que faz a pergunta "o que e nosso negocio e o que e
# infraestrutura?" ter resposta na tela -- que e a mesma pergunta que o rotulo
# rhcl.demo/camada responde no nivel da entidade. Aqui ela vale no nivel do
# System.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: plataforma
  description: >-
    Plataforma que executa a demo: control plane do RHCL, Service Mesh,
    observabilidade, GitOps e identidade. Nao e produto -- e o que sustenta os
    produtos do dominio travel.
  labels:
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  owner: group:default/platform-team
---
# O usuario de SISTEMA do trafego de teste (2026-08-31). Nao e pessoa e nao
# loga: e a identidade que as chaves apikey-teste-* carregam no user-id -- o
# x-partner de todo trafego de script/Postman vira 'sistema-teste', e filtrar
# teste vs cena no Grafana/Kiali/Tempo e um clique. A tag 'teste' faz o mesmo
# no catalogo.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: sistema-teste
  description: >-
    Conta de sistema do trafego de teste (traffic.sh TESTE=1, modo pacotes e
    Postman). Tudo que ela gera aparece como parceiro 'sistema-teste' nas
    metricas -- separavel da cena num filtro.
  labels:
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - teste
spec:
  profile:
    displayName: Sistema de Teste
    email: sistema-teste@travel-agency.demo
  memberOf:
    - group:default/parceiros
---
