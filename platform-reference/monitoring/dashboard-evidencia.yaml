# ===========================================================================
# Dashboard 'Evidencia dos atos'.
#
# POR QUE ISTO EXISTE: a evidencia de cada ato estava so no Explore do Grafana,
# e o Explore exige papel Editor. Este Grafana permite acesso ANONIMO sem
# declarar papel, e o default do Grafana nesse caso e Viewer -- que NAO tem
# Explore. A tela nao da erro: ela redireciona para a home, e quem chega ali
# conclui que a funcionalidade nao existe (medido em 2026-09-18).
#
# Dashboard, ao contrario, Viewer enxerga. Entao a evidencia que dependia de
# login vira uma tela que qualquer um abre -- inclusive a plateia, se o link
# for projetado.
#
# As consultas NAO sao ilustrativas: cada uma foi executada contra o Thanos
# deste cluster antes de entrar aqui. A do Ato 1 chegou a ser escrita errada --
# filtrando por destination_workload=travels-v1, que e exatamente onde o 401
# NAO aparece, porque a requisicao nunca chega ao destino. A versao correta
# mostra destination_workload='unknown', e esse 'unknown' e o argumento do ato
# inteiro numa linha de tabela.
#
# ROTULO 'A.n' NO TITULO. No palco o apresentador diz "vamos ao Ato 2" e a
# plateia precisa achar o painel sem procurar. Titulo que so descreve a metrica
# ('Servidas por plano') obriga quem assiste a mapear metrica -> ato de cabeca,
# e quem apresenta a dizer "aquele ali embaixo". O prefixo resolve, e sobrevive
# a reordenacao dos paineis.
#
# NUMERO INTEIRO, E NUMERO GRANDE.
#
# 1. round() em toda contagem. increase() EXTRAPOLA: ele ajusta o valor para a
#    janela inteira mesmo quando o contador so existe em parte dela, e devolve
#    12.413793103448278 para 12 recusas reais (medido em 2026-09-18). No palco
#    um numero quebrado onde a plateia contou inteiros levanta a pergunta
#    errada. 'limited_calls - limited_calls offset 15m' devolve 12 tambem, mas
#    round(increase(...)) e mais simples e aguenta reinicio de contador.
#
# 2. BARRA, nao curva e nao numero solto. A pergunta do palco e comparativa --
#    "qual plano saturou", "quanto foi para v2" --, e barra responde isso pela
#    PROPORCAO, antes de alguem ler o numero: a do free cheia ao lado da do gold
#    vazia e o argumento do Ato 2 inteiro, sem comparar digitos de cabeca. O
#    numero continua escrito na barra, entao nao se perde nada.
#
#    Curva exige interpretar eixo e o roteiro nao da tempo. Numero solto obriga
#    a plateia a comparar mentalmente 12, 4 e 0.
#
#    TABELA sobrevive onde ha DUAS dimensoes (codigo + destino), porque ali o
#    par e a informacao: '401 -> unknown' nao vira barra.
#
# (nota historica) Paineis de NUMERO, nao de curva. A pergunta do palco e "quantas foram",
#    nao "como variou": o stat mostra 12 em corpo grande, legivel do fundo da
#    sala. Curva exige a plateia interpretar eixo, e o roteiro nao da tempo.
#    As tabelas sobrevivem onde ha DUAS dimensoes (codigo + destino), porque ali
#    o par e a informacao.
#
# CONTAGEM, NAO TAXA. Os paineis de serie usam increase() e nao rate(), e a
# unidade e 'short' e nao 'reqps'. Medido em 2026-09-18, na mesma rajada do
# Ato 2: rate devolve 0,122 req/s e increase devolve 22. A plateia entende 22
# recusas; ninguem entende 0,122 por segundo -- e o roteiro fala em contagem o
# tempo todo ("3 servidas, 11 limitadas"), entao o painel em taxa CONTRADIZ a
# narracao.
#
# A janela de 2 min e deliberada: o roteiro pausa entre movimentos, e com 1 min
# o painel zera enquanto o apresentador fala, o que se le como "parou de
# funcionar".
#
# Datasource explicito por '${datasource}', pelo mesmo motivo do
# dashboard-negocio-planos: painel sem datasource declarado usa o DEFAULT, e
# em cluster com mais de um default o painel abre 'No data' no palco.
# ===========================================================================
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rhcl-evidencia
  namespace: monitoring
  labels:
    rhcl.demo/camada: monitoring
spec:
  folder: Negocio
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "title": "Evidencia dos atos (A.1 a A.7)",
      "uid": "rhcl-evidencia",
      "tags": [
        "rhcl",
        "demo",
        "evidencia"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Thanos",
              "value": "thanos",
              "selected": true
            },
            "options": [],
            "refresh": 1,
            "hide": 0,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "A.1 — a borda recusa, e a aplicacao nem e acordada",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "title": "A.1 · 401 na borda: quem foi o destino?",
          "description": "A prova do Ato 1. O destino sai 'unknown' porque NAO HOUVE destino: a recusa aconteceu no gateway e a aplicacao nunca foi chamada. Filtrar por destination_workload=travels-v1 nao mostra o 401 -- e e justamente esse o ponto.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (response_code, destination_workload) (round(increase(istio_requests_total{response_code=\"401\"}[15m])))",
              "legendFormat": "{{response_code}} -> {{destination_workload}}",
              "refId": "A",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
              },
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "lg",
            "footer": {
              "show": false
            }
          }
        },
        {
          "type": "bargauge",
          "title": "A.1 · Recusas por codigo (2 min)",
          "description": "Quantidade de recusas nos ultimos 2 minutos, nao taxa por segundo: a plateia entende '22 recusas', nao '0,122 por segundo' -- e o roteiro fala em contagem o tempo todo. 401 sem credencial, 403 quando a identidade existe mas nao vale para o produto, 429 quando o plano estourou.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (response_code) (round(increase(istio_requests_total{response_code=~\"401|403|429\"}[2m])))",
              "legendFormat": "{{response_code}}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "valueMode": "color",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "minVizWidth": 8,
            "minVizHeight": 16,
            "namePlacement": "left"
          }
        },
        {
          "type": "row",
          "title": "A.2 e A.4 — o plano comercial vira numero",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "A.2 · Servidas por plano (15 min)",
          "description": "O label 'plan' vem do TelemetryPolicy, nao do Limitador. Sem ele a metrica responde 'quantos 429 houve'; com ele responde 'o tier free esta saturando'.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (plan) (round(increase(authorized_calls[15m])))",
              "legendFormat": "{{plan}}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "valueMode": "color",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "minVizWidth": 8,
            "minVizHeight": 16,
            "namePlacement": "left"
          }
        },
        {
          "type": "bargauge",
          "title": "A.2 · Limitadas por plano (15 min)",
          "description": "O 429 quebrado por tier. Se o free aparece sozinho aqui, o corte esta funcionando como o PlanPolicy declara.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (plan) (round(increase(limited_calls[15m])))",
              "legendFormat": "{{plan}}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "valueMode": "color",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "minVizWidth": 8,
            "minVizHeight": 16,
            "namePlacement": "left"
          }
        },
        {
          "type": "row",
          "title": "A.4 — evidencia de ensaio: o trafego de teste e filtravel",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "A.4 · Consumo por parceiro (15 min)",
          "description": "As chaves teste-* carregam a identidade 'sistema-teste', de proposito: o que o Postman ou um ensaio geram vira uma linha propria e nao se mistura com os parceiros da historia.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 19
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (partner) (round(increase(istio_requests_total{destination_workload=\"travels-v1\"}[15m])))",
              "legendFormat": "{{partner}}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "valueMode": "color",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "minVizWidth": 8,
            "minVizHeight": 16,
            "namePlacement": "left"
          }
        },
        {
          "type": "row",
          "title": "A.7 — versao e decisao de plataforma",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "A.7 · Divisao entre v1 e v2 no discounts (5 min)",
          "description": "Os pesos vem da VirtualService, nao do codigo: v1 e v2 sao a mesma imagem. A divisao so existe aqui e no grafo -- nunca na resposta da API.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (destination_version) (round(increase(istio_requests_total{destination_service_name=\"discounts\"}[5m])))",
              "legendFormat": "{{destination_version}}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "valueMode": "color",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "minVizWidth": 8,
            "minVizHeight": 16,
            "namePlacement": "left"
          }
        },
        {
          "type": "gauge",
          "title": "A.7 · Peso efetivo do canario (v2)",
          "description": "O que a VirtualService DECLARA e 10%. Isto e o que o trafego real mediu na janela. E o numero que o Ato 7 promete e que ninguem consegue ver na resposta da API -- v1 e v2 sao a mesma imagem, a divisao so existe aqui e no grafo.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * sum(rate(istio_requests_total{destination_service_name=\"discounts\",destination_version=\"v2\"}[10m])) / sum(rate(istio_requests_total{destination_service_name=\"discounts\"}[10m]))",
              "legendFormat": "v2",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 5
                  },
                  {
                    "color": "orange",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        }
      ]
    }
