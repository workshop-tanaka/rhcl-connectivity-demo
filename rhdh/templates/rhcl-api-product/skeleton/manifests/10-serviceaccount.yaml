# ===========================================================================
# ServiceAccount propria -- e a IDENTIDADE do servico na malha.
#
# Rodar com a 'default' do namespace funcionaria, e e exatamente o que impede
# escrever qualquer regra util depois: o principal SPIFFE que o mTLS prova
# terminaria em /sa/default, indistinguivel de qualquer outra carga do
# namespace. Com SA propria, o servico ganha um nome para ser autorizado (ou
# recusado) em AuthorizationPolicy -- suas e dos vizinhos.
#
# E o mesmo padrao que a demo ja usa: os quatro vendedores do travel-agency
# rodam com 'discount-access-sa' e e por isso que 'discounts' consegue aceitar
# eles e recusar o 'travels'.
# ===========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
