# ===========================================================================
# Dimensao 'partner' nas metricas do Istio.
#
# Par do header x-partner que o AuthPolicy injeta
# (base/policies-security/travel-agency-authpolicy.yaml). Sozinho, nenhum dos
# dois faz nada: o header sem esta Telemetry so trafega, e esta Telemetry sem o
# header produz um rotulo vazio.
#
# POR QUE ISTO EXISTE: a metrica do Limitador nao pode ser rotulada por
# parceiro -- o PlanPolicy reescreve o dynamicMetadata do AuthConfig e descarta
# o que o AuthPolicy declarar la (armadilha 3). A saida e medir do lado da
# Service Mesh, onde a dimensao vem do header da requisicao.
#
# O QUE SE GANHA (medido, nao deduzido):
#
#   istio_requests_total{partner="apikey-gold-globex", response_code="200"}
#   istio_requests_total{partner="apikey-blue",        response_code="429"}
#
# O 429 aparece com rotulo mesmo nascendo no gateway, sem upstream nenhum --
# 'destination_canonical_service' fica 'unknown' nesse caso, o que e correto e
# nao e defeito. O 401 sai como partner="unknown" -- e assim que o Istio
# preenche dimensao cujo header nao existe. Correto: a autenticacao falhou e
# nao ha identidade para injetar.
#
# ---------------------------------------------------------------------------
# CARDINALIDADE, e isto nao e nota de rodape: cada parceiro multiplica series
# por codigo de resposta e por servico de destino. Dezenas de parceiros, tudo
# bem. Milhares, e um problema serio de Prometheus -- e a hora de voltar a
# medir por PLANO e deixar a atribuicao individual para log ou trace.
#
# Escopo: namespace do Gateway, entao vale para toda rota atras do prod-web.
#
# ---------------------------------------------------------------------------
# O BLOCO 'tracing' ABAIXO NAO E ENFEITE -- medido em 2026-09-17, cluster-45bp4.
#
# Uma Telemetry no namespace do workload NAO se mescla com a do rootNamespace:
# ela a SUBSTITUI inteira. Entao esta Telemetry, que existe pelas metricas,
# apagava em silencio o tracing que a Telemetry de istio-system manda emitir --
# e o Gateway, justamente a peca cujo span abre o trace da demo, parava de
# exportar. Nenhum erro em lugar nenhum: o proxy fica com sampling e sem
# provider, o collector nao recebe nada, a aba Traces abre vazia.
#
# Conferir no proprio Envoy, que e onde a verdade mora (AUSENTE = quebrado):
#
#   oc exec -n ingress-gateway <pod-do-gateway> -- pilot-agent request GET config_dump \
#     | python3 -c 'import json,sys; d=json.load(sys.stdin); print([f["typed_config"].get("tracing",{}).get("provider","AUSENTE") for c in d["configs"] if "Listeners" in c["@type"] for l in c.get("dynamic_listeners",[]) for fc in l.get("active_state",{}).get("listener",{}).get("filter_chains",[]) for f in fc.get("filters",[]) if "HttpConnectionManager" in f.get("typed_config",{}).get("@type","")][:1])'
#
# O nome 'otel-tracing' e o provider que platform-reference/mesh-control-plane/
# istio.yaml declara. Onde o CR Istio e de outro dono e usa outro nome (no
# sandbox do workshop e 'otel'), quem corrige e a camada env/ da release.
# ===========================================================================
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  annotations:
    rhcl.demo/autor: Sandro Tanaka
  name: partner-dimension
  namespace: ingress-gateway
spec:
  tracing:
    - providers:
        - name: otel-tracing
      randomSamplingPercentage: 100
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: REQUEST_COUNT
            mode: CLIENT_AND_SERVER
          tagOverrides:
            partner:
              value: "request.headers['x-partner']"
