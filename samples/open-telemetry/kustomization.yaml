apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ===========================================================================
# open-telemetry -- o log de acesso do mesh como telemetria estruturada.
#
# ELA NAO POSSUI MAIS A Telemetry DO BOOKINFO. Ate 2026-08-28 esta amostra
# trazia um 10-telemetry-bookinfo.yaml que SUBSTITUIA a Telemetry de
# samples/bookinfo/14- (mesmo nome, mesmo namespace) para acrescentar o access
# log. Funciona aplicando a mao, na ordem certa; sob Argo CD, nao -- as duas
# Applications passam a disputar o mesmo objeto, e o sample-bookinfo apagou o
# accessLogging. Medido.
#
# Agora esta amostra entrega o COLETOR, e quem declara o consumo e o bookinfo.
# Um objeto, um dono. O provider 'otel-als-sample' e declarado pela etapa
# 'samples' do provision.sh.
#
# Sem __DOMAIN__: esta amostra nao publica rota. Ela e camada de plataforma --
# o que ela mostra e que observabilidade e decisao do control plane, e nao
# feature de gateway.
# ===========================================================================

resources:
  - 00-namespace.yaml
  - 01-collector.yaml
  - 02-mesh-podmonitor.yaml

# Sem bloco 'images': o coletor e gerenciado pelo OpenTelemetry Operator, que
# escolhe a imagem a partir da versao do operador. Fixar imagem aqui brigaria
# com ele a cada upgrade.
