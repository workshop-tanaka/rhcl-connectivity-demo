<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif">
  <defs>
    <marker id="seta-verde" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="seta-vermelha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fff"/>
  <text x="360" y="22" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="bold">cars — um dos quatro vendedores do fan-out da travel-agency</text>

  <!-- travels (vizinho) -->
  <rect x="20" y="72" width="130" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="85" y="96" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">travels</text>
  <text x="85" y="114" text-anchor="middle" fill="#64748b" font-size="10">orquestrador (SA default)</text>

  <!-- pod cars (central) -->
  <rect x="240" y="40" width="230" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="355" y="60" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">Pod cars-v1 (replicas: 1)</text>
  <rect x="255" y="70" width="200" height="42" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="355" y="87" text-anchor="middle" fill="#1e293b" font-size="11">container cars — :8000</text>
  <text x="355" y="102" text-anchor="middle" fill="#64748b" font-size="9">quay.io/kiali/demo_travels_cars:v1</text>
  <rect x="255" y="118" width="200" height="30" rx="4" fill="#fff" stroke="#64748b"/>
  <text x="355" y="137" text-anchor="middle" fill="#1e293b" font-size="11">istio-proxy (sidecar, mTLS)</text>
  <text x="355" y="168" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="bold">SA: discount-access-sa</text>
  <text x="355" y="182" text-anchor="middle" fill="#64748b" font-size="9">traces: zipkin.istio-system:9411, sampling 10%</text>

  <!-- discounts (vizinho) -->
  <rect x="560" y="72" width="140" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="630" y="96" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">discounts</text>
  <text x="630" y="114" text-anchor="middle" fill="#64748b" font-size="10">:8000</text>
  <text x="630" y="146" text-anchor="middle" fill="#64748b" font-size="9">AuthorizationPolicy</text>
  <text x="630" y="158" text-anchor="middle" fill="#64748b" font-size="9">discounts-only-sellers (ALLOW)</text>

  <!-- mysqldb (vizinho) -->
  <rect x="290" y="306" width="150" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="365" y="330" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">mysqldb</text>
  <text x="365" y="348" text-anchor="middle" fill="#64748b" font-size="10">travel-db :3306</text>

  <!-- pod sem o SA (vizinho, fluxo negado) -->
  <rect x="20" y="306" width="150" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="95" y="330" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">pod sem o SA</text>
  <text x="95" y="348" text-anchor="middle" fill="#64748b" font-size="10">(qualquer outro)</text>

  <!-- travels -> cars -->
  <line x1="150" y1="100" x2="236" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="193" y="90" text-anchor="middle" fill="#16a34a" font-size="10">HTTP :8000</text>
  <text x="193" y="118" text-anchor="middle" fill="#64748b" font-size="9">CARS_SERVICE</text>

  <!-- cars -> discounts -->
  <line x1="470" y1="96" x2="556" y2="96" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="513" y="86" text-anchor="middle" fill="#16a34a" font-size="10">mTLS: SA provado</text>
  <text x="513" y="114" text-anchor="middle" fill="#64748b" font-size="9">DISCOUNTS_SERVICE</text>

  <!-- cars -> mysqldb -->
  <line x1="360" y1="190" x2="364" y2="302" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="376" y="250" fill="#16a34a" font-size="10">MYSQL_SERVICE</text>
  <text x="376" y="264" fill="#64748b" font-size="9">senha: Secret mysql-credentials</text>

  <!-- pod sem SA -> discounts (negado) -->
  <line x1="175" y1="318" x2="582" y2="134" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#seta-vermelha)"/>
  <text x="268" y="278" fill="#dc2626" font-size="10">sem discount-access-sa:</text>
  <text x="268" y="292" fill="#dc2626" font-size="10">RBAC: access denied (403)</text>
</svg>
