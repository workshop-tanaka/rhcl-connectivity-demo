# ===========================================================================
# Catalogo RHDH da demo RHCL — travel-agency.
#
# Modela a demo em duas Systems porque as policies do Kuadrant tem escopos
# diferentes e isso importa na hora de explicar:
#   - rhcl-ingress   : Gateway + policies com targetRef no Gateway (valem para
#                      TODA rota anexada -- deny-all, rate limit baixo, DNS, TLS)
#   - travel-agency  : app + policies com targetRef na HTTPRoute (valem so para
#                      esta API -- API key e rate limit por usuario)
#
# ${DEMO_API_HOST} e ${DEMO_ECHO_HOST} sao substituidos pelo setup-catalog.sh
# com os hostnames reais lidos das HTTPRoutes do cluster.
#
# ROTULOS: 'rhcl.demo/*' em metadata.labels e as tags seguem o vocabulario de
# docs/CATALOGO.md -- leia antes de inventar um valor novo. As regras de forma
# de label e de tag NAO sao as mesmas (a tag e mais estrita), e o
# scripts/valida-catalogo.sh recusa o que sair da tabela.
#
#   camada         onde a entidade fica: borda, aplicacao, consumidor, plataforma
#   escopo-policy  so em policy do Kuadrant: gateway (vale para toda rota
#                  anexada) ou rota (vale so para esta API) -- e a distincao
#                  que o Ato 3 explica
#   origem         de onde a entidade nasce: repo, cluster, template
#   produto        travels ou echo
#
# Toda policy do Kuadrant e 'camada: borda', inclusive as que miram a HTTPRoute
# de uma aplicacao: quem as aplica e o gateway, nao o servico.
# ===========================================================================
#
# ESTA FATIA: o System plataforma -- o que EXECUTA as policies. Nao e a
# demo; e o que a sustenta.
---
# =============================================================================
# A PLATAFORMA COMO ENTIDADE
#
# Ate 2026-08-27 o catalogo conhecia as policies e ignorava tudo o que as
# executa. O efeito no palco era um catalogo que descrevia regras sem mostrar
# onde elas rodam -- e a pergunta "onde isso e aplicado?" so tinha resposta no
# console.
#
# Cada Resource abaixo corresponde a um objeto REAL deste cluster, declarado na
# anotacao rhcl.demo/cluster-object no formato <recurso>/<namespace>/<nome>. O
# setup-catalog.sh confere essa anotacao antes de publicar e descarta o que nao
# existir -- mesma disciplina que ja valia para as policies, agora generica.
# =============================================================================
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: plataforma
  title: Plataforma
  description: >-
    O que executa as policies e observa o trafego: plano de controle e de dados
    do Connectivity Link, Service Mesh, observabilidade e as ferramentas de
    entrega. Nao e a demo -- e o que a sustenta.
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  owner: group:default/platform-team
  # 'plataforma', e nao 'travel': o que sustenta a demo nao pertence ao dominio
  # de negocio dela. Ver o comentario do Domain plataforma, mais acima.
  domain: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kuadrant-control-plane
  title: Kuadrant — plano de controle
  description: >-
    O CR que liga o Connectivity Link. E ele que reconcilia toda policy deste
    catalogo: sem ele Accepted nunca vira True, e as regras ficam declaradas sem
    efeito nenhum no trafego.
  annotations:
    rhcl.demo/cluster-object: kuadrant/kuadrant-system/kuadrant
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/kuadrant-system/kuadrant.io~v1beta1~Kuadrant/kuadrant
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - kuadrant
spec:
  type: control-plane
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: authorino
  title: Authorino — onde a autenticacao roda
  description: >-
    Servico externo de autorizacao que o Gateway consulta a cada requisicao. As
    AuthPolicy nao validam nada por si: elas configuram este processo. Quando ele cai,
    a API responde 500 no lugar de 401 -- e a policy nao tem culpa.
  annotations:
    rhcl.demo/cluster-object: authorino/kuadrant-system/authorino
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/kuadrant-system/operator.authorino.kuadrant.io~v1beta1~Authorino/authorino
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - kuadrant
    - ato-1
spec:
  type: auth-service
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: limitador
  title: Limitador — onde o limite e contado
  description: >-
    Contador de requisicoes que o Gateway consulta. As RateLimitPolicy e o PlanPolicy
    descrevem os limites; quem os conta e este servico. E o unico ponto onde 'tier
    gold' vira um numero.
  annotations:
    backstage.io/kubernetes-namespace: kuadrant-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=limitador
    rhcl.demo/cluster-object: limitador/kuadrant-system/limitador
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/kuadrant-system/limitador.kuadrant.io~v1alpha1~Limitador/limitador
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - kuadrant
    - ato-2
spec:
  type: rate-limit-service
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: istio-control-plane
  title: Service Mesh — plano de controle
  description: >-
    OpenShift Service Mesh 3. Fornece a gatewayClass que o Gateway prod-web usa e
    injeta o sidecar nativo dos servicos -- um initContainer com restartPolicy:
    Always, e nao um container comum.
  annotations:
    rhcl.demo/cluster-object: istio//default
  links:
    - url: https://${CONSOLE_HOST}/k8s/cluster/sailoperator.io~v1~Istio/default
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - service-mesh
    - ato-7
spec:
  type: service-mesh
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: tempo
  title: Tempo — armazenamento de traces
  description: >-
    Guarda os traces que a aba Traces le. Serve por tenant: o caminho da API termina
    em /api/traces/v1/dev, e o tenant faz parte da URL, nao um cabecalho.
  annotations:
    rhcl.demo/cluster-object: tempomonolithic/tracing-system/tempo
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/tracing-system/tempo.grafana.com~v1alpha1~TempoMonolithic/tempo
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - observabilidade
    - ato-5
spec:
  type: tracing-backend
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: otel-collector
  title: OpenTelemetry Collector
  description: >-
    Recebe os spans do Gateway e os encaminha ao Tempo. E o elo que a TelemetryPolicy
    alimenta -- sem ele a policy fica correta e a aba, vazia.
  annotations:
    backstage.io/kubernetes-namespace: tracing-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=otel-collector
    rhcl.demo/cluster-object: opentelemetrycollector/tracing-system/otel
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/tracing-system/opentelemetry.io~v1beta1~OpenTelemetryCollector/otel
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - observabilidade
    - ato-5
spec:
  type: otel-collector
  owner: group:default/platform-team
  system: plataforma
  dependsOn:
    - resource:default/tempo
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kiali
  title: Kiali — console do Service Mesh
  description: >-
    Topologia e trafego da malha. Le as metricas do Thanos. A estrategia de
    autenticacao dele e uma escolha com consequencia: 'openshift' quebra a aba do
    plugin no portal, que so implementa serviceAccountToken.
  annotations:
    backstage.io/kubernetes-namespace: istio-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=kiali
    rhcl.demo/cluster-object: kiali/istio-system/kiali
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/istio-system/kiali.io~v1alpha1~Kiali/kiali
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - observabilidade
    - service-mesh
    - ato-7
spec:
  type: observability-console
  owner: group:default/platform-team
  system: plataforma
  dependsOn:
    - resource:default/istio-control-plane
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: grafana
  title: Grafana — dashboards
  description: >-
    Serve os dashboards que aparecem nos componentes pelo plugin. Aqui roda com acesso
    anonimo como Admin, o que e o oposto do Kiali e do Tempo -- e por isso o proxy do
    portal fala com ele sem token.
  annotations:
    rhcl.demo/cluster-object: grafana/monitoring/grafana
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/monitoring/grafana.integreatly.org~v1beta1~Grafana/grafana
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - observabilidade
    - ato-4
spec:
  type: dashboards
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: openshift-gitops
  title: OpenShift GitOps (Argo CD)
  description: >-
    Reconcilia o que esta em git com o que esta no cluster. E o mecanismo que torna
    literal a frase do roteiro sobre a mudanca ficar 'em git, com autor e data' -- o
    merge da MR e o que dispara a aplicacao.
  annotations:
    rhcl.demo/cluster-object: argocd/openshift-gitops/openshift-gitops
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/openshift-gitops/argoproj.io~v1beta1~ArgoCD/openshift-gitops
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - gitops
    - ato-6
spec:
  type: gitops
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: gitlab
  title: GitLab — SCM e IdP
  description: >-
    Guarda o codigo E autentica o portal. Um mecanismo em vez de dois: o mesmo login
    que diz quem a pessoa e tambem entrega o token com que o scaffolder age em nome
    dela.
  annotations:
    rhcl.demo/cluster-object: gitlab/gitlab-system/gitlab
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/gitlab-system/apps.gitlab.com~v1beta1~GitLab/gitlab
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - gitops
    - ato-6
spec:
  type: scm
  owner: group:default/platform-team
  system: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: keycloak
  title: Red Hat build of Keycloak
  description: >-
    IdP do developer portal do Connectivity Link. Chega junto com o RHCL 1.4.2 e e o
    que sustenta o autoatendimento de chaves do Ato 6.
  annotations:
    rhcl.demo/cluster-object: keycloak/keycloak/keycloak
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/keycloak/k8s.keycloak.org~v2alpha1~Keycloak/keycloak
      title: Ver no console
      icon: web
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
spec:
  type: idp
  owner: group:default/platform-team
  system: plataforma
---
# CONSOLE CUSTOMIZADA -- a rotulagem e o ponto: title, description e tag dizem
# que NAO e o plugin oficial do produto (que continua instalado ao lado).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kuadrant-console-custom
  title: Kuadrant Console (customizada)
  description: >-
    Console CUSTOMIZADA de comunidade (gateway-smashes/kuadrant-console), sem
    suporte -- convive com o plugin oficial do RHCL. Reconta os CRs do
    Kuadrant na linguagem de operacao: API Products, dashboard de gateway,
    lente AI/MCP, DNS/TLS e custo por consumidor. Read-only, com o token do
    proprio usuario, e real-only como a demo: o que nao se mede vira N/A.
  annotations:
    rhcl.demo/cluster-object: deployment/kuadrant-console/kuadrant-console
    backstage.io/kubernetes-label-selector: app=kuadrant-console
    backstage.io/kubernetes-namespace: kuadrant-console
    backstage.io/source-location: url:https://github.com/gateway-smashes/kuadrant-console
  links:
    - url: https://github.com/gateway-smashes/kuadrant-console
      title: Fonte (comunidade, sem suporte)
      icon: github
  labels:
    rhcl.demo/camada: consoles
    rhcl.demo/origem: comunidade
  tags:
    - rhcl
    - customizado
spec:
  type: website
  lifecycle: experimental
  owner: group:default/platform-team
  system: plataforma
