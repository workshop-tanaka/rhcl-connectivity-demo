apiVersion: apps/v1
kind: Deployment
metadata:
  # O par app.openshift.io/vcs-uri + vcs-ref (o lapis "edit code" do
  # Topology) NAO fica aqui: o destino e o espelho no GitLab, cujo host e
  # especifico do cluster, e o _apply do provision.sh e "oc apply" seco,
  # sem render -- fixar um host quebraria o proximo ambiente.
  #
  # Quem escreve as duas e _vcs_topology() no scripts/provision.sh, com o
  # host lido do cluster. Sem GitLab, elas nao entram e o no do Topology
  # aparece sem o lapis -- que e degradacao correta, nao defeito.
  #
  # Ate 2026-08-28 estavam fixas aqui apontando para o github.com. O repo e
  # PRIVADO (platform-reference/devspaces/README.md), entao o lapis levava a
  # uma tela de login no meio da demo, num ambiente que e so GitLab.
  name: hotels-v1
  namespace: travel-agency
  # metadata.labels ESPELHA o spec.selector.matchLabels de proposito.
  # Sem ele a aba Topology do RHDH fica VAZIA: o plugin Kubernetes casa
  # backstage.io/kubernetes-label-selector contra o objeto Deployment, e
  # o rotulo so existia no pod template. Pods e Service apareciam na aba
  # Kubernetes, o grafo nao tinha no nenhum, e nao havia erro em lugar
  # nenhum. Nao confundir com spec.selector, que e IMUTAVEL -- este aqui
  # e rotulo do objeto, e pode mudar.
  labels:
    app: hotels
    version: v1
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: hotels
      version: v1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-07-28T14:35:30Z"
        proxy.istio.io/config: |
          tracing:
            zipkin:
              address: zipkin.istio-system:9411
            sampling: 10
            custom_tags:
              http.header.portal:
                header:
                  name: portal
              http.header.device:
                header:
                  name: device
              http.header.user:
                header:
                  name: user
              http.header.travel:
                header:
                  name: travel
        readiness.status.sidecar.istio.io/applicationPorts: ""
      creationTimestamp: null
      labels:
        app: hotels
        sidecar.istio.io/inject: "true"
        version: v1
    spec:
      containers:
        - env:
            - name: CURRENT_SERVICE
              value: hotels
            - name: CURRENT_VERSION
              value: v1
            - name: LISTEN_ADDRESS
              value: :8000
            - name: DISCOUNTS_SERVICE
              value: http://discounts.travel-agency:8000
            - name: MYSQL_SERVICE
              value: mysqldb.travel-db:3306
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: rootpasswd
                  name: mysql-credentials
            - name: MYSQL_DATABASE
              value: test
          image: quay.io/kiali/demo_travels_hotels:v1
          imagePullPolicy: IfNotPresent
          name: hotels
          ports:
            - containerPort: 8000
              protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: discount-access-sa
      serviceAccountName: discount-access-sa
      terminationGracePeriodSeconds: 30
