<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif">
  <defs>
    <marker id="ts-seta-verde" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="ts-seta-vermelha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="ts-seta-cinza" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fff"/>
  <text x="360" y="22" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="bold">travel-streams — do WAL do Postgres ao tópico travel.public.*</text>

  <!-- CronJob mutador (vizinho, alto esquerda) -->
  <rect x="20" y="46" width="170" height="62" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="105" y="66" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">CronJob cdc-mutador</text>
  <text x="105" y="81" text-anchor="middle" fill="#64748b" font-size="9">travel-db — psql mutador.sql</text>
  <text x="105" y="95" text-anchor="middle" fill="#64748b" font-size="9">a cada minuto (Forbid)</text>

  <!-- seta mutador -> Postgres -->
  <line x1="105" y1="108" x2="105" y2="176" stroke="#16a34a" stroke-width="2" marker-end="url(#ts-seta-verde)"/>
  <text x="113" y="134" fill="#16a34a" font-size="9">UPDATE / INSERT /</text>
  <text x="113" y="147" fill="#16a34a" font-size="9">DELETE: preços, vagas,</text>
  <text x="113" y="160" fill="#16a34a" font-size="9">reservas — movimento</text>

  <!-- Postgres (vizinho, baixo esquerda) -->
  <rect x="20" y="180" width="170" height="84" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="105" y="200" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Postgres</text>
  <text x="105" y="214" text-anchor="middle" fill="#1e293b" font-size="10">travel-packages-db</text>
  <text x="105" y="230" text-anchor="middle" fill="#64748b" font-size="9">travel-db — WAL lógico</text>
  <text x="105" y="243" text-anchor="middle" fill="#64748b" font-size="9">publication travel_pub</text>
  <text x="105" y="256" text-anchor="middle" fill="#64748b" font-size="9">slot travel_cdc</text>

  <!-- seta Postgres -> Connect -->
  <line x1="190" y1="222" x2="256" y2="222" stroke="#16a34a" stroke-width="2" marker-end="url(#ts-seta-verde)"/>
  <text x="223" y="210" text-anchor="middle" fill="#16a34a" font-size="9">replicação</text>
  <text x="223" y="238" text-anchor="middle" fill="#16a34a" font-size="9">lógica :5432</text>

  <!-- ImageStream + build (vizinho, alto centro) -->
  <rect x="258" y="46" width="200" height="62" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="358" y="66" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">ImageStream cdc-connect</text>
  <text x="358" y="81" text-anchor="middle" fill="#64748b" font-size="9">build do Strimzi → cdc-connect:latest</text>
  <text x="358" y="95" text-anchor="middle" fill="#64748b" font-size="9">declarada no manifesto (2026-08-30)</text>

  <!-- seta ImageStream -> Connect (imagem do pod) -->
  <line x1="358" y1="108" x2="358" y2="158" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ts-seta-cinza)"/>
  <text x="366" y="126" fill="#64748b" font-size="9">imagem do pod</text>
  <text x="366" y="139" fill="#dc2626" font-size="9">sem a IS: NotReady,</text>
  <text x="366" y="151" fill="#dc2626" font-size="9">nenhum pod nasce</text>

  <!-- KafkaConnect (central, azul) -->
  <rect x="258" y="162" width="200" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="182" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">KafkaConnect cdc — 1 réplica</text>
  <rect x="272" y="192" width="172" height="62" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="358" y="210" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="bold">KafkaConnector travel-cdc</text>
  <text x="358" y="224" text-anchor="middle" fill="#64748b" font-size="9">Debezium Postgres 3.1.3 (tgz)</text>
  <text x="358" y="237" text-anchor="middle" fill="#64748b" font-size="9">pgoutput, snapshot initial</text>
  <text x="358" y="250" text-anchor="middle" fill="#64748b" font-size="9">tasksMax 1</text>
  <text x="358" y="272" text-anchor="middle" fill="#64748b" font-size="9">senha via config provider:</text>
  <text x="358" y="285" text-anchor="middle" fill="#64748b" font-size="9">Secret travel-packages-db-debezium</text>
  <text x="358" y="298" text-anchor="middle" fill="#64748b" font-size="9">(RBAC: get num único Secret)</text>

  <!-- seta Connect -> Kafka -->
  <line x1="458" y1="222" x2="522" y2="222" stroke="#16a34a" stroke-width="2" marker-end="url(#ts-seta-verde)"/>
  <text x="490" y="210" text-anchor="middle" fill="#16a34a" font-size="9">publica</text>
  <text x="490" y="238" text-anchor="middle" fill="#16a34a" font-size="9">:9092</text>

  <!-- Kafka (central, azul) -->
  <rect x="524" y="120" width="176" height="192" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="612" y="140" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">Kafka travel-streams</text>
  <text x="612" y="155" text-anchor="middle" fill="#64748b" font-size="9">KRaft — sem ZooKeeper</text>
  <rect x="538" y="164" width="44" height="34" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="560" y="185" text-anchor="middle" fill="#1e293b" font-size="9">nó 1</text>
  <rect x="590" y="164" width="44" height="34" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="612" y="185" text-anchor="middle" fill="#1e293b" font-size="9">nó 2</text>
  <rect x="642" y="164" width="44" height="34" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="664" y="185" text-anchor="middle" fill="#1e293b" font-size="9">nó 3</text>
  <text x="612" y="212" text-anchor="middle" fill="#64748b" font-size="9">controller + broker, 10Gi cada</text>
  <rect x="538" y="222" width="148" height="48" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="612" y="240" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="bold">travel.public.*</text>
  <text x="612" y="254" text-anchor="middle" fill="#64748b" font-size="9">RF 3 · 3 partições</text>
  <text x="612" y="266" text-anchor="middle" fill="#64748b" font-size="9">criados pelo conector</text>
  <text x="612" y="288" text-anchor="middle" fill="#64748b" font-size="9">min.insync.replicas 2</text>
  <text x="612" y="301" text-anchor="middle" fill="#64748b" font-size="9">listener plain :9092 interno</text>

  <!-- seta Kafka -> cache (destino) -->
  <line x1="612" y1="312" x2="612" y2="336" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ts-seta-cinza)"/>

  <!-- Data Grid (vizinho, baixo direita) -->
  <rect x="524" y="340" width="176" height="46" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="612" y="358" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="bold">Data Grid travel-cache</text>
  <text x="612" y="372" text-anchor="middle" fill="#64748b" font-size="9">destino do CDC (dependsOn)</text>

  <!-- fluxo bloqueado (falha do mutador) -->
  <text x="20" y="300" fill="#dc2626" font-size="9" font-weight="bold">sidecar não nativo + Forbid:</text>
  <text x="20" y="313" fill="#dc2626" font-size="9">1ª rodada trava, as demais nunca</text>
  <text x="20" y="326" fill="#dc2626" font-size="9">rodam — tópico para em silêncio</text>
  <text x="20" y="339" fill="#64748b" font-size="9">(por isso o label inject: "false")</text>

  <!-- legenda inferior -->
  <text x="240" y="350" fill="#1e293b" font-size="10" font-weight="bold">Por que a camada existe:</text>
  <text x="240" y="365" fill="#64748b" font-size="9">tópico parado se lê como integração quebrada —</text>
  <text x="240" y="378" fill="#64748b" font-size="9">o mutador garante que a mudança capturada é real, a cada minuto</text>
</svg>
