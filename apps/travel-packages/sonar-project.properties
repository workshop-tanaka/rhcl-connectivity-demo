# Analise do SonarQube. A pipeline passa sonar.host.url, sonar.token e
# sonar.qualitygate.wait=true por parametro -- aqui fica so o que e do
# projeto e nao muda entre ambientes.
sonar.projectKey=travel-packages
sonar.projectName=travel-packages
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
# Sem esta linha o Sonar reporta 0% de cobertura e QUALQUER quality gate
# baseado em codigo novo passa -- o portao que nao reprova nao e portao.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# target/server e o servidor provisionado pelo Galleon: dezenas de milhares
# de arquivos que nao sao nossos. Sem excluir, a analise leva minutos e o
# resultado fala de codigo da Red Hat.
sonar.exclusions=target/**
