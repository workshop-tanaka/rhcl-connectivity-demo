# ===========================================================================
# O servico travel-packages em JBoss EAP 8, pelo operador.
#
# POR QUE OPERADOR E NAO DEPLOYMENT: o WildFlyServer cuida de replicas e de
# TRANSACAO EM SCALE-DOWN -- ao reduzir replicas ele mantem o pod vivo ate as
# transacoes pendentes terminarem, em vez de matar no meio. E o argumento de
# produto sobre um Deployment escrito a mao, e e visivel ao vivo:
#   oc scale wildflyserver travel-packages -n travel-packages --replicas=1
#
# A IMAGEM VEM DO QUAY, construida pela pipeline build-travel-packages
# (platform-reference/pipelines/). Este arquivo NAO constroi nada -- se a tag
# nao existir, os pods ficam em ImagePullBackOff, que e o sintoma correto.
#
# ---------------------------------------------------------------------------
# DUAS COISAS QUE ESTE ARQUIVO NAO PODE RESOLVER SOZINHO, e por isso o
# provision.sh faz antes (etapa 'pacotes'):
#
#   1. o Secret travel-packages-db-app e gerado pelo CloudNativePG em
#      travel-db, com senha aleatoria. Ele e COPIADO para ca -- nao ha como
#      escreve-lo num manifest, e um RoleBinding entre namespaces nao ajuda:
#      env.valueFrom.secretKeyRef so le do proprio namespace.
#
#   2. o pull secret do Quay. O repositorio e privado, entao a
#      ServiceAccount abaixo precisa do secret 'quay-pull' vinculado. Sem
#      ele o sintoma e ImagePullBackOff com 'unauthorized', que se le como
#      tag errada.
# ===========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: travel-packages
  namespace: travel-packages
# imagePullSecrets e preenchido pelo provision.sh depois de criar o secret do
# Quay -- deixa-lo aqui com um nome que talvez nao exista faria o kubelet
# reclamar a cada pod.
---
apiVersion: wildfly.org/v1alpha1
kind: WildFlyServer
metadata:
  name: travel-packages
  namespace: travel-packages
  labels:
    app: travel-packages
    # propagado aos pods pelo operador; e o rotulo de SISTEMA que a Topology
    # do portal seleciona (todos os workloads da cadeia o carregam)
    app.kubernetes.io/part-of: travel-packages
    # O par que a aba do portal exige. O plugin Kubernetes le pelo SELETOR da
    # entidade; rotular so com kubernetes-id faz a aba abrir vazia, sem erro.
    # Mesma armadilha medida em 2026-08-28 com os PipelineRun.
    backstage.io/kubernetes-id: travel-packages
spec:
  # __IMAGEM__ e substituido pelo provision.sh: por padrao o Quay DO PROPRIO
  # CLUSTER (registry-quay-quay.<dominio>/rhcl/travel-packages), pelo mesmo
  # motivo do GitLab morar aqui -- nada de conta externa que o repo nao
  # reconstroi. QUAY_HOST e QUAY_ORG no ambiente apontam para outro registry,
  # se um dia fizer sentido.
  #
  # A imagem BASE do Dockerfile e outra coisa e ja esta resolvida:
  # registry.redhat.io/jboss-eap-8/eap81-openjdk17-runtime-openshift-rhel9,
  # conferida rodando-a no cluster (ver o cabecalho do Dockerfile).
  applicationImage: __IMAGEM__:latest
  replicas: 2
  serviceAccountName: travel-packages

  # DESCOBERTO APLICANDO O CR em 2026-08-28: sem isto o operador cria uma
  # Route propria (travel-packages-route) apontando direto para o Service.
  # Numa demo cujo assunto e governanca na borda, isso e um cano paralelo: a
  # API responde por um endereco que nao passa pelo Gateway, e portanto sem
  # AuthPolicy, sem plano e sem rate limit. Pior que inutil -- e um jeito de
  # a propria demo se desmentir se alguem abrir a URL errada.
  #
  # A entrada legitima e a HTTPRoute la embaixo, anexada ao prod-web.
  disableHTTPRoute: true

  # ------------------------------------------------------------------------
  # As variaveis que a camada 'postgresql-datasource' do Galleon le em tempo
  # de execucao. Os nomes NAO sao escolha nossa: vem do
  # eap-datasources-galleon-pack, e errar um deles nao da erro de arranque --
  # da um datasource apontando para localhost:5432, que falha na primeira
  # consulta com 'Connection refused'.
  #
  # POSTGRESQL_DATASOURCE=TravelPackagesDS casa com o jta-data-source do
  # persistence.xml (java:jboss/datasources/TravelPackagesDS).
  # ------------------------------------------------------------------------
  env:
    - name: POSTGRESQL_DATASOURCE
      value: TravelPackagesDS
    - name: POSTGRESQL_HOST
      value: travel-packages-db-rw.travel-packages.svc
    - name: POSTGRESQL_PORT
      value: "5432"
    - name: POSTGRESQL_DATABASE
      value: travelpackages
    - name: POSTGRESQL_USER
      valueFrom:
        secretKeyRef:
          name: travel-packages-db-app
          key: username
    - name: POSTGRESQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: travel-packages-db-app
          key: password

    # Hot Rod. O Service do Infinispan chama-se como o CR (travel-cache), no
    # namespace travel-cache. O cliente usa clientIntelligence BASIC de
    # proposito -- ver o comentario em CacheDePacotes.java.
    - name: DATAGRID_HOST
      value: travel-cache.travel-packages.svc
    - name: DATAGRID_PORT
      value: "11222"
    - name: DATAGRID_CACHE
      value: pacotes

    # -------------------------------------------------------------------
    # SERVER_PUBLIC_BIND_ADDRESS=0.0.0.0 E OBRIGATORIO NA MALHA, e a ausencia
    # dele produz o conjunto de sintomas mais enganoso que este servico deu.
    #
    # A imagem do EAP liga no IP DO POD por padrao:
    #
    #   WFLYUT0006: Undertow HTTP listener default listening on 10.234.1.76:8080
    #
    # O Envoy do sidecar entrega o trafego de ENTRADA em 127.0.0.1:8080, onde
    # nao ha ninguem escutando. O resultado, em cascata:
    #
    #   a sonda de readiness (reescrita pelo Istio) falha
    #   o pod fica 1/2 Running para sempre, sem CrashLoop
    #   o Service fica sem endpoint
    #   e quem chama recebe do Envoy:
    #     upstream connect error ... remote connection failure
    #
    # Nada disso menciona bind address, e o log do EAP diz 'started' sem erro
    # nenhum -- o servidor esta perfeito, so inalcancavel. De dentro do pod,
    # 127.0.0.1:8080 RECUSA conexao e o IP do pod responde 200. Medido em
    # 2026-08-28.
    #
    # E O NOME DA VARIAVEL IMPORTA: -Djboss.bind.address em JAVA_OPTS_APPEND
    # NAO funciona. O launcher da imagem monta a linha de comando com
    #
    #   PUBLIC_IP_ADDRESS=${SERVER_PUBLIC_BIND_ADDRESS:-$(hostname -i)}
    #   SERVER_ARGS="... -b ${PUBLIC_IP_ADDRESS} ..."
    #
    # e o '-b' da linha de comando vence a propriedade de sistema. Conferido em
    # /opt/jboss/container/wildfly/run/run, dentro da imagem.
    #
    # java.io.tmpdir: o servidor escreve em standalone/data e, com UID
    # aleatorio do SCC restricted-v2, o tmpdir do sistema nem sempre e
    # gravavel.
    # -------------------------------------------------------------------
    - name: SERVER_PUBLIC_BIND_ADDRESS
      value: "0.0.0.0"
    - name: JAVA_OPTS_APPEND
      value: "-Djava.io.tmpdir=/tmp -Djava.net.preferIPv4Stack=true"

  # ------------------------------------------------------------------------
  # SONDAS EXPLICITAS. CONFERIDO no cluster em 2026-08-28: a CRD do
  # eap-operator.v3.2.24 aceita readinessProbe, livenessProbe e startupProbe
  #   oc explain wildflyserver.spec | grep -i probe
  #
  # Por que explicitas: o operador, por padrao, sonda o subsistema de health --
  # que a camada 'jaxrs-server' NAO traz (ele vem em 'cloud-server', que
  # arrasta bastante servidor junto). Por isso apontamos para o recurso JAX-RS
  # /api/saude, que custa vinte linhas em vez de uma camada inteira.
  # ------------------------------------------------------------------------
  # AS TRES SONDAS, e a startupProbe e a que faltava. Definir readiness e
  # liveness sem ela deixa a do OPERADOR valendo, e a dele faz curl num
  # endpoint de health que a camada 'jaxrs-server' nao entrega -- 404. O
  # kubelet entao reporta "failed startup probe, will be restarted", mata o
  # container antes de qualquer outra sonda rodar, e o ciclo vira
  # CrashLoopBackOff com o servidor subindo limpo toda vez. Medido em
  # 2026-08-28, depois de corrigir o bind e ainda assim ficar em 1/2.
  #
  # failureThreshold 30 x 10s = 5 minutos de tolerancia no arranque: o EAP sobe
  # em ~10s, mas o primeiro pull da imagem de 546MB nao.
  startupProbe:
    httpGet:
      path: /api/saude
      port: 8080
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /api/saude
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 12
  livenessProbe:
    httpGet:
      path: /api/saude
      port: 8080
    initialDelaySeconds: 90
    periodSeconds: 30

  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}
---
# ===========================================================================
# Exposicao pela borda do RHCL.
#
# A rota anexa ao MESMO Gateway prod-web dos outros atos -- e de proposito:
# um segundo gateway contaria uma historia diferente da que a demo defende
# (uma plataforma de API, nao um gateway por servico). As policies que valem
# para toda rota anexada (prod-web-deny-all, o TLS, o DNS) passam a valer
# para esta tambem, sem nada a declarar.
#
# HOSTNAME DE UM ROTULO SO: 'pacotes-travels.apps...' cabe no wildcard que o
# cluster ja tem. 'pacotes.travels.apps...' teria dois e exigiria certificado
# proprio -- e emitir por DNS01 quebra a resolucao do proprio host (armadilha
# 6 do RUNBOOK). O provision.sh substitui __PKG_HOST__.
#
# SEM AuthPolicy E SEM PlanPolicy AQUI. Elas sao da camada da demo (base/), e
# entram com o Ato 8 -- este arquivo entrega a rota; o ato entrega a
# governanca sobre ela. Ate la a rota responde sem autenticacao, que e o
# estado correto para conferir que o servico subiu.
# ===========================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: travel-packages
  namespace: travel-packages
  labels:
    app: travel-packages
spec:
  parentRefs:
    - name: prod-web
      namespace: ingress-gateway
  hostnames:
    - __PKG_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        # O NOME DO SERVICE E DO OPERADOR, nao nosso -- ele deriva do nome do
        # WildFlyServer e ja mudou entre versoes do operador. Confirmar depois
        # do primeiro reconcile, que custa um comando:
        #   oc get svc -n travel-packages
        # Service errado aqui da 503 na borda com a HTTPRoute Accepted=True,
        # que e o par de sintomas mais enganoso do Gateway API.
        - name: travel-packages-loadbalancer
          port: 8080
---
# ===========================================================================
# A Route passthrough que PUBLICA este hostname.
#
# SEM ELA A HTTPROUTE NAO ADIANTA. O Gateway prod-web nao tem LoadBalancer
# neste cluster; quem o expoe sao Routes passthrough do OpenShift, UMA POR
# HOSTNAME (ja existem api-travels, echo-travels e grpc-travels). Um hostname
# novo sem Route recebe 503 do ROUTER -- pagina HTML do OpenShift, e nao a
# resposta do Envoy -- que se le como servico fora do ar, quando o servico
# esta perfeito e a HTTPRoute Accepted=True.
#
# passthrough, e nao edge: o TLS termina no Gateway, que e quem detem o
# certificado e aplica as policies do RHCL. Terminar aqui tiraria a borda do
# caminho -- e a borda e o assunto da demo.
# ===========================================================================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: travel-packages-gateway
  namespace: ingress-gateway
  labels:
    app: travel-packages
spec:
  host: __PKG_HOST__
  port:
    # 443 NUMERICO, e nao o nome 'https'. As portas do Service prod-web-istio
    # sao nomeadas pelo controlador do Gateway API, e 'https' nao esta entre
    # elas -- com o nome errado a Route e ADMITIDA, o router nao encontra o
    # alvo, e o cliente recebe um reset no handshake TLS
    # (SSL_ERROR_SYSCALL), sem status HTTP nenhum. As Routes que ja
    # funcionavam neste cluster usam 443; esta faltou copiar.
    targetPort: 443
  tls:
    termination: passthrough
  to:
    kind: Service
    name: prod-web-istio
    weight: 100
