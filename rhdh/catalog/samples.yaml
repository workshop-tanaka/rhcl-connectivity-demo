# ===========================================================================
# Catalogo RHDH — as quatro amostras do Istio (samples/).
#
# Modela samples/bookinfo, samples/websockets, samples/grpc-echo e
# samples/open-telemetry: o servico, as policies do RHCL, os recursos do
# Service Mesh e a cadeia de suprimento de cada uma.
#
# ---------------------------------------------------------------------------
# POR QUE UM DOMAIN PROPRIO, E NAO 'travel' NEM 'plataforma'
#
# As amostras nao sao produto de negocio: nao vendem passagem nem seguro, e
# poe-las em 'travel' repetiria o erro que o Domain 'plataforma' foi criado
# para corrigir (Authorino e Tempo dentro do dominio de viagens).
#
# E tambem nao sao plataforma: elas nao sustentam a demo -- a demo funciona
# inteira sem elas. Sao MATERIAL DE APOIO, que entra e sai sem tocar no
# roteiro, e e exatamente essa a fronteira que samples/README.md defende.
#
# ---------------------------------------------------------------------------
# TODA ENTIDADE AQUI TEM rhcl.demo/cluster-object, e isso e o que torna este
# arquivo seguro num cluster onde as amostras nao foram aplicadas: o
# setup-catalog.sh confere cada objeto com um 'oc get' e DESCARTA quem nao
# existe. Sem isso, o portal ganharia trinta e poucos cards que nunca carregam
# -- e um portal que mente sobre o cluster e pior do que um portal incompleto.
#
# ---------------------------------------------------------------------------
# ROTULOS: vocabulario de docs/CATALOGO.md. Tres valores novos de
# rhcl.demo/produto entraram por causa deste arquivo -- bookinfo, websockets e
# grpc-echo --, e o scripts/valida-catalogo.sh foi atualizado junto. A amostra
# open-telemetry NAO leva 'produto': ela nao publica rota e nao tem chave, e
# inventar um produto para ela seria dizer que ela vende algo.
#
# ${GITLAB_HOST}, ${DEMO_REPO_URL}, ${CONSOLE_HOST} e ${DEVSPACES_HOST} sao
# substituidos pelo rhdh/setup-catalog.sh com valores lidos do cluster.
# ===========================================================================
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: samples
  title: Amostras
  description: >-
    Amostras do projeto Istio adaptadas para Red Hat Connectivity Link e
    OpenShift Service Mesh. Material de apoio: cada uma defende um pedaco da
    tese de que o RHCL e plataforma de API e nao gateway, e nenhuma faz parte
    do roteiro.
  labels:
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - sample
    - istio
spec:
  owner: group:default/platform-team
---
# ---------------------------------------------------------------------------
# System: bookinfo -- a amostra canonica, e a unica com DUAS rotas.
#
# E a segunda coisa a olhar depois do travel-agency, porque e onde a fronteira
# por PRODUTO fica visivel sem explicacao: a mesma aplicacao, no mesmo
# hostname, com a UI publica e a API sob chave e plano.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sample-bookinfo
  title: Amostra — bookinfo
  description: >-
    A mesma aplicacao com duas fronteiras, decididas por rota: a UI e publica e
    so limitada, /api/v1 exige chave e tem plano. Tres versoes vivas de
    'reviews' dao ao Service Mesh o canario que a travel-agency nao tem.
  annotations:
    # Ancorado no Namespace, como os demais Systems deste catalogo: num cluster
    # sem a etapa 'samples' do provision.sh, o System inteiro sai sozinho.
    # Namespace e cluster-scoped, dai o campo do meio vazio.
    rhcl.demo/cluster-object: namespace//bookinfo
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - istio
    - service-mesh
spec:
  owner: group:default/platform-team
  domain: samples
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sample-websockets
  title: Amostra — websockets
  description: >-
    HTTP/1.1 Upgrade. A AuthPolicy confere a credencial no handshake e nao ve
    os frames depois dele -- e por isso governar conexao longa e decisao de
    desenho (idleTimeout, maxConnections, teto de handshakes) e nao efeito
    colateral de ter posto um proxy no caminho.
  annotations:
    rhcl.demo/cluster-object: namespace//websockets
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: websockets
  tags:
    - rhcl
    - sample
    - istio
    - service-mesh
spec:
  owner: group:default/platform-team
  domain: samples
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sample-grpc-echo
  title: Amostra — grpc-echo
  description: >-
    A MESMA AuthPolicy sobre gRPC: mudam o targetRef (GRPCRoute) e o lugar da
    credencial (metadata, porque gRPC nao tem query string). Mais o canario
    sobre gRPC, que base/grpc/ nao tem.
  annotations:
    rhcl.demo/cluster-object: namespace//grpc-echo
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: grpc-echo
  tags:
    - rhcl
    - sample
    - istio
    - service-mesh
spec:
  owner: group:default/platform-team
  domain: samples
---
# ---------------------------------------------------------------------------
# System: open-telemetry -- camada PLATAFORMA, e e o unico dos quatro.
#
# A amostra nao publica rota e nao tem chave: o que ela mostra e que
# observabilidade e decisao do control plane, e nao feature de gateway. Marcar
# 'aplicacao' aqui contradiria o proprio argumento dela -- foi a mesma
# incoerencia que tirou o echo-api do System rhcl-ingress.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sample-open-telemetry
  title: Amostra — open-telemetry
  description: >-
    O log de acesso do Service Mesh saindo em OTLP para um coletor proprio, em
    vez de virar texto no stdout de um sidecar. A unica amostra sem rota: o
    ponto dela e a plataforma, nao a borda.
  annotations:
    rhcl.demo/cluster-object: namespace//otel-sample
  labels:
    rhcl.demo/camada: plataforma
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - sample
    - istio
    - observabilidade
spec:
  owner: group:default/platform-team
  domain: samples
---
# ---------------------------------------------------------------------------
# COMPONENTS DO BOOKINFO -- quatro, e so um deles a borda alcanca.
#
# Essa assimetria e o proprio ponto da amostra, e o catalogo a torna legivel:
# so o productpage tem link de endpoint e providesApis. Os outros tres existem
# leste-oeste, e quem diz quem pode chama-los e a AuthorizationPolicy do
# Service Mesh -- nao o roteamento.
#
# quay.io/repository-slug aponta para maistra/, e nao para istio/: o plugin de
# Quay do portal chama quay.io (rhdh/setup-plugins.sh), e as imagens do
# bookinfo publicas la sao as da Red Hat. As de istio/ dao 401 -- uma aba
# 'Imagem' que carrega e nao mostra nada, que no palco se le como defeito do
# portal. Conferido pela API do Quay em 2026-08-28.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: bookinfo-productpage
  title: bookinfo — productpage
  description: >-
    A fachada. Unico servico do bookinfo que a borda alcanca, e o backend das
    DUAS HTTPRoute: a da UI, publica, e a da API, sob chave e plano.
  annotations:
    rhcl.demo/cluster-object: deployment/bookinfo/productpage-v1
    # O deployment tem sufixo de versao, que NAO e o nome da entidade -- errar
    # aqui da uma aba Security que carrega e nao acha nada.
    acs/deployment-name: productpage-v1
    # Liga a aba CI. O que o plugin ENXERGA sai do kubernetes-label-selector; a
    # anotacao so decide se a aba aparece. As PipelineRun da cadeia de
    # suprimento levam app=bookinfo, que e o seletor abaixo.
    janus-idp.io/tekton: bookinfo
    sonarqube.org/project-key: rhcl-sample-bookinfo
    # Sem gitlab.com/instance o plugin assume gitlab.com e a aba quebra com
    # TypeError no navegador -- sem rastro no log do backend.
    gitlab.com/instance: ${GITLAB_HOST}
    gitlab.com/project-slug: rhcl/samples/bookinfo
    backstage.io/kubernetes-label-selector: app=productpage
    backstage.io/kubernetes-namespace: bookinfo
    # O Kiali usa a anotacao DELE, nao a do Kubernetes.
    kiali.io/namespace: bookinfo
    kiali.io/provider: default
    quay.io/repository-slug: maistra/examples-bookinfo-productpage-v1
    grafana/dashboard-selector: rhcl
    backstage.io/source-location: url:https://${GITLAB_HOST}/rhcl/samples/bookinfo/-/tree/main/
  links:
    - url: https://${CONSOLE_HOST}/observe/traces
      title: Traces — productpage.bookinfo
      icon: dashboard
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - istio
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: sample-bookinfo
  providesApis:
    - bookinfo-api
  dependsOn:
    - component:default/bookinfo-details
    - component:default/bookinfo-reviews
    - resource:default/bookinfo-ui-route
    - resource:default/bookinfo-api-route
    - resource:default/bookinfo-api-authpolicy
    - resource:default/bookinfo-plans

