# ===========================================================================
# A dimensão que faz a métrica do bookinfo responder à pergunta certa.
#
# Mesmo desenho de base/policies-telemetry/istio-partner-dimension.yaml: sem
# uma dimensão nova, istio_requests_total agrega tudo e a série não sabe QUAL
# VERSÃO respondeu. Com 'versao_destino', o painel do canário (90/10) tem o que
# quebrar, e a divisão declarada em 12- vira número medido.
#
# destination_canonical_revision já existe como label padrão do Istio; a
# dimensão aqui é redundante DE PROPÓSITO, com um nome que se lê no palco --
# 'versao_destino' num seletor de dashboard é mais barato de explicar do que
# uma label cujo nome vem do upstream. O custo é uma série a mais por versão;
# são três.
#
# tracing: o span já é emitido pelo provider 'otel-tracing' que o CR Istio
# declara (platform-reference/mesh-control-plane/telemetry-tracing.yaml).
# randomSamplingPercentage aqui SOBREPÕE aquele para este namespace: 100% numa
# amostra de demonstração, onde perder o trace da chamada que se acabou de
# fazer no palco é o pior resultado possível.
# ===========================================================================
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: bookinfo-dimensoes
  namespace: bookinfo
spec:
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: REQUEST_COUNT
            mode: CLIENT_AND_SERVER
          tagOverrides:
            versao_destino:
              value: destination.workload.name
  tracing:
    - providers:
        - name: otel-tracing
      randomSamplingPercentage: 100.00
  # ---------------------------------------------------------------------------
  # O ACCESS LOG MORA AQUI, e nao na amostra open-telemetry -- e a correcao de
  # um defeito que so o GitOps expos, em 2026-08-28.
  #
  # A versao anterior punha este bloco num arquivo da amostra open-telemetry,
  # com o MESMO nome e namespace, para "substituir" esta Telemetry. Funciona
  # aplicando a mao, na ordem certa. Sob Argo CD, nao: as duas Applications
  # passam a DISPUTAR o mesmo objeto. O sample-bookinfo sincronizou primeiro e
  # apagou o accessLogging -- medido, com o coletor recebendo zero depois de ter
  # recebido 30 LogRecord minutos antes.
  #
  # Um objeto, um dono. A dependencia entre as amostras passa a ser declarada em
  # vez de encenada: o provider 'otel-als-sample' e um extensionProvider do
  # meshConfig, e quem o declara e a etapa 'samples' do provision.sh -- sempre,
  # independente de quais amostras foram pedidas, justamente para que esta
  # Telemetry nunca aponte para um nome que nao existe.
  #
  # SEM O COLETOR DE PE (amostra open-telemetry nao aplicada), o provider existe
  # e o destino nao: o access log nao chega a lugar nenhum. As metricas e o
  # trace desta mesma Telemetry continuam valendo. NAO MEDIDO neste estado.
  # ---------------------------------------------------------------------------
  accessLogging:
    - providers:
        - name: otel-als-sample
      # Explicito porque access log e a configuracao que mais frequentemente se
      # quer desligar depressa no meio de uma investigacao, e ter o campo
      # escrito e a diferenca entre 'oc patch' e 'oc edit procurando onde por'.
      disabled: false
