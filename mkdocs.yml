# TechDocs da demo RHCL.
#
# O RHDH gera a documentacao no proprio pod (mkdocs 1.6 vive em
# /opt/techdocs-venv), buscando este repositorio pela anotacao
# backstage.io/techdocs-ref da entidade. Sem a anotacao, a secao Docs do portal
# fica vazia -- o plugin esta ligado por padrao, mas nao tem o que renderizar.
site_name: RHCL Connectivity Demo
site_description: Roteiro e provisionamento da demo de Red Hat Connectivity Link

docs_dir: docs

nav:
  - Inicio: index.md
  - Passo a passo: DEMO-PASSO-A-PASSO.md
  - Roteiro: RUNBOOK.md
  - Provisionamento 1.4: PROVISIONING-1.4.md
  - Ambiente 1.2 (workshop): AMBIENTE-1.2-WORKSHOP.md
  - Vocabulário do catálogo: CATALOGO.md
  - Amostras do Istio: SAMPLES.md
  - Componentes:
      - A tese na borda (prod-web): componentes/prod-web/docs/index.md
      - travels (orquestrador): componentes/travels/docs/index.md
      - flights: componentes/flights/docs/index.md
      - hotels: componentes/hotels/docs/index.md
      - cars: componentes/cars/docs/index.md
      - insurances: componentes/insurances/docs/index.md
      - discounts (v1 e v2): componentes/discounts/docs/index.md
      - echo-api (contraexemplo): componentes/echo-api/docs/index.md
      - travel-packages (EAP + CDC): componentes/travel-packages/docs/index.md
      - travel-db: componentes/travel-db/docs/index.md
      - travel-cache (Data Grid): componentes/travel-cache/docs/index.md
      - travel-streams (Kafka): componentes/travel-streams/docs/index.md
      - bookinfo — productpage (a UI): componentes/bookinfo-productpage/docs/index.md
      - bookinfo — details: componentes/bookinfo-details/docs/index.md
      - bookinfo — reviews (v1 v2 v3): componentes/bookinfo-reviews/docs/index.md
      - bookinfo — ratings: componentes/bookinfo-ratings/docs/index.md
      - grpc-echo (gRPC na borda): componentes/grpc-echo-app/docs/index.md
      - websockets (adiada): componentes/websockets-tornado/docs/index.md
      - otel-als-collector (log de acesso): componentes/otel-als-collector/docs/index.md
      - parceiro globex-travel (gold): componentes/globex-travel/docs/index.md
      - parceiro initech-voyages (silver): componentes/initech-voyages/docs/index.md
      - parceiro acme-trips (free): componentes/acme-trips/docs/index.md

plugins:
  - techdocs-core
