<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="sans-serif">
  <defs>
    <marker id="seta-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="seta-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="seta-neutra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fff"/>

  <text x="20" y="24" font-size="13" font-weight="bold" fill="#1e293b">prod-web: a decisão na borda — 401, 429 ou 200</text>

  <!-- cliente -->
  <rect x="16" y="100" width="92" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="62" y="122" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Cliente</text>
  <text x="62" y="138" font-size="10" fill="#1e293b" text-anchor="middle">curl / parceiro</text>
  <text x="62" y="153" font-size="10" fill="#64748b" text-anchor="middle">?APIKEY=…</text>

  <!-- cliente -> route -->
  <line x1="108" y1="132" x2="140" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#seta-neutra)"/>

  <!-- route passthrough -->
  <rect x="144" y="96" width="148" height="76" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="218" y="116" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Route passthrough</text>
  <text x="218" y="132" font-size="10" fill="#1e293b" text-anchor="middle">prod-web-gateway · 443</text>
  <text x="218" y="147" font-size="10" fill="#1e293b" text-anchor="middle">router *.apps, sem LB</text>
  <text x="218" y="162" font-size="10" fill="#64748b" text-anchor="middle">TLS passa intacto</text>

  <!-- route -> gateway -->
  <line x1="292" y1="132" x2="310" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#seta-neutra)"/>

  <!-- gateway (central) -->
  <rect x="314" y="84" width="190" height="100" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="409" y="104" font-size="12.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Gateway prod-web</text>
  <text x="409" y="120" font-size="10.5" fill="#1e293b" text-anchor="middle">classe istio · Service ClusterIP</text>
  <text x="409" y="134" font-size="10.5" fill="#1e293b" text-anchor="middle">listener api · HTTPS 443</text>
  <text x="409" y="148" font-size="10" fill="#1e293b" text-anchor="middle">TLS Terminate — api-tls</text>
  <text x="409" y="165" font-size="10.5" font-weight="bold" fill="#2563eb" text-anchor="middle">Authorino → Limitador</text>

  <!-- gateway -> backends (200) -->
  <line x1="504" y1="116" x2="542" y2="92" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-ok)"/>
  <text x="520" y="100" font-size="10" font-weight="bold" fill="#16a34a">200</text>
  <line x1="504" y1="152" x2="542" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#seta-ok)"/>
  <text x="518" y="152" font-size="10" font-weight="bold" fill="#16a34a">200</text>

  <!-- backends -->
  <rect x="546" y="64" width="160" height="58" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="84" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">HTTPRoute travel-agency</text>
  <text x="626" y="99" font-size="10" fill="#1e293b" text-anchor="middle">Service travels:8000</text>
  <text x="626" y="113" font-size="9.5" fill="#64748b" text-anchor="middle">policies próprias na rota</text>

  <rect x="546" y="140" width="160" height="58" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="160" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">HTTPRoute echo-api</text>
  <text x="626" y="175" font-size="10" fill="#1e293b" text-anchor="middle">Service echo-api:8080</text>
  <text x="626" y="189" font-size="9.5" fill="#64748b" text-anchor="middle">policies próprias na rota</text>

  <!-- recusas -->
  <line x1="365" y1="184" x2="365" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#seta-neg)"/>
  <text x="358" y="206" font-size="9.5" fill="#dc2626" text-anchor="end">Authorino nega</text>
  <rect x="322" y="224" width="86" height="44" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="365" y="243" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">401</text>
  <text x="365" y="259" font-size="9.5" fill="#1e293b" text-anchor="middle">sem chave válida</text>

  <line x1="469" y1="184" x2="469" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#seta-neg)"/>
  <text x="476" y="206" font-size="9.5" fill="#dc2626">Limitador corta</text>
  <rect x="426" y="224" width="86" height="44" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="469" y="243" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">429</text>
  <text x="469" y="259" font-size="9.5" fill="#1e293b" text-anchor="middle">acima do plano</text>

  <!-- planos (de onde vem o 429) -->
  <rect x="546" y="218" width="160" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="236" font-size="10.5" font-weight="bold" fill="#1e293b" text-anchor="middle">PlanPolicy travels-plans</text>
  <text x="626" y="251" font-size="10" fill="#1e293b" text-anchor="middle">free 3 · silver 10 · gold 30</text>
  <text x="626" y="266" font-size="9.5" fill="#64748b" text-anchor="middle">req/10s, por identidade</text>
  <line x1="542" y1="248" x2="516" y2="246" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#seta-neutra)"/>

  <!-- defaults do gateway -->
  <rect x="16" y="296" width="488" height="88" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="260" y="316" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">defaults do Gateway — valem para rota anexada sem policy própria</text>
  <text x="260" y="334" font-size="10" fill="#1e293b" text-anchor="middle">prod-web-deny-all: nega tudo (corpo JSON &quot;Forbidden&quot;)</text>
  <text x="260" y="350" font-size="10" fill="#1e293b" text-anchor="middle">ingress-gateway-rlp-lowlimits: teto agregado 50 req/10s</text>
  <text x="260" y="368" font-size="10" fill="#dc2626" text-anchor="middle">hoje: Accepted=True · Enforced=False — sobrepostos pelas policies das rotas</text>
  <line x1="260" y1="292" x2="338" y2="190" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#seta-neutra)"/>
</svg>
