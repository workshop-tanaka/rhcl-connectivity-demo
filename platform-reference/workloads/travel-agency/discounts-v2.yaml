apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Dev Spaces: este par e o UNICO gatilho do decorator "edit code" na aba
    # Topology do RHDH -- sem ele o no aparece igual, so que sem o lapis, e nao
    # ha erro em lugar nenhum. Ver platform-reference/devspaces/README.md.
    app.openshift.io/vcs-uri: https://github.com/devhub-tanaka/rhcl-connectivity-demo
    app.openshift.io/vcs-ref: rhcl-1.4-ocp-4.21
  name: discounts-v2
  namespace: travel-agency
  # metadata.labels ESPELHA o spec.selector.matchLabels de proposito.
  # Sem ele a aba Topology do RHDH fica VAZIA: o plugin Kubernetes casa
  # backstage.io/kubernetes-label-selector contra o objeto Deployment, e
  # o rotulo so existia no pod template. Pods e Service apareciam na aba
  # Kubernetes, o grafo nao tinha no nenhum, e nao havia erro em lugar
  # nenhum. Nao confundir com spec.selector, que e IMUTAVEL -- este aqui
  # e rotulo do objeto, e pode mudar.
  labels:
    app: discounts
    version: v2
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: discounts
      version: v2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        proxy.istio.io/config: |
          tracing:
            zipkin:
              address: zipkin.istio-system:9411
            sampling: 10
            custom_tags:
              http.header.portal:
                header:
                  name: portal
              http.header.device:
                header:
                  name: device
              http.header.user:
                header:
                  name: user
              http.header.travel:
                header:
                  name: travel
        readiness.status.sidecar.istio.io/applicationPorts: ""
      creationTimestamp: null
      labels:
        app: discounts
        version: v2
    spec:
      containers:
        - env:
            - name: CURRENT_SERVICE
              value: discounts
            - name: CURRENT_VERSION
              value: v2
            - name: LISTEN_ADDRESS
              value: :8000
          image: quay.io/kiali/demo_travels_discounts:v1
          imagePullPolicy: IfNotPresent
          name: discounts
          ports:
            - containerPort: 8000
              protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
