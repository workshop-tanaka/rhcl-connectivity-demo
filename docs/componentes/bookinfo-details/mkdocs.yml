# TechDocs DESTE componente, e nao do repositorio inteiro.
#
# 'docs_dir: ..' aponta para docs/componentes/, que ja existe: a pagina e a
# MESMA que o site principal serve, e nao uma copia. Sem isto, cada entidade
# precisaria do proprio diretorio -- e a pagina passaria a existir em dois
# lugares, que e o que o job anti-drift deste repositorio impede.
#
# O 'img/' resolve sozinho: esta no mesmo diretorio.
site_name: bookinfo-details
docs_dir: ..
nav:
  - Visao geral: bookinfo-details.md
plugins:
  - techdocs-core
