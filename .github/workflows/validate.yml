# Valida os manifests da demo a cada push.
#
# Existe por dois motivos. O primeiro e util de verdade: esta sessao perdeu
# tempo mais de uma vez com YAML invalido que so aparecia depois de um rollout
# de ~7 min -- um 'description:' nao-quotado contendo dois-pontos-espaco
# derrubou 6 entidades do catalogo sem erro visivel. Isso e barato de pegar
# aqui.
#
# O segundo: a aba GitHub Actions do portal precisa de execucoes reais para
# deixar de ser uma aba vazia.
#
# NOTA: nada de expressao com chaves duplas neste arquivo, nem em comentario --
# o parser do GitHub as avalia e recusa o workflow inteiro, com falha em 0s,
# sem job e sem log.
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Parsear todo YAML versionado
        run: |
          set -u
          fail=0
          # skeleton/ fica de fora: contem placeholders do scaffolder, nao e YAML final
          for f in $(git ls-files '*.yaml' '*.yml' | grep -v '/skeleton/'); do
            if yq 'true' "$f" >/dev/null 2>&1; then
              echo "ok    $f"
            else
              echo "FALHA $f"
              yq 'true' "$f" 2>&1 | head -2
              fail=1
            fi
          done
          exit $fail

  catalogo:
    name: Catalogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # O job 'YAML' acima confere SINTAXE -- e uma referencia para uma entidade
      # inexistente e sintaxe valida. Ela nao falha na ingestao: o Backstage
      # aceita a entidade e mostra 'entities not found' na pagina do VIZINHO,
      # longe da causa. Este job resolve as referencias de verdade.
      - name: Referencias entre entidades resolvem
        run: bash scripts/valida-catalogo.sh

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n em todo script
        run: |
          set -u
          fail=0
          for f in $(git ls-files '*.sh'); do
            if bash -n "$f"; then
              echo "ok    $f"
            else
              echo "FALHA $f"
              fail=1
            fi
          done
          exit $fail

  antidrift:
    name: Anti-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copias que precisam continuar identicas
        run: |
          python3 - <<'EOF'
          import hashlib, sys

          # Duas funcoes vivem em mais de um arquivo DE PROPOSITO, e em ambos os
          # casos o motivo e o mesmo: os scripts de scripts/ sao self-contained --
          # rodam sozinhos, sem source de nada. A duplicacao e o preco dessa
          # garantia, e este job e quem a torna segura.
          #
          # Nao guardamos _log/_ok/_warn/_die: eles VARIAM de proposito (o _warn do
          # preflight conta avisos e aceita uma dica; os outros nao). Guardar
          # cosmetico produz alarme falso, e alarme falso ensina a ignorar o job.
          GUARDADAS = [
              # _overlay decide o overlay pelo CSV -- ou seja, o regime de
              # precedencia de rate limit. Se as copias divergirem, um script passa
              # a recomendar o overlay da outra release, que reescreve o hostname da
              # HTTPRoute E readiciona a RateLimitPolicy plana: o conserto sugerido
              # causa falha pior que a original.
              ("_overlay", ["scripts/preflight.sh", "scripts/traffic.sh"]),
              # _discover_rhdh_ns decide QUAL portal recebe a configuracao da demo.
              # Ja divergiu uma vez (2026-08-24, sync-survey.sh sem a guarda do
              # namespace alheio) e ninguem viu, porque a diferenca so aparece em
              # cluster novo. Consolidado em rhdh/lib.sh; o preflight mantem copia
              # por ser self-contained.
              ("_discover_rhdh_ns", ["scripts/preflight.sh", "rhdh/lib.sh"]),
          ]

          def corpo(path, fn):
              linhas = open(path).read().splitlines()
              i = next((k for k, l in enumerate(linhas) if l.startswith(fn + "()")), None)
              if i is None:
                  return None
              j = next(k for k in range(i, len(linhas)) if linhas[k] == "}")
              util = [l.strip() for l in linhas[i:j + 1]
                      if l.strip() and not l.strip().startswith("#")]
              return hashlib.sha1("\n".join(util).encode()).hexdigest()[:12]

          falhou = 0
          for fn, arquivos in GUARDADAS:
              vistos = {}
              for a in arquivos:
                  h = corpo(a, fn)
                  if h is None:
                      print("FALHA %s: nao achei %s()" % (a, fn))
                      falhou = 1
                      continue
                  vistos[a] = h
              if len(set(vistos.values())) > 1:
                  print("FALHA %s() divergiu entre as copias:" % fn)
                  for a, h in vistos.items():
                      print("        %s  %s" % (h, a))
                  print("        as copias precisam ficar identicas -- veja o comentario deste job")
                  falhou = 1
              elif vistos:
                  print("ok    %s() identica em %d arquivo(s)" % (fn, len(vistos)))

          # O nav do mkdocs.yml e a lista ESPELHO do gitlab-seed.sh sao a MESMA
          # decisao escrita duas vezes: o que o TechDocs publica. Divergiram em
          # 2026-08-28 -- docs/CATALOGO.md entrou no nav e nao no espelho --, e
          # o sintoma seria um item de menu levando a lugar nenhum no portal
          # que a plateia abre. O seed nao acusa: o aviso dele so dispara no
          # caso inverso, arquivo listado que sumiu do repo.
          import re
          nav = re.findall(r'^\s+-\s+.+?:\s*(\S+\.md)\s*$',
                           open("mkdocs.yml").read(), re.M)
          seed = open("scripts/gitlab-seed.sh").read()
          espelho = set(re.findall(r'"(docs/[^"]+\.md)"', seed))
          for md in nav:
              alvo = md if md.startswith("docs/") else "docs/" + md
              if alvo in espelho:
                  print("ok    %s no nav e no espelho" % alvo)
              else:
                  print("FALHA %s esta no nav do mkdocs e NAO no ESPELHO "
                        "do gitlab-seed.sh" % alvo)
                  falhou = 1

          sys.exit(falhou)
          EOF
