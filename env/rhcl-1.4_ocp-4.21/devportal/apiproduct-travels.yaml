# ===========================================================================
# APIProduct — a Travels API como item de catalogo do developer portal.
#
# Requer 'components.developerPortal.enabled: true' no CR Kuadrant (o
# controller vem desligado por default) e as CRDs devportal.kuadrant.io, que
# so existem a partir do RHCL 1.4.2. E por isso que este diretorio mora em
# env/rhcl-1.4_ocp-4.21/ e nao em base/: no cluster 1.2 o apply falharia.
#
# Nao ha nada a preencher a mao alem dos metadados comerciais: o controller
# descobre o resto da propria rota. Depois de aplicar, status traz
#   discoveredPlans        os 4 tiers com limite e cota, lidos do PlanPolicy
#   discoveredAuthScheme   o esquema de API key, lido do AuthPolicy da rota
#
# ---------------------------------------------------------------------------
# A descoberta do esquema exige que o AuthPolicy da rota declare 'spec.rules',
# NAO 'spec.defaults.rules' -- o controller ignora o wrapper de defaults e o
# APIProduct fica sem discoveredAuthScheme, o que reprova todo APIKey com
# 'Failed=True reason=AuthSchemeNotFound'. Ver o comentario em
# base/policies-security/travel-agency-authpolicy.yaml.
# ---------------------------------------------------------------------------
# ===========================================================================
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  # Sem esta anotacao o plugin @kuadrant/* le o APIProduct, conta como
  # publicado e nao sincroniza: "has no backstage.io/owner annotation,
  # skipping catalog sync". O valor precisa ser uma entidade que exista.
  annotations:
    backstage.io/owner: group:default/platform-team
  name: travels-api
  namespace: travel-agency
spec:
  displayName: Travels API
  description: >-
    A API da travel-agency publicada em tres planos comerciais (free, silver,
    gold). O limite de cada plano vem do PlanPolicy travels-plans; a chave do
    parceiro carrega o plano no label kuadrant.io/plan-id.
  version: v1
  approvalMode: manual
  publishStatus: Published
  tags:
    - travel
    - partners
    - rate-limited
  # Sem este bloco o operator DEFAULTA as URLs por convencao, montando
  # travels-api-v1-travel-agency.../q/openapi -- um endpoint Quarkus que nao
  # existe aqui (o servico travels e a imagem de demo do Kiali, que nao publica
  # OpenAPI). A rota responde 503 e o portal mostra
  # "OpenAPI specification not yet synced".
  #
  # O spec vive em rhdh/catalog/travels-openapi.yaml e e servido pelo httpd
  # interno do RHDH, cujo host ja esta em backend.reading.allow. Quem busca e o
  # backend, entao a URL interna serve.
  #
  # docsURL/swaggerUI ficam de fora de proposito: nao ha Swagger UI implantado,
  # e link quebrado no portal e pior que link ausente -- a aba Definition da
  # entidade ja renderiza o spec.
  # ATENCAO ao trocar a URL: quem busca o spec e o OPERATOR, nao o plugin. Ele
  # grava o conteudo em status.openapi.raw, e e DAI que o Backstage monta a
  # definition -- o plugin nunca acessa a URL.
  #
  # E o operator nao reprocessa sozinho: em falha ele registra
  #   OpenAPISpecReady=False :: failed to fetch ... unexpected status code 404.
  #   Controller will not retry; the spec needs to change
  # Se a URL passou a funcionar depois do primeiro erro, e preciso ALTERAR o
  # spec para destravar (ex: gravar outra URL e voltar). Conferir com:
  #   oc get apiproduct travels-api -n travel-agency \
  #     -o jsonpath='{.status.conditions[?(@.type=="OpenAPISpecReady")].message}'
  documentation:
    openAPISpecURL: http://rhdh-catalog-server.rhdh-rhcl.svc.cluster.local:8080/travels-openapi.yaml
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: travel-agency
