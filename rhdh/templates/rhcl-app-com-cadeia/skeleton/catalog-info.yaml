apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    # Proveniencia: qual template criou este componente (rastreio do golden path).
    backstage.io/source-template: template:default/rhcl-app-com-cadeia
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/kubernetes-namespace: ${{ values.namespace }}
    backstage.io/techdocs-ref: dir:.
    gitlab.com/project-slug: ${{ values.repoSlug }}
    app.openshift.io/vcs-uri: https://${{ values.gitlabHost }}/${{ values.repoSlug }}
  tags: [cadeia-de-suprimento, tekton, gitops]
  links:
    - title: A aplicacao
      url: https://${{ values.hostname }}
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: travel
