# MOMENTO 3 -- a primeira policy do desenvolvedor.
#
# Uma chave, um Secret. O label 'app: echo-exposta' e o que a AuthPolicy
# procura; sem ele a chave existe e nao vale nada.
apiVersion: v1
kind: Secret
metadata:
  name: apikey-echo-exposta
  namespace: kuadrant-system
  labels:
    authorino.kuadrant.io/managed-by: authorino
    app: echo-exposta
    # O plano da chave. Sem este label o PlanPolicy do momento 4 nao tem em
    # que tier encaixar o chamador, e o limite nunca se aplica.
    kuadrant.io/plan-id: experimental
  annotations:
    secret.kuadrant.io/user-id: "quem-testou"
    rhcl.demo/autor: Sandro Tanaka
stringData:
  api_key: chave-do-echo-exposta
type: Opaque
---
# A AuthPolicy que mira a ROTA -- e que SOBREPOE o deny-all do Gateway.
#
# Repare no targetRef: kind HTTPRoute. O prod-web-deny-all mira o Gateway.
# Duas policies, dois alvos, e o RHCL resolve a precedencia: onde a rota
# declara a sua, o teto cede. E o Ato 3, acontecendo com a sua API.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: echo-exposta-authpolicy
  namespace: echo-exposta
  annotations:
    rhcl.demo/autor: Sandro Tanaka
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo-exposta
  rules:
    authentication:
      api-key-authn:
        apiKey:
          allNamespaces: true
          selector:
            matchLabels:
              app: echo-exposta
        credentials:
          queryString:
            name: APIKEY
