# A chave de teste do ECHO -- e a explicacao de um misterio antigo: as chaves
# de parceiro sempre deram 401 no echo porque o AuthConfig de cada produto
# exige o rotulo devportal.kuadrant.io/apiproduct correspondente (medido em
# 2026-08-31 lendo o AuthConfig vivo). Esta carrega echo-api.
apiVersion: v1
