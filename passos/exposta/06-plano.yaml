# PASSO 6 -- quanto essa chave pode chamar. Quem entra ja esta resolvido; isto
# decide quanto. O plano vem do rotulo da chave (kuadrant.io/plan-id), e o
# limite e por janela: 3 chamadas a cada 10 segundos.
apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: echo-exposta-plans
  namespace: echo-exposta
  annotations:
    rhcl.demo/autor: Sandro Tanaka
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo-exposta
  plans:
    - tier: experimental
      predicate: '(has(auth.identity.metadata.labels) && "kuadrant.io/plan-id" in auth.identity.metadata.labels ? auth.identity.metadata.labels["kuadrant.io/plan-id"] : (has(auth.identity.metadata.annotations) && "secret.kuadrant.io/plan-id" in auth.identity.metadata.annotations ? auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] : "")) == "experimental"'
      limits:
        daily: 500
        custom:
          - limit: 3
            window: 10s
