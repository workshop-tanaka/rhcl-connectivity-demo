# Valores especificos de ambiente foram sanitizados na captura:
# o dominio real e o label kuadrant.io/lb-attribute-geo-code vivem em env/<versao>/.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/instance: echo-api
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: echo-api
    deployment: echo-api
    helm.sh/chart: echo-api-0.1.0
    service: echo-api
  name: echo-api
  namespace: echo-api
spec:
  hostnames:
    - echo.travels.example.com
  parentRefs:
    # echo-web, e nao prod-web (2026-09-01): o echo ganhou gateway DEDICADO,
    # com listener no hostname exato dele. As policies (AuthPolicy OIDC e
    # PlanPolicy) miram esta HTTPRoute e se movem junto; deny-all e telemetria
    # do gateway novo estao em env/rhcl-1.4_ocp-4.21/devportal/echo-api.yaml.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: echo-web
      namespace: ingress-gateway
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: echo-api
          namespace: echo-api
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
