# AuthPolicy com targetRef na HTTPRoute.
#
# Sem ela, a rota herda o deny-all do Gateway prod-web e responde 403 para
# tudo -- esse e o default seguro da borda. Anexar esta policy e o que
# "libera" a rota, e por isso ela nasce junto com o servico.
#
# allNamespaces: false -> as chaves sao lidas no namespace do Authorino
# (kuadrant-system), NAO no namespace da aplicacao. Ver apikey-secret.template.yaml.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: ${{ values.name }}-authpolicy
  namespace: ${{ values.namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ${{ values.name }}
  defaults:
    strategy: atomic
    rules:
      authentication:
        api-key-authn:
          apiKey:
            allNamespaces: false
            selector:
              matchLabels:
                app: ${{ values.apiKeyLabel }}
          credentials:
            queryString:
              name: APIKEY
          metrics: false
          priority: 0
