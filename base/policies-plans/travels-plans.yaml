# ===========================================================================
# PlanPolicy — API como produto: tiers comerciais em cima da mesma rota.
#
# extensions.kuadrant.io/v1alpha1, entregue pelo RHCL 1.2. A extensao
# 'plan-policy' roda dentro do kuadrant-operator (confirme com:
#   oc logs -n kuadrant-system deploy/kuadrant-operator-controller-manager \
#     | grep 'Discovered extension').
#
# O que o controller faz quando isto e aplicado:
#   1. injeta no AuthConfig gerado uma dynamicMetadata 'plan', calculada por
#      CEL a partir dos predicates abaixo;
#   2. cria no Limitador um limite por tier (namespace travel-agency/travel-agency);
#   3. reescreve o WasmPlugin do Gateway com conditionalData por
#      'auth.kuadrant.plan == "<tier>"'.
#
# Inspecione os tres:
#   oc get authconfig -n kuadrant-system -o yaml | grep -A20 'properties:'
#   oc get limitador limitador -n kuadrant-system -o jsonpath='{.spec.limits}'
#   oc get wasmplugin kuadrant-prod-web -n ingress-gateway -o jsonpath='{.spec.pluginConfig}'
#
# ---------------------------------------------------------------------------
# ORDEM IMPORTA: "a identidade e classificada pelo primeiro plano que casar"
# (schema do CRD). Por isso o catch-all vem por ultimo -- se viesse antes,
# engoliria gold e silver.
#
# O catch-all nao e enfeite. Sem ele, uma identidade que nao casa com nenhum
# plano fica sem 'plan', o wasm nao chama o Limitador e a requisicao passa sem
# limite. Fail-open. O plano 'unclassified' e deliberadamente apertado: se
# alguem emitir uma chave sem tier, o efeito e visivel (429 cedo) em vez de
# invisivel (sem limite).
#
# ---------------------------------------------------------------------------
# DOIS LIMITES POR TIER, COM PAPEIS DIFERENTES -- e so um deles e da demo.
#
#   custom (janela de 10s)  e o que o Ato 2 mostra. Baixo de proposito: um
#                           limite realista (milhares/10s) nao produz nenhum
#                           429 na tela e o efeito da policy fica invisivel.
#
#   daily                   NAO aparece em nenhum ato. Existe porque o
#                           APIProduct do developer portal publica os planos a
#                           partir daqui (status.discoveredPlans) -- e um plano
#                           comercial sem cota nao convence ninguem.
#
# POR QUE AS DIARIAS SAO ALTAS: elas ja mataram a demo. Com free=50/dia, um
# unico ciclo de ensaio (preflight + traffic.sh tiers) consumia 15 -- tres
# ensaios e o Ato 2 ficava morto ate 00:00 UTC, com um sintoma que engana em
# cheio (429 em tudo, que e exatamente o que a demo QUER mostrar, mas sem
# nenhum 200 antes). Ver armadilha 8 em docs/RUNBOOK.md.
#
# Os valores atuais mantem a razao 1:10:100 entre os planos -- que e o que o
# portal exibe e o que sustenta a conversa comercial -- e dao ~55 minutos de
# soak continuo no free antes de esbarrar na cota. O ritual de 'traffic.sh
# reset' continua valendo como rede, mas deixou de ser pre-requisito para
# apresentar.
#
# Ao mexer nestes numeros: mexa nas TRES diarias juntas. A razao entre elas e
# o argumento; o valor absoluto e so folga de ensaio.
# ---------------------------------------------------------------------------
# ===========================================================================
apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  # 'app: travels' nao e usado por nenhum controlador do Kuadrant -- serve ao
  # portal: e por este label que o RHDH liga esta policy ao componente
  # travels (backstage.io/kubernetes-label-selector) e a mostra na aba
  # Kubernetes. Nao existe plugin de Connectivity Link; este e o caminho.
  labels:
    app: travels
  name: travels-plans
  namespace: travel-agency
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: travel-agency

  plans:
    # -- gold: parceiro integrado, cota de negocio (diaria) e nao de rajada.
    - tier: gold
      predicate: 'auth.identity.metadata.labels["kuadrant.io/plan-id"] == "gold"'
      limits:
        daily: 100000
        custom:
          - limit: 30
            window: 10s

    # -- silver: contrato menor, mesma API.
    - tier: silver
      predicate: 'auth.identity.metadata.labels["kuadrant.io/plan-id"] == "silver"'
      limits:
        daily: 10000
        custom:
          - limit: 10
            window: 10s

    # -- free: avaliacao. O 429 aqui e o argumento de upgrade.
    - tier: free
      predicate: 'auth.identity.metadata.labels["kuadrant.io/plan-id"] == "free"'
      limits:
        daily: 1000
        custom:
          - limit: 3
            window: 10s

    # -- catch-all: rede de seguranca contra o fail-open. Mantenha por ultimo.
    - tier: unclassified
      predicate: 'true'
      limits:
        custom:
          - limit: 1
            window: 60s
