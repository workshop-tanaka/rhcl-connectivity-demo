# PASSO 2 -- a rota nova ganha o que a /travels ja tem: a chave e os planos.
# Sem este passo ela responde 403 a todos (o deny-all do Gateway): a versao
# nova nasce FECHADA. Os dois objetos sao copias dos da /travels, apontando
# para a rota nova -- policy gruda na rota, nao na aplicacao.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: versoes-chave
  namespace: travel-agency
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: travels-versoes}
  rules:
    authentication:
      chave:
        apiKey:
          # false aqui; numa turma com as chaves no namespace do participante a
          # copia dele sai com true (tenant.sh, regra CHAVES), e quem impede o
          # rotulo de um servir a outro e a regra de admissao das chaves
          allNamespaces: false
          selector: {matchLabels: {app: partner}}
        credentials: {authorizationHeader: {prefix: APIKEY}}
    response:
      success:
        headers:
          x-partner:
            plain:
              expression: 'has(auth.identity.metadata.annotations) && "secret.kuadrant.io/user-id" in auth.identity.metadata.annotations ? auth.identity.metadata.annotations["secret.kuadrant.io/user-id"] : auth.identity.metadata.name'
---
apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: versoes-planos
  namespace: travel-agency
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: travels-versoes}
  plans:
    - tier: gold
      predicate: '(has(auth.identity.metadata.labels) && "kuadrant.io/plan-id" in auth.identity.metadata.labels ? auth.identity.metadata.labels["kuadrant.io/plan-id"] : (has(auth.identity.metadata.annotations) && "secret.kuadrant.io/plan-id" in auth.identity.metadata.annotations ? auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] : "")) == "gold"'
      limits: {daily: 100000, custom: [{limit: 30, window: 10s}]}
    - tier: silver
      predicate: '(has(auth.identity.metadata.labels) && "kuadrant.io/plan-id" in auth.identity.metadata.labels ? auth.identity.metadata.labels["kuadrant.io/plan-id"] : (has(auth.identity.metadata.annotations) && "secret.kuadrant.io/plan-id" in auth.identity.metadata.annotations ? auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] : "")) == "silver"'
      limits: {daily: 10000, custom: [{limit: 10, window: 10s}]}
    - tier: free
      predicate: '(has(auth.identity.metadata.labels) && "kuadrant.io/plan-id" in auth.identity.metadata.labels ? auth.identity.metadata.labels["kuadrant.io/plan-id"] : (has(auth.identity.metadata.annotations) && "secret.kuadrant.io/plan-id" in auth.identity.metadata.annotations ? auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] : "")) == "free"'
      limits: {daily: 1000, custom: [{limit: 3, window: 10s}]}
    - tier: unclassified
      predicate: 'true'
      limits: {custom: [{limit: 1, window: 60s}]}
