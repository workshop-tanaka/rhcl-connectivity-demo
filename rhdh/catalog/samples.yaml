# ---------------------------------------------------------------------------
# A CADEIA DE SUPRIMENTO DE CADA AMOSTRA.
#
# Aqui e onde o pedido "catalogo completo, com pipeline, gitops, RHTAS, Nexus,
# SonarQube, ACS, Quay e GitLab" se realiza -- e realiza-se por RELACAO, e nao
# por repeticao: as ferramentas ja sao entidades deste catalogo (nexus e
# sonarqube em cicd.yaml; quay e tekton-pipelines idem; acs-central, rhtas e
# tekton-chains em seguranca.yaml; gitlab e openshift-gitops em plataforma.yaml).
# O que cada amostra declara e o dependsOn para elas.
#
# Duplicar uma entidade 'Nexus da amostra bookinfo' daria quatro cards
# descrevendo o mesmo Deployment -- e a pergunta "qual deles e o Nexus?"
# passaria a ter quatro respostas.
#
# open-telemetry NAO tem pipeline: a imagem do coletor e escolhida pelo
# OpenTelemetry Operator a partir da versao dele, e espelhar o que o operador
# vai ignorar seria assinar o que nao roda.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bookinfo-supply-chain
  title: Pipeline — cadeia de suprimento (bookinfo)
  description: >-
    Valida o render e o hostname dos manifests, passa pelo portao do SonarQube
    sobre o YAML, espelha a imagem de terceiro no Quay com skopeo, deixa o
    Tekton Chains assinar e registrar no Rekor, varre a copia com o roxctl e
    publica o bundle renderizado no Nexus. NAO COMPILA NADA: uma amostra do
    Istio nao tem codigo nosso, e o que se governa aqui e o manifesto e a imagem
    de terceiro -- as duas coisas que a maioria poe em producao sem cadeia
    nenhuma.
  annotations:
    rhcl.demo/cluster-object: pipeline/bookinfo/samples-supply-chain
    backstage.io/kubernetes-namespace: bookinfo
    backstage.io/kubernetes-label-selector: app=bookinfo
  labels:
    rhcl.demo/camada: cicd
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - cicd
spec:
  type: pipeline
  owner: user:default/tanaka
  system: sample-bookinfo
  dependsOn:
    - resource:default/tekton-pipelines
    - resource:default/tekton-chains
    - resource:default/sonarqube
    - resource:default/quay
    - resource:default/nexus
    - resource:default/acs-central
    - resource:default/rhtas
    - resource:default/gitlab

