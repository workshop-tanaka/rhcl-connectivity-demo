# O alvo default e o Service do gateway da PROPRIA amostra (porta 80): o
# trafego atravessa o data path inteiro -- gateway, VirtualService de reviews,
# fan-out -- sem depender de Route externa nem de DNS do cluster efemero.
# Sobrescreva com TRAFEGO_ALVO / TRAFEGO_INTERVALO no Deployment.
trafego.alvo=http://bookinfo-gateway-istio.bookinfo.svc.cluster.local:80
trafego.intervalo=1s

# uber-jar: o S2I java executa jar unico sem configuracao (ver pom.xml)
quarkus.package.jar.type=uber-jar
quarkus.log.level=INFO
# sem servidor HTTP proprio: este pod so fala para fora
quarkus.banner.enabled=false
