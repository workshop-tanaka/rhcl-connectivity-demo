    padrao ('SAMPLES=websockets bash scripts/provision.sh samples' a traz). E a
    unica das quatro cuja subida depende do Docker Hub anonimo e de uma imagem
    antiga sob a SCC restricted-v2, e ela nao sustenta ato nenhum.
