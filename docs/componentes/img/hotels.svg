<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="sans-serif">
  <defs>
    <marker id="seta-verde" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="seta-vermelha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fff"/>

  <!-- fluxo negado: travels tenta discounts direto -->
  <path d="M 105 76 C 105 16, 620 16, 620 76" fill="none" stroke="#dc2626"
        stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-vermelha)"/>
  <text x="360" y="30" text-anchor="middle" fill="#dc2626" font-size="12">403 RBAC: access denied — SA default não é principal permitido</text>

  <!-- travels -->
  <rect x="30" y="80" width="150" height="64" rx="6" fill="#64748b"/>
  <text x="105" y="106" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">travels</text>
  <text x="105" y="126" text-anchor="middle" fill="#fff" font-size="11">orquestrador · SA default</text>

  <!-- travels -> hotels -->
  <line x1="180" y1="112" x2="271" y2="112" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="226" y="100" text-anchor="middle" fill="#1e293b" font-size="11">fan-out :8000</text>

  <!-- hotels (componente central) -->
  <rect x="275" y="70" width="180" height="84" rx="6" fill="#2563eb"/>
  <text x="365" y="96" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">hotels</text>
  <text x="365" y="116" text-anchor="middle" fill="#fff" font-size="11">Deployment hotels-v1 · :8000</text>
  <text x="365" y="134" text-anchor="middle" fill="#fff" font-size="11">SA discount-access-sa</text>
  <text x="365" y="170" text-anchor="middle" fill="#1e293b" font-size="10">sidecar istio · traces 10% (tags portal/user)</text>

  <!-- hotels -> discounts -->
  <line x1="455" y1="104" x2="541" y2="104" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="498" y="92" text-anchor="middle" fill="#16a34a" font-size="11">mTLS · SA ok → 200</text>

  <!-- discounts -->
  <rect x="545" y="80" width="150" height="64" rx="6" fill="#64748b"/>
  <text x="620" y="104" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">discounts</text>
  <text x="620" y="124" text-anchor="middle" fill="#fff" font-size="10">AuthorizationPolicy</text>
  <text x="620" y="136" text-anchor="middle" fill="#fff" font-size="10">discounts-only-sellers</text>

  <!-- hotels -> mysqldb -->
  <line x1="365" y1="154" x2="365" y2="286" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="378" y="230" fill="#1e293b" font-size="11">MYSQL_SERVICE · senha do</text>
  <text x="378" y="246" fill="#1e293b" font-size="11">Secret mysql-credentials (rootpasswd)</text>

  <!-- mysqldb -->
  <rect x="275" y="290" width="180" height="64" rx="6" fill="#64748b"/>
  <text x="365" y="316" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">mysqldb.travel-db</text>
  <text x="365" y="336" text-anchor="middle" fill="#fff" font-size="11">:3306 · database test</text>

  <!-- legenda -->
  <text x="30" y="380" fill="#1e293b" font-size="11">Passo 7: a fronteira leste-oeste é a identidade do workload (SPIFFE via mTLS), não o endereço.</text>
</svg>
