# ---------------------------------------------------------------------------
# COMO CADA AMOSTRA ENTRA -- o gateway do UPSTREAM, e nao o prod-web.
#
# Duas decisoes conferidas no cluster em 2026-08-28:
#
#   1. a variante networking/ do upstream nao funciona aqui. Ela usa o Gateway
#      do Istio com 'selector: istio: ingressgateway', e nao existe deployment
#      com esse rotulo -- 'oc get deploy -A -l istio=ingressgateway' devolve
#      nada. O OSSM 3 nao instala o ingressgateway classico; quem materializa
#      um gateway e a GatewayClass 'istio'. O Gateway seria aceito, ficaria sem
#      endereco, e a rota nunca receberia trafego. Sem erro em lugar nenhum.
#
#   2. gateway proprio, e nao o prod-web: ele carrega a AuthPolicy de escopo de
#      gateway prod-web-deny-all, e rota anexada sem AuthPolicy propria e
#      NEGADA. Uma amostra sem RHCL la responderia 401 em tudo, com a causa num
#      objeto de outro namespace.
#
# O grpc-echo NAO tem entidade de gateway porque nao tem gateway: o upstream
# dele tambem nao tem, e o que ele demonstra e leste-oeste.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bookinfo-gateway
  title: Gateway — bookinfo (upstream)
  description: >-
    O Gateway do upstream, copiado de samples/bookinfo/gateway-api/ com o
    namespace acrescentado: Gateway API, classe istio, HTTP na 80. Quem termina
    TLS e o Route do OpenShift que o publica -- nao ha LoadBalancer num SNO, e
    sem o Route a amostra sobe inteira e nao e alcancavel, com o Gateway
    reportando Programmed=True.
  annotations:
    rhcl.demo/cluster-object: gateway/bookinfo/bookinfo-gateway
    backstage.io/kubernetes-namespace: bookinfo
    backstage.io/kubernetes-label-selector: app=bookinfo
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - gateway-api
spec:
  type: gateway
  owner: user:default/tanaka
  system: sample-bookinfo
