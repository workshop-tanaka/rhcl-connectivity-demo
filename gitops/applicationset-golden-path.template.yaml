# ===========================================================================
# ApplicationSet do golden path — o que faz um repositorio virar servico sem
# ninguem aplicar nada.
#
# TEMPLATE: '__GITLAB_API__' e substituido por 'scripts/provision.sh gitops',
# que monta a URL a partir da rota do GitLab no cluster. Nao aplique este
# arquivo direto -- o placeholder viraria um host literal.
#
# ---------------------------------------------------------------------------
# COMO A DESCOBERTA FUNCIONA:
#
#   group       'rhcl/apis'. ESTAR NO SUBGRUPO E A CONDICAO -- e nao um topic
#               que alguem precisa lembrar de por. Foi uma troca deliberada ao
#               migrar do GitHub: la a descoberta dependia do topic
#               'rhcl-golden-path', e repo sem o topic simplesmente nao era
#               descoberto (sem erro, sem Application, sem servico). Neste
#               cluster isso ja aconteceu de verdade -- foi removendo o topic
#               que cobranca e pagamentos sairam do Argo.
#
#   pathsExist  segunda trava: projeto no subgrupo mas sem 'manifests/' e
#               ignorado. Evita que um projeto criado a mao vire Application
#               vazio.
#
#   requeueAfterSeconds  o gerador consulta a API do GitLab nesse intervalo. E
#               por isso que o servico novo demora ate ~3 min para aparecer --
#               nao e o Argo estar lento, e o ciclo de descoberta.
#
# O token e o PAT que a etapa 'gitlab' fabrica e grava em
# golden-path-gitlab-token. Projeto privado nao aparece na listagem, e o
# sintoma e silencio -- por isso o template cria os projetos como publicos.
#
# cloneProtocol: https E OBRIGATORIO, e nao e detalhe do GitHub. O campo fica
# no nivel do scmProvider (nao dentro de github:/gitlab:) e vale para os dois:
# sem ele o default e ssh, o Argo pede agente SSH que nao existe, e NENHUMA
# Application sincroniza -- enquanto o ApplicationSet reporta
# ErrorOccurred=False e "All applications have been generated successfully".
#
# Medido nos dois providers neste cluster: no GitHub em 2026-08-24, e de novo
# no GitLab em 2026-08-25, quando este arquivo foi convertido e o campo saiu
# junto por engano. O repoURL veio 'git@gitlab.apps...:rhcl/apis/...git'.
# ---------------------------------------------------------------------------
# POR QUE ISTO NAO GOVERNA A PLATAFORMA.
#
# O cluster 1.2 desta demo tinha 16 Applications com selfHeal cobrindo metade do
# cluster, e por causa disso todo 'oc apply' manual era revertido em segundos --
# e a razao de este repo separar base/ de platform-reference/. Aqui o Argo
# governa SO os repositorios gerados pelo golden path: o servico do
# desenvolvedor. A plataforma continua sendo provisionada por provision.sh, e a
# camada de demo por 'oc apply -k'. A fronteira e a mesma; muda quem tem GitOps.
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rhcl-golden-path
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - scmProvider:
        cloneProtocol: https
        gitlab:
          group: rhcl/apis
          includeSubgroups: false
          api: __GITLAB_API__
          tokenRef:
            secretName: golden-path-gitlab-token
            key: token
        filters:
          - pathsExist: [manifests]
        requeueAfterSeconds: 180
  template:
    metadata:
      name: '{{ .repository }}'
      labels:
        app.kubernetes.io/part-of: rhcl-golden-path
    spec:
      project: default
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: .
        # 'directory' e nao 'kustomize': assim uma assinatura nova
        # (consumers/<parceiro>.yaml, aberta por pull request pelo template
        # rhcl-api-subscription) entra no cluster sem editar lista de resources.
        # O include depende da convencao de nome dos manifests -- ver o
        # cabecalho de gitops/application.yaml no repositorio gerado.
        directory:
          recurse: true
          include: '{manifests/[0-9]*.yaml,consumers/*.yaml}'
      destination:
        server: https://kubernetes.default.svc
        # Fallback apenas: todo manifesto do golden path declara o proprio
        # namespace, e o namespace e criado por 00-namespace.yaml (com o label
        # de injecao da malha, sem o qual o servico nasce fora do mesh).
        namespace: '{{ .repository }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
