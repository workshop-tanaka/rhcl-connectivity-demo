apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-system
---
# OwnNamespace e o UNICO modo que este operator suporta (AllNamespaces=false):
# operator e CR GitLab precisam viver no mesmo namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: gitlab-system
  namespace: gitlab-system
spec:
  targetNamespaces:
    - gitlab-system
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gitlab-operator-kubernetes
  namespace: gitlab-system
spec:
  channel: stable
  name: gitlab-operator-kubernetes
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
