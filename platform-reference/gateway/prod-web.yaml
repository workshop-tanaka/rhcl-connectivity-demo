# Valores especificos de ambiente foram sanitizados na captura:
# o dominio real e o label kuadrant.io/lb-attribute-geo-code vivem em env/<versao>/.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prod-web
  namespace: ingress-gateway
spec:
  gatewayClassName: istio
  listeners:
    - allowedRoutes:
        namespaces:
          from: All
      hostname: '*.travels.example.com'
      name: api
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: api-tls
        mode: Terminate
