# ---------------------------------------------------------------------------
# A API do bookinfo -- descrita AQUI, e nao ingerida de um APIProduct.
#
# A travels-api chega ao portal pelo provider do plugin Kuadrant, que ingere o
# APIProduct do cluster (por isso ela esta em entidades-externas.txt). O
# bookinfo nao tem APIProduct: a AuthPolicy dele seleciona a chave por LABEL
# (devportal.kuadrant.io/apiproduct=bookinfo-api), que e so um label -- nao
# exige o CR. Criar um APIProduct so para a entidade existir poria a amostra na
# dependencia das CRDs de devportal, que so existem no RHCL 1.4.2+.
#
# O spec e INLINE e nao uma URL: o backend do RHDH busca definicao remota, e um
# 'openAPISpecURL' apontando para o raw do GitLab do cluster e mais uma coisa
# que quebra quando o cluster muda. Os quatro caminhos abaixo sao os que o
# bookinfo publica de verdade -- estao no swagger.yaml do upstream.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: bookinfo-api
  title: Bookinfo API
  description: >-
    A API de produtos do bookinfo, servida em /api/v1/products pelo gateway da
    propria amostra. SEM CREDENCIAL POR ENQUANTO: a AuthPolicy que a governaria
    esta em samples/bookinfo/rhcl/ e nao e aplicada -- e este spec descreve o
    que responde hoje, e nao o que se pretende.
  annotations:
    rhcl.demo/cluster-object: httproute/bookinfo/bookinfo
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
spec:
  type: openapi
  lifecycle: experimental
  owner: user:default/tanaka
  system: sample-bookinfo
  definition: |
    openapi: 3.0.3
    info:
      title: Bookinfo API
      version: "1.0.0"
      description: >-
        API de produtos da amostra bookinfo do Istio, servida pelo gateway da
        propria amostra (bookinfo-gateway, Gateway API classe istio) e
        publicada por um Route do OpenShift. Sem credencial: a camada de
        policies vive em samples/bookinfo/rhcl/ e nao esta aplicada.
    paths:
      /api/v1/products:
        get:
          summary: Lista os produtos
          responses:
            "200": { description: OK }
      /api/v1/products/{id}:
        get:
          summary: Detalhes de um produto
          parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer }
          responses:
            "200": { description: OK }
      /api/v1/products/{id}/reviews:
        get:
          summary: Resenhas de um produto
          description: >-
            A versao que responde depende do VirtualService reviews -- 90% v1,
            10% v3, e v2 declarada com zero por cento.
          parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer }
          responses:
            "200": { description: OK }
      /api/v1/products/{id}/ratings:
        get:
          summary: Notas de um produto
          parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer }
          responses:
            "200": { description: OK }
---
# O gerador de trafego da amostra: pouco por pod, sempre ligado, e o volume e
# por replicas -- oc scale e o botao. Sem Sonar/Quay/pipeline de proposito: a
# imagem nasce de build BINARIO na etapa 'samples' (apps/bookinfo-traffic),
# sem passar por SCM nem cadeia de suprimento; anotar fonte que nao existe
# criaria abas mortas, e a regra e real-only.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: bookinfo-traffic
  title: bookinfo — traffic (gerador)
  description: >-
    Trafego continuo e aleatorio para o bookinfo ter movimento no palco:
    caminhos e usuarios sorteados contra o gateway da propria amostra
    (~0,8 req/s por replica, com jitter). Quarkus, construido por build
    binario na etapa samples. Volume: oc scale deploy/bookinfo-traffic.
  annotations:
    rhcl.demo/cluster-object: deployment/bookinfo/bookinfo-traffic
    acs/deployment-name: bookinfo-traffic
    backstage.io/kubernetes-label-selector: app=bookinfo-traffic
    backstage.io/kubernetes-namespace: bookinfo
    kiali.io/namespace: bookinfo
    kiali.io/provider: default
    grafana/dashboard-selector: rhcl
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - istio
spec:
  type: service
  lifecycle: experimental
  owner: user:default/tanaka
  system: sample-bookinfo
  dependsOn:
    - component:default/bookinfo-productpage
