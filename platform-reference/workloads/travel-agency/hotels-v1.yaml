apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotels-v1
  namespace: travel-agency
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: hotels
      version: v1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-07-28T14:35:30Z"
        proxy.istio.io/config: |
          tracing:
            zipkin:
              address: zipkin.istio-system:9411
            sampling: 10
            custom_tags:
              http.header.portal:
                header:
                  name: portal
              http.header.device:
                header:
                  name: device
              http.header.user:
                header:
                  name: user
              http.header.travel:
                header:
                  name: travel
        readiness.status.sidecar.istio.io/applicationPorts: ""
        sidecar.istio.io/inject: "true"
      creationTimestamp: null
      labels:
        app: hotels
        version: v1
    spec:
      containers:
        - env:
            - name: CURRENT_SERVICE
              value: hotels
            - name: CURRENT_VERSION
              value: v1
            - name: LISTEN_ADDRESS
              value: :8000
            - name: DISCOUNTS_SERVICE
              value: http://discounts.travel-agency:8000
            - name: MYSQL_SERVICE
              value: mysqldb.travel-db:3306
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: rootpasswd
                  name: mysql-credentials
            - name: MYSQL_DATABASE
              value: test
          image: quay.io/kiali/demo_travels_hotels:v1
          imagePullPolicy: IfNotPresent
          name: hotels
          ports:
            - containerPort: 8000
              protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: discount-access-sa
      serviceAccountName: discount-access-sa
      terminationGracePeriodSeconds: 30
