# A rota se anexa ao Gateway compartilhado prod-web, que vive em outro
# namespace. Isso so funciona porque o listener do prod-web declara
# allowedRoutes.namespaces.from: All.
#
# O hostname PRECISA casar com o wildcard do listener (*.travels.<dominio>).
# Se nao casar, a HTTPRoute e aceita pelo controlador mas fica sem trafego --
# falha silenciosa classica de Gateway API. Confira com:
#   oc get httproute ${{ values.name }} -n ${{ values.namespace }} -o yaml
# e olhe status.parents[].conditions -> Accepted / ResolvedRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    service: ${{ values.name }}
spec:
  hostnames:
    - ${{ values.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: prod-web
      namespace: ingress-gateway
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: ${{ values.name }}
          namespace: ${{ values.namespace }}
          port: ${{ values.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
