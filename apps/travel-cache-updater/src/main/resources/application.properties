# Enderecos DEFAULT para o namespace consolidado (mesmo ns = nome curto de
# Service). Sobrescreva por env no Deployment se algo mudar de casa.
kafka.bootstrap.servers=travel-streams-kafka-bootstrap:9092

# O grupo 'cache-updater' e o PRIMEIRO consumer group real destes topicos --
# e o nome que a anotacao kafka.apache.org/consumer-groups do catalogo
# referencia. Renomear aqui exige renomear la, senao a aba do portal morre.
mp.messaging.incoming.pacotes-cdc.connector=smallrye-kafka
mp.messaging.incoming.pacotes-cdc.topic=travel.public.pacotes
mp.messaging.incoming.pacotes-cdc.group.id=cache-updater
mp.messaging.incoming.pacotes-cdc.auto.offset.reset=earliest
mp.messaging.incoming.pacotes-cdc.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# falha de desserializacao nao derruba o consumidor
mp.messaging.incoming.pacotes-cdc.failure-strategy=ignore

# Data Grid: endpointAuthentication esta desligado no CR (03-datagrid.yaml);
# intelligence BASIC pela mesma razao do EAP -- falar pelo Service estavel,
# nao por IP de pod que muda a cada reinicio.
quarkus.infinispan-client.hosts=travel-cache:11222
quarkus.infinispan-client.client-intelligence=BASIC
quarkus.infinispan-client.use-auth=false

quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false
quarkus.log.level=INFO
