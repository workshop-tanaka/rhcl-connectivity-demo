<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <defs>
    <marker id="seta-verde" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
    <marker id="seta-vermelha" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fff"/>

  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">discounts — o par v1/v2 do Ato 7</text>

  <!-- chamadores permitidos -->
  <rect x="16" y="84" width="172" height="100" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="102" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">cars · flights</text>
  <text x="102" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">hotels · insurances</text>
  <text x="102" y="152" text-anchor="middle" font-size="10" fill="#64748b">sa: discount-access-sa</text>
  <text x="102" y="168" text-anchor="middle" font-size="10" fill="#64748b">(os quatro vendedores)</text>

  <!-- chamador negado -->
  <rect x="16" y="236" width="172" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="102" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">travels</text>
  <text x="102" y="282" text-anchor="middle" font-size="10" fill="#64748b">sa: default (orquestrador)</text>
  <text x="102" y="320" text-anchor="middle" font-size="10" fill="#dc2626">403 RBAC: access denied</text>

  <!-- componente central -->
  <rect x="252" y="52" width="208" height="290" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="356" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">discounts</text>
  <text x="356" y="88" text-anchor="middle" font-size="10" fill="#64748b">Service ClusterIP :8000</text>

  <rect x="264" y="98" width="184" height="102" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="356" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">VirtualService discounts</text>
  <text x="356" y="134" text-anchor="middle" font-size="11" fill="#1e293b">90% → v1 · 10% → v2</text>
  <text x="356" y="152" text-anchor="middle" font-size="10" fill="#64748b">timeout 3s · retries 2 × 1s</text>
  <text x="356" y="168" text-anchor="middle" font-size="10" fill="#64748b">(5xx, reset, connect-failure)</text>
  <text x="356" y="188" text-anchor="middle" font-size="10" fill="#64748b">DestinationRule: subsets v1/v2</text>

  <rect x="264" y="212" width="184" height="118" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="356" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">sidecar Envoy</text>
  <text x="356" y="248" text-anchor="middle" font-size="10" fill="#1e293b">PeerAuthentication STRICT</text>
  <text x="356" y="266" text-anchor="middle" font-size="10" fill="#1e293b">AuthorizationPolicy</text>
  <text x="356" y="280" text-anchor="middle" font-size="10" fill="#1e293b">discounts-only-sellers</text>
  <text x="356" y="298" text-anchor="middle" font-size="10" fill="#64748b">permite só o principal</text>
  <text x="356" y="312" text-anchor="middle" font-size="10" fill="#64748b">…/sa/discount-access-sa</text>

  <!-- versoes -->
  <rect x="540" y="68" width="168" height="88" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="624" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">discounts-v1</text>
  <text x="624" y="108" text-anchor="middle" font-size="10" fill="#64748b">replicas: 1 · porta 8000</text>
  <text x="624" y="124" text-anchor="middle" font-size="10" fill="#64748b">demo_travels_discounts:v1</text>
  <text x="624" y="140" text-anchor="middle" font-size="10" fill="#64748b">sa: default</text>

  <rect x="540" y="240" width="168" height="88" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="624" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">discounts-v2</text>
  <text x="624" y="280" text-anchor="middle" font-size="10" fill="#64748b">replicas: 1 · porta 8000</text>
  <text x="624" y="296" text-anchor="middle" font-size="10" fill="#64748b">mesma imagem :v1</text>
  <text x="624" y="312" text-anchor="middle" font-size="10" fill="#64748b">sa: default</text>

  <!-- fluxo permitido -->
  <line x1="188" y1="134" x2="246" y2="134" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="217" y="124" text-anchor="middle" font-size="10" fill="#16a34a">mTLS OK</text>

  <line x1="460" y1="130" x2="534" y2="112" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="498" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">90%</text>

  <line x1="460" y1="290" x2="534" y2="286" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-verde)"/>
  <text x="498" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">10%</text>

  <!-- fluxo negado -->
  <line x1="188" y1="268" x2="246" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#seta-vermelha)"/>
  <line x1="210" y1="261" x2="224" y2="275" stroke="#dc2626" stroke-width="2"/>
  <line x1="224" y1="261" x2="210" y2="275" stroke="#dc2626" stroke-width="2"/>

  <text x="360" y="384" text-anchor="middle" font-size="10" fill="#64748b">o fan-out até o discounts exige /travels/&lt;cidade&gt; com o header user; sem ele os vendedores respondem sozinhos</text>
</svg>
