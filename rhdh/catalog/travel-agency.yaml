# ---------------------------------------------------------------------------
# Consumidores da API.
#
# Cada um corresponde a uma API key em base/identity/apikeys.yaml. O tier nao
# vem da chave em si: vem do label kuadrant.io/plan-id nela, que o PlanPolicy
# le no predicate. Uma chave 'app: partner' SEM esse label cai no plano
# catch-all -- e a falha e silenciosa.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: globex-travel
  title: Globex Travel
  description: Parceiro tier gold — 30 req/10s, 5000/dia (apikey-gold-globex).
  # Os parceiros nao tem servico nem trace proprio -- sao consumidores. O que
  # existe deles e consumo, e e exatamente o que o dashboard rhcl-parceiros
  # mede. A tag 'rhcl' traz os tres dashboards autorais para a pagina de cada
  # um; o de consumo e o que faz sentido aqui.
  annotations:
    grafana/dashboard-selector: rhcl
spec:
  type: api-consumer
  lifecycle: production
  owner: group:default/platform-team
  system: travel-agency
  consumesApis:
    - travels-api
