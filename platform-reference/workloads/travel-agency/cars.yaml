apiVersion: v1
kind: Service
metadata:
  labels:
    app: cars
  name: cars
  namespace: travel-agency
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: cars
  sessionAffinity: None
  type: ClusterIP
