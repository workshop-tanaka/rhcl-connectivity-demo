# RateLimitPolicy com targetRef na HTTPRoute.
#
# O contador usa auth.identity.userid, ou seja: limite POR API KEY, nao por IP.
# Isso cria uma dependencia real da AuthPolicy -- sem identidade resolvida nao
# ha contador, e o limite nao se aplica como voce espera.
#
# Atencao ao limite do Gateway (ingress-gateway-rlp-lowlimits, 50 req / 10s):
# ele vale para TODAS as rotas anexadas. Se o valor abaixo for mais permissivo,
# quem corta primeiro e o gateway, e este limite nunca aparece nos testes.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: ${{ values.name }}-ratelimit
  namespace: ${{ values.namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ${{ values.name }}
  limits:
    per-user:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: ${{ values.rateLimit }}
          window: ${{ values.rateLimitWindow }}
