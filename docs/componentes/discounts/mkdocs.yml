# TechDocs deste componente. O RHDH constroi com mkdocs no proprio pod.
#
# Layout obrigatorio: mkdocs.yml AQUI e a pagina em docs/. O TechDocs baixa SO
# esta subarvore -- um 'docs_dir: ..' apontando para a pagina la fora parece
# elegante e falha, porque o arquivo nem chega ao build. Medido.
site_name: discounts
nav:
  - Visao geral: index.md
plugins:
  - techdocs-core
