# TechDocs de cobranca — uma doc por produto de API.
#
# O CR APIProduct aponta spec.documentation.techdocsRef para este diretorio; o
# provider do plugin apenas repassa o valor para a anotacao
# backstage.io/techdocs-ref da entidade, e quem gera e o TechDocs do RHDH.
# Diferente do openAPISpecURL, aqui NAO ha busca pelo operator -- entao nao ha
# a armadilha do 'controller will not retry'.
site_name: cobranca
site_description: Documentacao do produto de API cobranca

docs_dir: docs

nav:
  - Visao geral: index.md

plugins:
  - techdocs-core
