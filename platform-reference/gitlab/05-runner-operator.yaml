# O RUNNER DA ESTEIRA (sessao de Connectivity Link). Quem confere o merge
# request antes do merge e um job de CI do GitLab, e job precisa de runner.
#
# Por que runner, e nao OpenShift Pipelines: o runner BUSCA o trabalho no
# GitLab, de dentro do cluster para fora -- nao depende de webhook. E webhook
# do GitLab para o cluster e justamente o que o GitLab recusa aqui ("rede
# local", HTTP 422, medido no cqfs4 e no 7kp5j). Decisao do Sandro em
# 2026-10-16.
#
# O token do runner e o CR 'Runner' saem do 'gitlab-turma.sh esteira', na
# primeira vez: runner de GRUPO (so os projetos dos participantes) e com tag.
# O token e emitido pela API do GitLab na hora e nao mora em arquivo nenhum.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
spec:
  targetNamespaces:
    - gitlab-runner
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gitlab-runner-operator
  namespace: gitlab-runner
spec:
  channel: stable
  name: gitlab-runner-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
