# NAO ha mais chave de teste do ECHO: desde 2026-08-31 ele autentica por OIDC
# (JWT do realm sso) -- o contraste do gateway e justamente esse: travels por
# API key, echo por identidade. O teste do echo obtem token como a persona
# sistema-teste (client echo-api, password grant); ver a colecao do Postman.
