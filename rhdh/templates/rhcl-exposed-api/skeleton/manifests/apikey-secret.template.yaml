# API key aceita pela AuthPolicy deste servico.
#
# TEMPLATE: o valor esta redigido de proposito -- nao versione a chave real.
# Aplique com o valor preenchido (ou via 'oc create secret'), fora do kustomize.
#
# Dois detalhes que costumam custar tempo:
#
#   1. NAMESPACE. Com allNamespaces: false, o Authorino procura a chave no
#      NAMESPACE DELE (kuadrant-system) -- nao no namespace da aplicacao.
#      Criar este Secret junto do Deployment resulta em 401 para tudo, sem
#      nenhum erro visivel na AuthPolicy.
#
#   2. LABEL authorino.kuadrant.io/managed-by: authorino. Sem ele o Authorino
#      simplesmente nao observa o Secret, mesmo estando no lugar certo e com
#      o label app correto.
#
# Criar de forma rapida:
#   oc create secret generic ${{ values.name }}-apikey -n kuadrant-system \
#     --from-literal=api_key="$(openssl rand -hex 24)"
#   oc label secret ${{ values.name }}-apikey -n kuadrant-system \
#     app=${{ values.apiKeyLabel }} authorino.kuadrant.io/managed-by=authorino
#
# Testar:
#   curl -sk "https://${{ values.hostname }}/?APIKEY=<chave>" -o /dev/null -w '%{http_code}\n'
apiVersion: v1
kind: Secret
metadata:
  name: ${{ values.name }}-apikey
  namespace: kuadrant-system
  labels:
    app: ${{ values.apiKeyLabel }}
    authorino.kuadrant.io/managed-by: authorino
type: Opaque
stringData:
  api_key: REDACTED
