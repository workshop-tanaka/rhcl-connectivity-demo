# ===========================================================================
# Red Hat Developer Hub — instalacao do operator.
#
# O operator RHDH so suporta o install mode AllNamespaces, entao o
# OperatorGroup e criado sem spec.targetNamespaces (escopo = cluster inteiro)
# e o namespace do operator e separado do namespace da instancia.
#
# Canal: fast-1.9 (pin de minor). O canal 'fast' segue sempre a ultima minor
# e faria upgrade automatico de 1.9 -> 1.10 -- indesejado num lab estavel.
# ===========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: rhdh-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhdh-operator-group
  namespace: rhdh-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhdh
  namespace: rhdh-operator
spec:
  channel: fast-1.9
  installPlanApproval: Automatic
  name: rhdh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: rhdh-operator.v1.9.4
