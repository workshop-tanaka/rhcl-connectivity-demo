<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="sans-serif">
  <defs>
    <marker id="seta-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="seta-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="seta-neutra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fff"/>

  <text x="20" y="22" font-size="13" font-weight="bold" fill="#1e293b">echo-api: duas rotas, um Gateway — a decisão é por rota</text>

  <!-- cliente -->
  <rect x="18" y="150" width="132" height="64" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="84" y="172" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Cliente</text>
  <text x="84" y="188" font-size="11" fill="#1e293b" text-anchor="middle">chave gold do travels</text>
  <text x="84" y="203" font-size="10" fill="#64748b" text-anchor="middle">?APIKEY=&lt;gold&gt;</text>

  <!-- cliente -> gateway -->
  <line x1="150" y1="182" x2="203" y2="182" stroke="#64748b" stroke-width="1.5" marker-end="url(#seta-neutra)"/>
  <text x="177" y="172" font-size="10" fill="#64748b" text-anchor="middle">HTTPS 443</text>

  <!-- gateway -->
  <rect x="207" y="140" width="160" height="84" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="287" y="164" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Gateway prod-web</text>
  <text x="287" y="181" font-size="11" fill="#1e293b" text-anchor="middle">classe istio</text>
  <text x="287" y="196" font-size="11" fill="#1e293b" text-anchor="middle">ns ingress-gateway</text>
  <text x="287" y="212" font-size="10" fill="#64748b" text-anchor="middle">listener api (HTTPS)</text>

  <!-- defaults do gateway (sobrepostos) -->
  <rect x="185" y="302" width="204" height="76" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="287" y="322" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">defaults do Gateway</text>
  <text x="287" y="338" font-size="10" fill="#1e293b" text-anchor="middle">prod-web-deny-all</text>
  <text x="287" y="352" font-size="10" fill="#1e293b" text-anchor="middle">ingress-gateway-rlp-lowlimits</text>
  <text x="287" y="368" font-size="10" fill="#dc2626" text-anchor="middle">Enforced=False (overridden)</text>
  <line x1="287" y1="224" x2="287" y2="298" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#seta-neutra)"/>
  <text x="297" y="266" font-size="10" fill="#64748b">valem p/ toda rota sem policy própria</text>

  <!-- rota travels (vizinho) -->
  <rect x="470" y="30" width="232" height="74" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="586" y="52" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">HTTPRoute travels</text>
  <text x="586" y="69" font-size="11" fill="#1e293b" text-anchor="middle">ns travel-agency</text>
  <text x="586" y="85" font-size="10" fill="#64748b" text-anchor="middle">travel-agency-authpolicy + travels-plans</text>

  <!-- gateway -> travels: aceito -->
  <line x1="367" y1="155" x2="466" y2="82" stroke="#16a34a" stroke-width="2" marker-end="url(#seta-ok)"/>
  <text x="420" y="106" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">200</text>
  <text x="420" y="120" font-size="10" fill="#16a34a" text-anchor="middle">chave aceita aqui</text>

  <!-- rota echo-api (componente central) -->
  <rect x="470" y="168" width="232" height="94" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="586" y="189" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">HTTPRoute echo-api (ns echo-api)</text>
  <text x="586" y="207" font-size="10" fill="#1e293b" text-anchor="middle">echo-api-authpolicy — exige app=partner</text>
  <text x="586" y="221" font-size="10" fill="#1e293b" text-anchor="middle">+ devportal.kuadrant.io/apiproduct=echo-api</text>
  <text x="586" y="239" font-size="10" fill="#1e293b" text-anchor="middle">echo-plans — tier único "default"</text>
  <text x="586" y="253" font-size="10" fill="#64748b" text-anchor="middle">20 req/10s, 2000/dia</text>

  <!-- gateway -> echo: negado -->
  <line x1="367" y1="200" x2="466" y2="207" stroke="#dc2626" stroke-width="2" marker-end="url(#seta-neg)"/>
  <text x="416" y="188" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">401</text>
  <text x="418" y="226" font-size="10" fill="#dc2626" text-anchor="middle" transform="rotate(4 418 226)">a mesma chave não abre</text>
  <text x="418" y="239" font-size="10" fill="#dc2626" text-anchor="middle" transform="rotate(4 418 239)">este produto</text>

  <!-- backend do echo -->
  <rect x="470" y="308" width="232" height="70" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="586" y="328" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Service echo-api :8080</text>
  <text x="586" y="344" font-size="10" fill="#1e293b" text-anchor="middle">Deployment echo-api — 1 réplica</text>
  <text x="586" y="359" font-size="10" fill="#64748b" text-anchor="middle">ubi9/httpd-24 (403 do welcome.conf)</text>

  <!-- rota -> backend -->
  <line x1="586" y1="262" x2="586" y2="304" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta-neutra)"/>
  <text x="578" y="288" font-size="10" fill="#64748b" text-anchor="end">só com chave do produto</text>
</svg>
