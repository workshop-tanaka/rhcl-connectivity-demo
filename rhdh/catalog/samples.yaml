apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: websockets-authpolicy
  title: AuthPolicy — websockets
  description: >-
    Confere a credencial na requisicao que carrega 'Upgrade: websocket'. Sem chave o upgrade nao acontece e a conexao nunca chega a existir. Depois dele, os frames nao sao requisicoes HTTP e esta policy nao os ve. A chave vai na query string porque a API do navegador nao permite cabecalho.
  annotations:
