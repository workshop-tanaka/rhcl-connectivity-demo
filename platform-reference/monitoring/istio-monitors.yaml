# kuadrant-system entrou em 2026-09-21, junto com Kuadrant.spec.mtls.enable:
# o operador poe Authorino e Limitador no mesh (sidecar nativo) para cifrar o
# canal Gateway -> Authorino/Limitador, que ate ali era texto claro -- e a
# chave de API vai na query string. Sem este monitor os dois somem do Kiali,
# e o preflight acusa.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxies-monitor
  namespace: kuadrant-system
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  podMetricsEndpoints:
    - interval: 30s
      path: /stats/prometheus
