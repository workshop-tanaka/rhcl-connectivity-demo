# ===========================================================================
# Kafka do CDC -- Streams for Apache Kafka em KRaft, 3 nos combinados.
#
# O canal stable do operador ja e a linha 3.2 (Kafka sem ZooKeeper; as duas
# annotations no CR Kafka sao obrigatorias nesse regime). A versao do Kafka
# fica por conta do operador -- fixa-la aqui quebraria no proximo upgrade de
# canal, e a demo nao depende de minor.
#
# O KafkaConnect CONSTROI a imagem com o conector do Debezium via BuildConfig
# (output type imagestream -- e OpenShift, nao ha registry externo no
# caminho). A senha do Postgres NAO esta no CR: o config provider de Secrets
# do Strimzi le o Secret replicado neste namespace, e o RBAC minimo para isso
# esta logo abaixo.
# ===========================================================================
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: travel-packages
  labels:
    strimzi.io/cluster: travel-streams
spec:
  replicas: 3
  roles: [controller, broker]
  # sem sidecar: advertised listeners do Kafka nao convivem com o Envoy, e o
  # namespace consolidado injeta por default (opt-out por pod, 2026-08-31)
  template:
    pod:
      metadata:
        labels:
          sidecar.istio.io/inject: "false"
          app.kubernetes.io/part-of: travel-packages
  storage:
    type: persistent-claim
    size: 10Gi
    deleteClaim: true
  resources:
    requests: {cpu: 300m, memory: 1Gi}
    limits: {memory: 2Gi}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: travel-streams
  namespace: travel-packages
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    template:
      pod:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"
    topicOperator: {}
    userOperator: {}
---
# Replica do Secret de travel-db (01-postgres.yaml) -- o config provider so
# le secret do proprio namespace sem RBAC cruzado, e duplicar uma senha
# lab-grade e mais simples que um RoleBinding entre namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: travel-packages-db-debezium
  namespace: travel-packages
type: kubernetes.io/basic-auth
stringData:
  username: debezium
  password: debezium-cdc-2026
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: le-secret-debezium
  namespace: travel-packages
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [travel-packages-db-debezium]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdc-connect-le-secret
  namespace: travel-packages
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: le-secret-debezium
subjects:
  - kind: ServiceAccount
    name: cdc-connect
    namespace: travel-packages
---
# A ImageStream do build do connect: o Strimzi constroi a imagem do Debezium
# PARA DENTRO dela (build.output.type: imagestream) mas NAO a cria -- sem ela
# o KafkaConnect fica NotReady com "there is no image stream with name
# cdc-connect" e nenhum pod de connect nasce (medido em 2026-08-30 no
# cluster-flqzh; no cxr7d ela existia de uma criacao manual perdida no tempo).
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: cdc-connect
  namespace: travel-packages
spec:
  lookupPolicy:
    local: true
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: cdc
  namespace: travel-packages
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  replicas: 1
  bootstrapServers: travel-streams-kafka-bootstrap:9092
  # Na API v1 do Strimzi, group.id e os topicos de storage viraram campos de
  # primeira classe -- deixa-los em config e erro de validacao, nao aviso.
  # sem sidecar nos pods do connect E do build dele -- mesmo opt-out dos
  # brokers; um build com Envoy pendurado pode nunca completar
  template:
    pod:
      metadata:
        labels:
          sidecar.istio.io/inject: "false"
          app.kubernetes.io/part-of: travel-packages
    buildPod:
      metadata:
        labels:
          sidecar.istio.io/inject: "false"
          app.kubernetes.io/part-of: travel-packages
  groupId: cdc
  offsetStorageTopic: cdc-offsets
  configStorageTopic: cdc-configs
  statusStorageTopic: cdc-status
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    topic.creation.enable: "true"
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
  build:
    output:
      type: imagestream
      image: cdc-connect:latest
    plugins:
      - name: debezium-postgres
        artifacts:
          # tgz do plugin, e NAO type: maven: o maven resolve transitivas e
          # poe jars do proprio Kafka no diretorio do plugin -- o classloader
          # do connect sombreia o runtime e ate o JsonConverter DE FABRICA
          # morre com 'Could not instantiate class' no PUT do connector
          # (medido em 2026-08-30 no cluster-flqzh). O tar.gz -plugin do
          # Debezium e o caminho que a doc dele mesma manda.
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.1.3.Final/debezium-connector-postgres-3.1.3.Final-plugin.tar.gz
  resources:
    requests: {cpu: 300m, memory: 1Gi}
    limits: {memory: 2Gi}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: travel-cdc
  namespace: travel-packages
  labels:
    strimzi.io/cluster: cdc
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: travel-packages-db-rw.travel-packages.svc
    database.port: 5432
    database.user: debezium
    database.password: ${secrets:travel-packages/travel-packages-db-debezium:password}
    database.dbname: travelpackages
    topic.prefix: travel
    plugin.name: pgoutput
    publication.name: travel_pub
    publication.autocreate.mode: disabled
    slot.name: travel_cdc
    snapshot.mode: initial
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 3
