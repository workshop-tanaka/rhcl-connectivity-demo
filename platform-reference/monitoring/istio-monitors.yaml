# travel-packages entrou em 2026-08-31, quando a regra ficou explicita: TODO
# namespace com sidecar entra aqui (ou carrega o proprio monitor, caso das
# amostras e dos servicos do golden path). Ele tinha 7 pods raspaveis e nenhuma
# metrica -- invisivel no Kiali com trafego correndo. O preflight passou a
# acusar namespace com sidecar e sem PodMonitor, entao o proximo esquecimento
# nao fica mudo.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxies-monitor
  namespace: travel-packages
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  podMetricsEndpoints:
    - interval: 30s
      path: /stats/prometheus
      relabelings:
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_container_name"]
          regex: istio-proxy
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_annotationpresent_prometheus_io_scrape"]
        - action: replace
          regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
          replacement: '[$2]:$1'
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: __address__
        - action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: $2:$1
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: __address__
        - action: labeldrop
          regex: __meta_kubernetes_pod_label_(.+)
