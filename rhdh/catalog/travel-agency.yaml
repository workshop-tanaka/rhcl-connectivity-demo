# ===========================================================================
# Catalogo RHDH da demo RHCL — travel-agency.
#
# Modela a demo em duas Systems porque as policies do Kuadrant tem escopos
# diferentes e isso importa na hora de explicar:
#   - rhcl-ingress   : Gateway + policies com targetRef no Gateway (valem para
#                      TODA rota anexada -- deny-all, rate limit baixo, DNS, TLS)
#   - travel-agency  : app + policies com targetRef na HTTPRoute (valem so para
#                      esta API -- API key e rate limit por usuario)
#
# ${DEMO_API_HOST} e ${DEMO_ECHO_HOST} sao substituidos pelo setup-catalog.sh
# com os hostnames reais lidos das HTTPRoutes do cluster.
#
# ROTULOS: 'rhcl.demo/*' em metadata.labels e as tags seguem o vocabulario de
# docs/CATALOGO.md -- leia antes de inventar um valor novo. As regras de forma
# de label e de tag NAO sao as mesmas (a tag e mais estrita), e o
# scripts/valida-catalogo.sh recusa o que sair da tabela.
#
#   camada         onde a entidade fica: borda, aplicacao, consumidor, plataforma
#   escopo-policy  so em policy do Kuadrant: gateway (vale para toda rota
#                  anexada) ou rota (vale so para esta API) -- e a distincao
#                  que o Ato 3 explica
#   origem         de onde a entidade nasce: repo, cluster, template
#   produto        travels ou echo
#
# Toda policy do Kuadrant e 'camada: borda', inclusive as que miram a HTTPRoute
# de uma aplicacao: quem as aplica e o gateway, nao o servico.
# ===========================================================================
#
# ESTA FATIA: o System travel-agency -- a aplicacao, as policies de escopo
# de ROTA (valem so para esta API) e os tres parceiros do Ato 2.
---
# ---------------------------------------------------------------------------
# System: aplicacao
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: travel-agency
  description: Aplicacao de exemplo exposta pelo Gateway prod-web.
  annotations:
    # O que enche a secao Docs do portal. Sem esta anotacao o TechDocs esta
    # ligado e nao tem o que renderizar -- a secao aparece vazia.
    # O mkdocs.yml na raiz do repo define o nav; o RHDH clona e gera no pod.
    backstage.io/techdocs-ref: url:${DEMO_REPO_URL}
    # Volta agora que o repo tem CI: o workflow valida os manifests DESTE
    # componente, entao a aba Actions passa a ter conteudo proprio.
  # Nao ha plugin de Grafana instalavel no RHDH 1.10 -- nem no ghcr (so builds
  # de PR) nem no npm (o pacote nao traz build dinamico). O link direto ao
  # dashboard resolve o mesmo problema numa demo: sair do portal para o numero.
  links:
    - url: https://${GRAFANA_HOST}/d/rhcl-negocio-planos
      title: Planos comerciais (Grafana)
      icon: dashboard
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: travels
  tags:
    - rhcl
spec:
  owner: group:default/platform-team
  domain: travel
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: travel-agency-authpolicy
  title: AuthPolicy — API key na rota
  description: >-
    AuthPolicy na HTTPRoute travel-agency. Aceita API key da query string
    (?APIKEY=) a partir de Secrets com label app=partner em kuadrant-system, e
    sobrepoe o deny-all do Gateway para esta rota. Tambem exporta a identidade
    como dynamic metadata (namespace 'demo'), que e o que permite a
    TelemetryPolicy rotular metrica por parceiro.
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/travel-agency/kuadrant.io~v1~AuthPolicy/travel-agency-authpolicy
      title: Abrir no console
      icon: web
  annotations:
    # Sem gitlab.com/instance o plugin assume gitlab.com e a aba quebra com
    # TypeError no navegador -- sem rastro no log do backend.
    gitlab.com/instance: ${GITLAB_HOST}
    gitlab.com/project-slug: rhcl/policies/rhcl-policies
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/escopo-policy: rota
    rhcl.demo/origem: repo
    rhcl.demo/produto: travels
  tags:
    - rhcl
    - kuadrant
    - ato-1
spec:
  type: kuadrant-authpolicy
  owner: group:default/platform-team
  system: travel-agency
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: travels-plans
  title: PlanPolicy — os tres tiers
  description: >-
    PlanPolicy na HTTPRoute travel-agency: classifica cada API key em um tier
    pelo label kuadrant.io/plan-id e aplica limites por tier --
    gold 30/10s (5000/dia), silver 10/10s (500/dia), free 3/10s (50/dia) e um
    catch-all 'unclassified' de 1/60s. No 1.4 ele NAO convive com a RateLimitPolicy
    plana: seria sobreposto por ela, e por isso o overlay a remove.
  links:
    - url: https://${CONSOLE_HOST}/k8s/ns/travel-agency/extensions.kuadrant.io~v1alpha1~PlanPolicy/travels-plans
      title: Abrir no console
      icon: web
  annotations:
    # Sem gitlab.com/instance o plugin assume gitlab.com e a aba quebra com
    # TypeError no navegador -- sem rastro no log do backend.
    gitlab.com/instance: ${GITLAB_HOST}
    gitlab.com/project-slug: rhcl/policies/rhcl-policies
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/escopo-policy: rota
    rhcl.demo/origem: repo
    rhcl.demo/produto: travels
  tags:
    - rhcl
    - kuadrant
    - ato-2
spec:
  type: kuadrant-planpolicy
  owner: group:default/platform-team
  system: travel-agency
  dependsOn:
    - resource:default/travel-agency-authpolicy
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ratelimit-policy-travels
  title: RateLimitPolicy plana — removida no 1.4
  description: >-
    RateLimitPolicy plana (2000 req / 10s por auth.identity.userid). NAO ESTA
    APLICADA neste cluster: o overlay env/rhcl-1.4_ocp-4.21 a remove com
    $patch: delete. A base/ fica intacta, porque continua correta para o 1.2.

    O motivo e uma inversao de precedencia entre releases. No 1.2.1 o PlanPolicy
    sobrepunha esta policy, e era esse status que provava a hierarquia. No 1.4.2
    inverteu: com ela presente, a RLP gerada pelo PlanPolicy fica Enforced=False
    "overridden by travel-agency/ratelimit-policy-travels", o PlanPolicy fica
    Accepted=False, e os tres tiers param de existir -- com tudo respondendo 200,
    sem sintoma nenhum no caminho de dados.

    A cena de precedencia passou a ser contada com ingress-gateway-rlp-lowlimits,
    que mira o Gateway e cede para as policies de rota: hierarquia
    gateway-vs-rota, que continua valendo no 1.4.
  links:
    - url: ${DEMO_REPO_URL_BLOB}/base/policies-traffic/ratelimit-policy-travels.yaml
      title: Manifesto (nao aplicado neste cluster)
      icon: web
  annotations:
    # Sem gitlab.com/instance o plugin assume gitlab.com e a aba quebra com
    # TypeError no navegador -- sem rastro no log do backend.
    gitlab.com/instance: ${GITLAB_HOST}
    gitlab.com/project-slug: rhcl/policies/rhcl-policies
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/escopo-policy: rota
    rhcl.demo/origem: repo
    rhcl.demo/produto: travels
  tags:
    - rhcl
    - kuadrant
    - ato-2
    - ato-3
spec:
  type: kuadrant-ratelimitpolicy
  owner: group:default/platform-team
  system: travel-agency
  dependsOn:
    - resource:default/travel-agency-authpolicy
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: travels
  description: Frontend da agencia; agrega os demais servicos. Unico exposto pela HTTPRoute.
  annotations:
    # O deployment tem sufixo de versao, que NAO e o nome da entidade --
    # errar aqui da uma aba Security que carrega e nao acha nada.
    acs/deployment-name: travels-v1
    # Liga a aba CI. O que o plugin ENXERGA, porem, sai do
    # backstage.io/kubernetes-label-selector abaixo (app=travels) -- esta
    # anotacao so decide se a aba aparece. Rotular as PipelineRun apenas com
    # backstage.io/kubernetes-id nao adianta: a aba abre, nao da erro, e lista
    # vazio. So o travels tem pipeline: os
    # demais servicos rodam imagem de exemplo do Kiali e nao teriam o que
    # executar -- anotar todos daria quatro abas vazias.
    janus-idp.io/tekton: travels
    # Sem gitlab.com/instance o plugin assume gitlab.com e a aba quebra com
    # TypeError no navegador -- sem rastro no log do backend.
    gitlab.com/instance: ${GITLAB_HOST}
    gitlab.com/project-slug: rhcl/travel/travels
    backstage.io/kubernetes-label-selector: app=travels
    backstage.io/kubernetes-namespace: travel-agency
    # O Kiali usa a anotacao DELE, nao a do Kubernetes.
    kiali.io/namespace: travel-agency
    # A aba 'Imagem' do plugin Quay so aparece com esta anotacao. Ela
    # aponta para um repositorio PUBLICO de verdade: os servicos da demo
    # rodam as imagens do proprio Kiali, entao a aba mostra tags e data
    # de push reais, e nao um exemplo vazio.
    quay.io/repository-slug: kiali/demo_travels_travels
    # ATIVA. O @backstage-community/plugin-jaeger nao esta no registry de
    # overlays da Red Hat, entao passou pelo 'yarn export-dynamic' e vive no
    # plugin-registry interno -- ver o bloco WITH_JAEGER do setup-plugins.sh.
    #
    # Fica pronta desde ja porque o valor NAO e adivinhavel: e o nome que o
    # Tempo conhece, no formato <servico>.<namespace>, e foi lido da API dele
    # em 2026-08-27 (/api/traces/v1/dev/api/services). Errar aqui produz uma
    # aba que abre vazia, que no palco parece 'nao ha trafego'.
    #
    # A versao que casa e a 0.15.0, cujo workspace mira Backstage 1.49.2 -- a
    # linha do 1.49.4 que o RHDH 1.10.3 embute. A 0.9.0 parece casar melhor
    # pelo range que declara no npm, e nao casa: o range publicado engana, e
    # quem decide e o backstage.json do WORKSPACE.
    jaegertracing.io/service: travels.travel-agency
    # 168h (sete dias), e nao o default de 1h. Num cluster sem trafego recente a
    # janela de 1h deixa a aba em 'No records to display' -- que na frente de um
    # cliente le-se como 'a instrumentacao nao funciona', e nao como 'ninguem
    # chamou a API hoje'.
    #
    # EM HORAS, obrigatoriamente. O plugin valida com /^(\d+)([mh])$/ e nao
    # conhece 'd': '7d' derruba a aba inteira com "Invalid time format", e o
    # erro estoura ANTES de qualquer requisicao -- entao nada do Tempo, do
    # proxy ou do token aparece no diagnostico. Custou uma investigacao em
    # 2026-08-27.
    #
    # Sete dias e generoso de proposito: a retencao real do Tempo aqui nao esta
    # declarada, e pedir alem do que existe nao custa nada -- o backend devolve
    # o que tem. Cravar um numero 'realista' seria codificar um palpite.
    #
    # A janela larga e a rede de seguranca; o trafego ao vivo do roteiro e o que
    # mostra o dado se mexendo. As duas juntas: nunca vazia, e viva quando
    # importa.
    jaegertracing.io/lookback: 168h
    # Consulta de UMA palavra, de proposito: o plugin trata selector de uma
    # palavra como busca por TAG e qualquer outra coisa como busca por titulo.
    # Por isso os tres dashboards autorais levam "tags": ["rhcl"] -- assim um
    # dashboard novo aparece nos componentes so por ganhar a tag, sem mexer
    # aqui. Os de persona vem do upstream do Kuadrant e ficam de fora: tem job
    # anti-drift no CI, e etiquetar quebraria a comparacao.
    grafana/dashboard-selector: rhcl
    # View Source e View TechDocs no card About: sem estas duas anotacoes os
    # botoes aparecem desabilitados. source-location termina em / porque
    # aponta para um diretorio, nao para um arquivo.
    backstage.io/source-location: url:https://${GITLAB_HOST}/rhcl/travel/travels/-/tree/main/
    backstage.io/techdocs-ref: url:${DEMO_REPO_URL}/docs/componentes/travels
    # Volta agora que o repo tem CI: o workflow valida os manifests DESTE
    # componente, entao a aba Actions passa a ter conteudo proprio.
    # A aba Kiali usa o mesmo namespace; o provider e o nome do
    # bloco kiali.providers no app-config.
    kiali.io/provider: default
  links:
    # Dev Spaces: abre o repositorio DESTA demo num IDE em container, com um
    # clique a partir do componente. Nao confundir com o decorator "edit code"
    # da aba Topology: o destino e o mesmo repositorio, mas o lapis leva ao
    # GitHub, nunca ao IDE -- o fetch do plugin Kubernetes e restrito ao
    # kubernetes-namespace da entidade e o CheCluster vive em
    # openshift-devspaces. Medido; ver platform-reference/devspaces/README.md.
    # Este link e o caminho que esta ligado, e nao depende do Topology carregar.
    # Se o Dev Spaces nao estiver instalado, o setup-catalog.sh apaga estas
    # linhas em vez de publicar um link morto.
    - url: https://${DEVSPACES_HOST}/#${DEMO_REPO_URL}
      title: Abrir no Dev Spaces
      icon: code
    - url: https://${CONSOLE_HOST}/observe/traces
      title: Traces — travels.travel-agency
      icon: dashboard
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: travels
  tags:
    - rhcl
    - ato-1
    - ato-2
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: travel-agency
  # A entidade travels-api e ingerida pelo plugin Kuadrant a partir do
  # APIProduct do developer portal -- nao esta neste arquivo. O provider nao le
  # 'system' de anotacao nenhuma, entao a unica forma de tirar aquela entidade
  # do isolamento no grafo e declarar a relacao DAQUI: providesApis gera o
  # apiProvidedBy do outro lado, e a API passa a ser alcancavel pelo System.
  providesApis:
    - travels-api
  dependsOn:
    - component:default/flights
    - component:default/hotels
    - component:default/cars
    - component:default/insurances
    - resource:default/travel-agency-authpolicy
    - resource:default/ratelimit-policy-travels
