# ===========================================================================
# PodMonitor dos sidecars -- o servico nasce VISIVEL no Kiali.
#
# O namespace nasce no Service Mesh (00-namespace.yaml), mas o Kiali desenha
# com metrica: sem este objeto o servico funciona e o grafo fica vazio --
# exatamente a falha silenciosa que o golden path existe para impedir. Mesmo
# spec do istio-proxies-monitor dos namespaces da demo.
# ===========================================================================
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxies-monitor
  namespace: ${{ values.namespace }}
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  podMetricsEndpoints:
    - interval: 30s
      path: /stats/prometheus
      relabelings:
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_container_name"]
          regex: istio-proxy
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_annotationpresent_prometheus_io_scrape"]
        - action: replace
          regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
          replacement: '[$2]:$1'
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: __address__
        - action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: $2:$1
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: __address__
        - action: labeldrop
          regex: __meta_kubernetes_pod_label_(.+)
        - action: replace
          sourceLabels: ["__meta_kubernetes_namespace"]
          targetLabel: namespace
        - action: replace
          sourceLabels: ["__meta_kubernetes_pod_name"]
          targetLabel: pod_name
