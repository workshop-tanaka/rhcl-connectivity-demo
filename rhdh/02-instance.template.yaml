# ===========================================================================
# Red Hat Developer Hub — instancia (CR Backstage) + configuracao.
#
# Template: ${RHDH_HOST} e ${RHDH_NS} sao substituidos pelo install.sh -- o
# hostname real da rota (derivado do dominio de apps) e o namespace de destino.
# O namespace era fixo em 'rhdh' ate 2026-08-17, o que fazia RHDH_NS ser aceito
# pelo script e ignorado aqui: uma instancia "isolada" caia por cima da que ja
# existia. Nada mais e interpolado --
# ${BACKEND_SECRET} abaixo e resolvido pelo PROPRIO Backstage em runtime, a
# partir da variavel de ambiente injetada pelo Secret; nao pode ser expandido
# aqui, senao o segredo iria em claro para dentro do ConfigMap.
# ===========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ${RHDH_NS}
---
# ---------------------------------------------------------------------------
# Configuracao da aplicacao.
#
# baseUrl/cors precisam bater EXATAMENTE com a URL publica da rota: o frontend
# do Backstage monta as chamadas de API a partir de app.baseUrl, e o backend
# recusa origens que nao constem em backend.cors.origin. Por isso a rota tem
# host fixo (spec.application.route.host no CR) em vez do host gerado pelo
# OpenShift -- o host precisa ser conhecido ANTES de o pod subir.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: ${RHDH_NS}
data:
  app-config-rhdh.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://${RHDH_HOST}

    backend:
      baseUrl: https://${RHDH_HOST}
      cors:
        origin: https://${RHDH_HOST}
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: "${BACKEND_SECRET}"
          # ----- automacao -----
          # O guest saiu, e com ele o caminho que scripts usavam para falar com
          # a API ('api/auth/guest/refresh'). Automacao nao deve entrar como
          # usuario: entra como SERVICO, que e para isto que serve o
          # externalAccess.
          #
          # 'static' e nao 'legacy': o legacy espera um JWT assinado com o
          # segredo, nao o segredo cru -- mandar o BACKEND_SECRET como Bearer
          # devolve 'Illegal token' (medido em 2026-08-25). O static aceita o
          # valor como esta.
          - type: static
            options:
              token: "${AUTOMATION_TOKEN}"
              subject: automation

    # ----- login -----
    # DOIS PROVEDORES, com papeis diferentes -- e isto nao e redundancia.
    #
    # O Backstage separa "quem e a pessoa" (signIn) de "de onde vem o token
    # para agir num sistema externo". Nada obriga que sejam o mesmo provedor,
    # e aqui eles nao sao:
    #
    #   oidc    -> Keycloak. E o sign-in. Uma credencial para o portal, o
    #              OpenShift, o Dev Spaces, o GitLab e o Argo CD.
    #   gitlab  -> SEM bloco signIn. Existe so para o requestUserCredentials
    #              dos templates: e dele que sai o token com que o scaffolder
    #              age COMO A PESSOA no GitLab.
    #
    # POR QUE O GITLAB NAO SAI. Tirar o provedor unificaria o login e faria o
    # scaffolder assinar como conta de servico -- as MRs perderiam autoria
    # pessoal, e o Ato 6 defende exatamente o contrario. Autoatendimento sem
    # atribuicao e uma conta de admin compartilhada com interface melhor.
    #
    # O consentimento do GitLab, na primeira vez que alguem roda um template,
    # e um redirecionamento silencioso: o GitLab tambem delega ao Keycloak,
    # entao a pessoa ja esta autenticada e volta na hora.
    #
    # SEM guest. Ele nao esta comentado nem desabilitado: nao existe mais.
    # 'environment: production' tambem vale, entao nao ha porta lateral.
    #
    # O resolver casa o preferred_username do Keycloak com User:default/<nome>.
    # As quatro personas existem no catalogo e no realm sso com o MESMO nome;
    # sem a entidade, o login acontece e a sessao morre em "user not found".
    auth:
      # SESSAO e obrigatoria para o provedor OIDC, e nao era para o do GitLab.
      # Sem ela o /api/auth/oidc/start devolve 500 com "authentication requires
      # session support": na tela o popup abre e fecha sem sair do portal, sem
      # erro visivel -- so um login que nao acontece.
      #
      # Vai sob o auth: DE TOPO, e nao sob backend.auth -- sao dois blocos com o
      # mesmo nome no mesmo arquivo, e o de baixo (backend.auth) e o do
      # externalAccess. Errar de bloco nao da erro de sintaxe: da o mesmo 500.
      #
      # Reusa o BACKEND_SECRET: ja existe, ja esta em extraEnvs, mesma exigencia
      # de sigilo.
      session:
        secret: ${BACKEND_SECRET}
      environment: production
      providers:
        oidc:
          production:
            metadataUrl: https://${KEYCLOAK_HOST}/realms/sso/.well-known/openid-configuration
            clientId: rhdh
            clientSecret: ${KEYCLOAK_RHDH_SECRET}
            prompt: auto
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
        gitlab:
          production:
            clientId: ${GITLAB_OAUTH_CLIENT_ID}
            clientSecret: ${GITLAB_OAUTH_CLIENT_SECRET}
            audience: https://${GITLAB_HOST}
    signInPage: oidc

    # 'locations' NAO e definido aqui de proposito: quem define e o
    # app-config-rhdh-catalog (setup-catalog.sh). Arrays nao se somam entre
    # arquivos de config do Backstage -- o ultimo vence -- entao declarar uma
    # lista vazia aqui competiria com a camada de catalogo.
    catalog:
      rules:
        - allow: [Component, System, Domain, Group, User, Resource, Location, Template, API, APIProduct]
---
# ---------------------------------------------------------------------------
# Instancia RHDH.
#
# database.enableLocalDb: o operator sobe um PostgreSQL proprio com PVC
# (storageClass default do cluster). Para producao, apontar para um Postgres
# externo via spec.database.authSecretName e enableLocalDb: false.
# ---------------------------------------------------------------------------
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: ${RHDH_CR}
  namespace: ${RHDH_NS}
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    extraEnvs:
      secrets:
        - name: rhdh-backend-secret
    route:
      enabled: true
      host: ${RHDH_HOST}
  database:
    enableLocalDb: true
  # ----- flavour Lightspeed: fora, explicitamente -----
  # O build do rhdh-operator 1.10.3 no catalogo do OCP 4.22 traz "flavours" e
  # liga o de Lightspeed POR DEFAULT (rhdh-flavour-lightspeed-config,
  # enabledByDefault: true): todo CR ganha o sidecar lightspeed-core e o init
  # init-rag-data -- que morre com exit 137 (sem memoria) e prende o pod em
  # Init:Error para sempre. Medido em 2026-08-30 no cluster-k96tq; o catalogo
  # do 4.21 nao fazia isso com o MESMO 1.10.3. A demo nao usa o flavour, e o
  # patch remove os dois containers do deployment rendido. O '$patch' passa
  # ileso pelo envsubst porque o install.sh usa whitelist de variaveis.
  deployment:
    patch:
      spec:
        template:
          spec:
            containers:
              - name: lightspeed-core
                $patch: delete
            initContainers:
              - name: init-rag-data
                $patch: delete
