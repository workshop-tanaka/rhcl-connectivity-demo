# ---------------------------------------------------------------------------
# COMPONENTS DO BOOKINFO -- quatro, e so um deles a borda alcanca.
#
# Essa assimetria e o proprio ponto da amostra, e o catalogo a torna legivel:
# so o productpage tem link de endpoint e providesApis. Os outros tres existem
# leste-oeste, e quem diz quem pode chama-los e a AuthorizationPolicy do
# Service Mesh -- nao o roteamento.
#
# quay.io/repository-slug aponta para maistra/, e nao para istio/: o plugin de
# Quay do portal chama quay.io (rhdh/setup-plugins.sh), e as imagens do
# bookinfo publicas la sao as da Red Hat. As de istio/ dao 401 -- uma aba
# 'Imagem' que carrega e nao mostra nada, que no palco se le como defeito do
# portal. Conferido pela API do Quay em 2026-08-28.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: bookinfo-productpage
  title: bookinfo — productpage
  description: >-
    A fachada. Unico servico do bookinfo que a borda alcanca, e o backend das
    DUAS HTTPRoute: a da UI, publica, e a da API, sob chave e plano.
  annotations:
    backstage.io/techdocs-ref: url:${DEMO_REPO_URL}/docs/componentes/bookinfo-productpage
    rhcl.demo/cluster-object: deployment/bookinfo/productpage-v1
    # O deployment tem sufixo de versao, que NAO e o nome da entidade -- errar
    # aqui da uma aba Security que carrega e nao acha nada.
    acs/deployment-name: productpage-v1
    sonarqube.org/project-key: rhcl-sample-bookinfo
    # Sem gitlab.com/instance o plugin assume gitlab.com e a aba quebra com
    # TypeError no navegador -- sem rastro no log do backend.
    gitlab.com/instance: ${GITLAB_HOST}
    gitlab.com/project-slug: rhcl/samples/bookinfo
    argocd/app-name: sample-bookinfo
    backstage.io/kubernetes-label-selector: app=productpage
    backstage.io/kubernetes-namespace: bookinfo
    # O Kiali usa a anotacao DELE, nao a do Kubernetes.
    kiali.io/namespace: bookinfo
    kiali.io/provider: default
    quay.io/repository-slug: maistra/examples-bookinfo-productpage-v1
    grafana/dashboard-selector: rhcl
    backstage.io/source-location: url:https://${GITLAB_HOST}/rhcl/samples/bookinfo/-/tree/main/
  links:
    - url: https://${CONSOLE_HOST}/observe/traces
      title: Traces — productpage.bookinfo
      icon: dashboard
  labels:
    rhcl.demo/camada: aplicacao
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - istio
spec:
  type: service
  lifecycle: experimental
  owner: user:default/tanaka
  system: sample-bookinfo
  providesApis:
    - bookinfo-api
  dependsOn:
    - component:default/bookinfo-details
    - component:default/bookinfo-reviews
    - resource:default/bookinfo-gateway

