apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ===========================================================================
# websockets -- o que a governança alcança numa conexão longa, e o que não.
#
# Prefixo numérico pelo mesmo motivo do bookinfo: o ApplicationSet
# 'rhcl-samples' sincroniza 'manifests/[0-9]*.yaml'. Renomear um arquivo para
# algo que não comece com dígito o tira do Argo EM SILÊNCIO.
#
# NÃO APLICAR COM 'oc apply -k' DIRETO: 20- traz __DOMAIN__.
# ===========================================================================

resources:
  - 00-namespace.yaml
  - 01-tornado.yaml
  - 10-mesh-peerauthentication.yaml
  - 11-mesh-destinationrule.yaml
  - 12-mesh-telemetry.yaml
  - 20-httproute.yaml
  - 21-authpolicy.yaml
  - 22-ratelimitpolicy.yaml
  - 23-identity-apikeys.yaml

# A cópia assinada no Quay -- comentada de propósito; ver samples/README.md.
