# ===========================================================================
# DestinationRule — nomeia os subsets. E metade do canary; a outra e o
# VirtualService ao lado.
#
# O Service 'discounts' seleciona por 'app: discounts' e nada mais, entao hoje
# ele faz round-robin cego entre discounts-v1 e discounts-v2 -- os dois pods
# ja estao rodando, e ja recebem ~50% do trafego cada um, sem ninguem ter
# pedido. Este arquivo nao muda o trafego: so declara que existem dois grupos
# e como distingui-los (label 'version', que os Deployments ja carregam).
#
# Separar DestinationRule de VirtualService parece burocracia e nao e: o
# subset e uma propriedade do DESTINO (existe independente de quem chama),
# enquanto o peso e uma decisao de ROTEAMENTO. Um mesmo subset e reutilizado
# por varias rotas.
#
# NAO declarar trafficPolicy.tls aqui e proposital: uma DestinationRule com
# tls: DISABLE desligaria o mTLS do PeerAuthentication STRICT e a chamada
# passaria a falhar. Ausente, vale o auto-mTLS.
# ===========================================================================
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  annotations:
    rhcl.demo/autor: Sandro Tanaka
  name: discounts
  namespace: travel-agency
spec:
  host: discounts.travel-agency.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
