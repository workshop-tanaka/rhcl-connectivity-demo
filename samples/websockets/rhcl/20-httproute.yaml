# ===========================================================================
# A rota do WebSocket -- e o que NÃO precisa estar escrita nela é o ponto.
#
# NÃO HÁ CONFIGURAÇÃO DE UPGRADE AQUI. Nem na HTTPRoute, nem no Gateway, nem no
# VirtualService. O README do upstream ainda avisa que "o suporte a upgrade de
# websockets em regras v1alpha3 só foi adicionado depois do Istio v0.8" -- isso
# tem anos, e desde então o upgrade é o comportamento padrão do proxy para
# porta com nome 'http'.
#
# Por que isso vale ser dito no palco: a pergunta que aparece é sempre "e para
# WebSocket, precisa de outro gateway?". A resposta é o arquivo inteiro: mesma
# HTTPRoute, mesmo Gateway, mesmo listener HTTPS/443 dos demais. O que muda é
# o que a policy consegue observar depois do upgrade -- e isso é uma
# propriedade a declarar, não uma configuração a ligar (ver o README).
#
# HOSTNAME 'websockets-rhcl', e não 'websockets': este último é do Route do
# OpenShift que publica o gateway da própria amostra (../21-route-openshift.yaml).
# Os dois endereços coexistem de propósito -- um sem chave, outro com --, e a
# comparação lado a lado é demonstração melhor do que trocar um pelo outro.
#
# __DOMAIN__ é substituído no render; ver rhcl/README.md.
# ===========================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # 'websockets-rhcl' e nao 'websockets': a amostra ja tem uma HTTPRoute com
  # esse nome, no MESMO namespace, apontando para o seu proprio gateway
  # (../20-gateway.yaml). Nome igual faria esta SUBSTITUIR aquela em vez de
  # coexistir -- e o caminho sem chave desapareceria no momento em que a camada
  # de RHCL entrasse, que e justamente a comparacao que se quer mostrar.
  name: websockets-rhcl
  namespace: websockets
  labels:
    app: tornado
spec:
  parentRefs:
    - name: prod-web
      namespace: ingress-gateway
  hostnames:
    - websockets-rhcl.__DOMAIN__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tornado
          port: 8888
