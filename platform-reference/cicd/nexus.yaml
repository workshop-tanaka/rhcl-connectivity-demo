# ===========================================================================
# Nexus Repository -- manifests proprios, mesma decisao do SonarQube.
#
# O PAPEL DE MIRROR NAO ESTA EM USO -- medido em 2026-08-28. O grupo
# maven-public de fato ja nasce proxy do Central (a afirmacao anterior deste
# cabecalho estava certa nisso), mas o acesso anonimo nasce DESLIGADO, e mesmo
# ligado, e mesmo autenticado como admin, o conteudo responde 403: a tag
# 'latest' do sonatype/nexus3 embute recursos Pro (com.sonatype.nexus.clm no
# log) e o conteudo parece gated por licenca. O cabecalho da
# platform-reference/pipelines/build-travel-packages.yaml traz a medicao
# inteira e como religar.
#
# Fica pelo SEGUNDO papel, que funciona: a tela de repositorio no portal via
# plugin do RHDH. Quem faz o build ser rapido hoje e o PVC cache-maven.
#
# NEXUS_SECURITY_RANDOMPASSWORD=false fixa admin/admin123 -- lab-grade, e o
# que o plugin do portal e a pipeline usam sem cerimonia de bootstrap.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: cicd
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: cicd
  labels:
    app: nexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      containers:
        - name: nexus
          image: docker.io/sonatype/nexus3:latest
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: >-
                -Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g
                -Djava.util.prefs.userRoot=/nexus-data/javaprefs
            - name: NEXUS_SECURITY_RANDOMPASSWORD
              value: "false"
          ports:
            - containerPort: 8081
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 3Gi}
          readinessProbe:
            httpGet: {path: /service/rest/v1/status, port: 8081}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /service/rest/v1/status, port: 8081}
            initialDelaySeconds: 300
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /nexus-data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: nexus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: cicd
spec:
  selector:
    app: nexus
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nexus
  namespace: cicd
spec:
  to:
    kind: Service
    name: nexus
  port:
    targetPort: 8081
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
