# ===========================================================================
# ESTE ARQUIVO SUBSTITUI a Telemetry de samples/bookinfo/14-, DE PROPOSITO --
# mesmo nome, mesmo namespace.
#
# ---------------------------------------------------------------------------
# POR QUE SUBSTITUIR EM VEZ DE ACRESCENTAR, e esta e a armadilha da API
#
# O Istio aplica UMA Telemetry por nivel. Duas Telemetry de nivel de namespace
# no mesmo namespace nao sao mescladas: uma delas simplesmente NAO VALE, e nao
# ha erro, evento, nem condicao no status dizendo qual. O sintoma e uma
# dimensao que "sumiu" ou um access log que nunca aparece, e a causa esta num
# arquivo que ninguem suspeita porque ele foi aceito sem reclamar.
#
# Entao o access log entra na Telemetry QUE JA EXISTE, e a maneira de fazer
# isso com kustomize e um recurso de mesmo nome aplicado depois.
#
# CONSEQUENCIA DE ORDEM, e ela e real: se alguem aplicar
# 'samples/bookinfo' DEPOIS desta amostra, o 14- de la volta a valer e o access
# log some. E por isso que 'scripts/provision.sh samples' aplica
# open-telemetry POR ULTIMO, sempre, e nao na ordem alfabetica.
# ---------------------------------------------------------------------------
#
# O provider 'otel-als-sample' NAO EXISTE SOZINHO: ele e um extensionProvider
# do meshConfig, e quem o declara no CR Istio e a etapa 'samples' do
# provision.sh. Sem ele, o Istio registra um erro no istiod ("provider not
# found") e o access log nao sai -- as metricas e o trace desta mesma Telemetry
# continuam valendo.
#
# Conferir que o provider chegou ao mesh:
#   oc get istio default -o jsonpath='{.spec.values.meshConfig.extensionProviders}' | tr ',' '\n' | grep als
# ===========================================================================
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: bookinfo-dimensoes
  namespace: bookinfo
spec:
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: REQUEST_COUNT
            mode: CLIENT_AND_SERVER
          tagOverrides:
            versao_destino:
              value: destination.workload.name
  tracing:
    - providers:
        - name: otel-tracing
      randomSamplingPercentage: 100.00
  # A UNICA DIFERENCA em relacao a samples/bookinfo/14-mesh-telemetry.yaml.
  accessLogging:
    - providers:
        - name: otel-als-sample
      # 'disabled: false' explicito: o default ja e habilitado, mas access log
      # e a configuracao que mais frequentemente se quer desligar depressa no
      # meio de uma investigacao, e ter o campo escrito e a diferenca entre
      # 'oc patch' e 'oc edit procurando onde por'.
      disabled: false
