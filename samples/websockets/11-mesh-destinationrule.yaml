# ===========================================================================
# Um subset só -- e ele existe por um motivo que não é canário.
#
# O DestinationRule aqui declara o pool de conexão, que é a parte que importa
# para WebSocket: 'maxRequestsPerConnection: 0' (sem limite) evita que o proxy
# recicle a conexão HTTP/1.1 depois de N requisições. Com o valor default de
# reciclagem, uma conexão de upgrade pode ser derrubada no meio -- e o sintoma
# é um WebSocket que "cai sozinho de vez em quando", que é caro de diagnosticar
# porque não aparece como erro em lugar nenhum.
#
# idleTimeout longo pelo mesmo motivo: a conexão fica ociosa entre mensagens, e
# o default de 1h é razoável, mas declarar torna o valor uma decisão em vez de
# um default herdado que ninguém sabe qual é.
# ===========================================================================
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: tornado
  namespace: websockets
spec:
  host: tornado
  trafficPolicy:
    connectionPool:
      http:
        maxRequestsPerConnection: 0
        idleTimeout: 3600s
      tcp:
        maxConnections: 100
  subsets:
    - name: v1
      labels:
        version: v1
