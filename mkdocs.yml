# TechDocs da demo RHCL.
#
# O RHDH gera a documentacao no proprio pod (mkdocs 1.6 vive em
# /opt/techdocs-venv), buscando este repositorio pela anotacao
# backstage.io/techdocs-ref da entidade. Sem a anotacao, a secao Docs do portal
# fica vazia -- o plugin esta ligado por padrao, mas nao tem o que renderizar.
site_name: RHCL Connectivity Demo
site_description: Roteiro e provisionamento da demo de Red Hat Connectivity Link

docs_dir: docs

nav:
  - Inicio: index.md
  - Passo a passo: DEMO-PASSO-A-PASSO.md
  - Roteiro: RUNBOOK.md
  - Provisionamento 1.4: PROVISIONING-1.4.md
  - Vocabulário do catálogo: CATALOGO.md
  - Amostras do Istio: SAMPLES.md
  - Componentes:
      - A tese na borda (prod-web): componentes/prod-web.md
      - travels (orquestrador): componentes/travels.md
      - flights: componentes/flights.md
      - hotels: componentes/hotels.md
      - cars: componentes/cars.md
      - insurances: componentes/insurances.md
      - discounts (v1 e v2): componentes/discounts.md
      - echo-api (contraexemplo): componentes/echo-api.md
      - travel-packages (EAP + CDC): componentes/travel-packages.md
      - travel-db: componentes/travel-db.md
      - travel-cache (Data Grid): componentes/travel-cache.md
      - travel-streams (Kafka): componentes/travel-streams.md
      - bookinfo — productpage (a UI): componentes/bookinfo-productpage.md
      - bookinfo — details: componentes/bookinfo-details.md
      - bookinfo — reviews (v1 v2 v3): componentes/bookinfo-reviews.md
      - bookinfo — ratings: componentes/bookinfo-ratings.md
      - grpc-echo (gRPC na borda): componentes/grpc-echo-app.md
      - websockets (adiada): componentes/websockets-tornado.md
      - otel-als-collector (log de acesso): componentes/otel-als-collector.md
      - parceiro globex-travel (gold): componentes/globex-travel.md
      - parceiro initech-voyages (silver): componentes/initech-voyages.md
      - parceiro acme-trips (free): componentes/acme-trips.md

plugins:
  - techdocs-core
