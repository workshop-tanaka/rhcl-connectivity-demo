# ===========================================================================
# build-travel-packages -- a primeira pipeline deste repo que CONSTROI algo.
#
# A valida-policies valida policy porque nao havia codigo. Esta compila o
# servico travel-packages (apps/travel-packages), analisa no SonarQube com
# portao, publica no Quay -- e o Tekton Chains assina o resultado sozinho,
# registrando no Rekor. O TektonConfig ja esta configurado para isso pelo
# scripts/setup-supply-chain.sh; nada aqui pede assinatura, ela acontece.
#
# Verificar, depois do primeiro run:
#   oc get pipelinerun -n travel-packages \
#     -o jsonpath='{.items[-1].metadata.annotations.chains\.tekton\.dev/signed}'
#
# ---------------------------------------------------------------------------
# TUDO EM taskSpec INLINE, sem ClusterTask e sem Tekton Hub.
#
# Nao e preferencia de estilo: as ClusterTask foram removidas no OpenShift
# Pipelines recente, e uma pipeline que depende de resolver task remota falha
# num cluster sem saida para a internet -- com uma mensagem sobre resolver, e
# nao sobre build. O que esta aqui roda com o que a imagem base ja tem.
# ===========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: maven-settings
  namespace: travel-packages
data:
  # -------------------------------------------------------------------------
  # SEM MIRROR, e isto foi MEDIDO neste cluster em 2026-08-28 -- nao e opiniao
  # sobre o Nexus.
  #
  # O que se tentou: settings.xml com <mirrorOf>central</mirrorOf> apontando
  # para http://nexus.cicd.svc:8081/repository/maven-public/. O build morreu em
  #
  #   Could not transfer artifact org.jboss:jboss-parent:pom:47 ... status code: 401
  #
  # O que se descobriu, na ordem:
  #   - o acesso anonimo do Nexus nasce DESLIGADO (dai o 401). Ligado por API.
  #   - com ele ligado, e tambem autenticado como admin, qualquer artefato
  #     responde 403 -- inclusive junit:4.13.2 pelo proxy maven-central, que
  #     esta online e nao bloqueado.
  #   - o log do Nexus nao registra o 403, e traz classes com.sonatype.nexus.clm
  #     (Firewall/IQ): a tag 'latest' do sonatype/nexus3 hoje embute recursos
  #     Pro, e o conteudo parece gated por licenca.
  #
  # ESSA ULTIMA LINHA ESTAVA ERRADA, e a correcao e de 2026-08-28. Nao e licenca
  # nem Firewall: e o EULA. O 403 traz um CORPO que so aparece quando se le a
  # resposta em vez do codigo --
  #
  #   You must accept the End User License Agreement (EULA) through the
  #   onboarding wizard or REST API before proceeding.
  #
  # Enquanto 'accepted' for false em /service/rest/v1/system/eula, o Nexus
  # AUTENTICA, LE e recusa QUALQUER escrita -- inclusive PUT em repositorio
  # hosted, de dentro do cluster, como admin. Verificado nos dois caminhos
  # (rota e servico interno) e confirmado com GET /service/rest/v1/security/users,
  # que responde 200 com credencial e 403 sem -- ou seja, a credencial vale e o
  # que falta e o aceite.
  #
  # Aceitar e um ato de licenciamento e depende de quem opera o ambiente, entao
  # nao ha script que o faca sozinho:
  #   curl -u admin:<senha> -X POST -H 'Content-Type: application/json' \
  #     -d '{"accepted":true,"disclaimer":"<o texto que o GET devolve>"}' \
  #     https://<nexus>/service/rest/v1/system/eula
  #
  # Enquanto isso o Nexus segue VAZIO, e por isso o Component travel-packages
  # nao leva anotacao nexus-repository-manager/* -- ver rhdh/catalog/dados.yaml.
  #
  # A DECISAO: o mirror e otimizacao, nao requisito. Sem ele o build passa
  # (BUILD SUCCESS, verificado), e quem faz o segundo build ser rapido e o PVC
  # cache-maven, que independe do Nexus. Perseguir licenciamento de Nexus Pro
  # para acelerar o build de uma aplicacao de demonstracao e trocar o problema
  # certo por um mais caro.
  #
  # O Nexus continua no ambiente pelo OUTRO papel: a tela de repositorio no
  # portal. Para religar o mirror depois de resolver o 403, basta descomentar
  # o bloco <mirrors> abaixo.
  # -------------------------------------------------------------------------
  settings.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
      <!--
        <mirrors>
          <mirror>
            <id>nexus-central</id>
            <url>http://nexus.cicd.svc:8081/repository/maven-public/</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      -->
    </settings>
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-travel-packages
  namespace: travel-packages
  labels:
    # O mesmo par da valida-policies, pelo mesmo motivo: o plugin Tekton do
    # portal enxerga pelo SELETOR da entidade, e nao pela anotacao. Sem
    # 'app', a aba CI do componente abre e lista vazio.
    app: travel-packages
    backstage.io/kubernetes-id: travel-packages
spec:
  params:
    - name: repo
      type: string
      description: repositorio do servico no GitLab do cluster
    - name: revisao
      type: string
      default: main
    - name: imagem
      type: string
      description: destino no Quay, sem tag
    - name: tag
      type: string
      default: latest
    - name: sonar-host
      type: string
      default: http://sonarqube.cicd.svc:9000

  workspaces:
    - name: fonte
      description: codigo clonado e target/ do Maven
    - name: cache-maven
      description: ~/.m2 entre execucoes -- e o que faz o segundo build ser rapido
    - name: settings
      description: ConfigMap maven-settings
    - name: sonar
      description: Secret com o token do SonarQube
    - name: quay
      description: Secret dockerconfigjson do Quay
    - name: redhat
      description: >-
        Secret dockerconfigjson do registry.redhat.io. O buildah NAO herda o
        pull secret global do cluster: quem o usa e o kubelet, para puxar a
        imagem do POD. Dentro do container, o buildah comeca sem credencial
        nenhuma, e a falha e literal -- "Please login to the Red Hat Registry
        using your Customer Portal credentials" no FROM da imagem base.

  results:
    # OS NOMES SAO CONVENCAO DO CHAINS, e nao escolha nossa. Ele descobre o que
    # assinar varrendo os results da TaskRun atras de IMAGE_URL e IMAGE_DIGEST.
    # Com o result chamado 'digest', o build passava, a anotacao
    # chains.tekton.dev/signed virava 'true', e mesmo assim NADA chegava ao
    # registry nem ao Rekor -- a unica pista era uma linha info no log do
    # controller: "No image subject to attest ... Skipping upload to registry".
    # Assinatura de proveniencia do PipelineRun existia; de IMAGEM, nao.
    # Medido em 2026-08-28.
    - name: IMAGE_URL
      description: referencia completa da imagem publicada
      value: $(tasks.constroi-imagem.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      description: digest da imagem -- e o que o Chains assina
      value: $(tasks.constroi-imagem.results.IMAGE_DIGEST)

  tasks:
    # -----------------------------------------------------------------------
    - name: clona
      params:
        - name: repo
          value: $(params.repo)
        - name: revisao
          value: $(params.revisao)
      workspaces:
        - name: fonte
          workspace: fonte
      taskSpec:
        params:
          - name: repo
            type: string
          - name: revisao
            type: string
        workspaces:
          - name: fonte
        results:
          - name: commit
            description: SHA do que foi construido
        steps:
          - name: git-clone
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            workingDir: $(workspaces.fonte.path)
            script: |
              #!/bin/bash
              set -euo pipefail
              microdnf install -y git >/dev/null

              # O GitLab do cluster serve com o wildcard do proprio cluster,
              # que a imagem base nao conhece. -c http.sslVerify=false e
              # lab-grade e deliberado: a alternativa seria montar a CA do
              # cluster em toda task, para um SCM que vive dentro dele.
              rm -rf ./* .git 2>/dev/null || true
              git -c http.sslVerify=false clone --depth 1 \
                  --branch "$(params.revisao)" "$(params.repo)" .

              git rev-parse HEAD | tr -d '\n' > $(results.commit.path)
              echo "clonado $(params.repo) @ $(cat $(results.commit.path))"

    # -----------------------------------------------------------------------
    - name: compila
      runAfter: [clona]
      workspaces:
        - name: fonte
          workspace: fonte
        - name: cache-maven
          workspace: cache-maven
        - name: settings
          workspace: settings
      taskSpec:
        workspaces:
          - name: fonte
          - name: cache-maven
          - name: settings
        steps:
          - name: maven
            image: registry.access.redhat.com/ubi9/openjdk-17:latest
            workingDir: $(workspaces.fonte.path)
            env:
              # Build-time, e nao execucao: e o eap-datasources-galleon-pack
              # que le esta variavel para saber qual driver instalar no
              # servidor provisionado. Sem ela o provisionamento para pedindo
              # a versao, com uma mensagem que nao diz onde definir.
              - name: POSTGRESQL_DRIVER_VERSION
                value: "42.7.3"
            script: |
              #!/bin/bash
              set -euo pipefail
              # -B silencioso e -ntp sem barra de progresso: log de build com
              # milhares de linhas de download esconde o erro que importa.
              mvn -B -ntp \
                  -s $(workspaces.settings.path)/settings.xml \
                  -Dmaven.repo.local=$(workspaces.cache-maven.path) \
                  clean verify
              echo "WAR e servidor provisionado em target/"
              ls -la target/server >/dev/null

    # -----------------------------------------------------------------------
    # O PORTAO DE QUALIDADE. Task separada de proposito: na aba CI do portal a
    # etapa aparece com nome proprio, e quando ela reprova fica obvio o QUE
    # reprovou -- 'compila' verde e 'portao-de-qualidade' vermelho conta a
    # historia sozinho.
    - name: portao-de-qualidade
      runAfter: [compila]
      params:
        - name: sonar-host
          value: $(params.sonar-host)
      workspaces:
        - name: fonte
          workspace: fonte
        - name: cache-maven
          workspace: cache-maven
        - name: settings
          workspace: settings
        - name: sonar
          workspace: sonar
      taskSpec:
        params:
          - name: sonar-host
            type: string
        workspaces:
          - name: fonte
          - name: cache-maven
          - name: settings
          - name: sonar
        steps:
          - name: sonar-scanner
            image: registry.access.redhat.com/ubi9/openjdk-17:latest
            workingDir: $(workspaces.fonte.path)
            script: |
              #!/bin/bash
              set -euo pipefail
              # -Dsonar.qualitygate.wait=true E A LINHA INTEIRA DESTA TASK.
              # Sem ela o scanner envia a analise e sai com 0 -- o portao
              # existe no Sonar e nao tem efeito nenhum na pipeline. Foi assim
              # que a valida-policies acabou verde para sempre.
              #
              # COMO O 'Sonar way' SE COMPORTA AQUI, medido em 2026-08-28 em
              # tres analises seguidas:
              #
              #   1a analise   PASSA SEM AVALIAR NADA. As quatro condicoes sao
              #                de CODIGO NOVO, o periodo e PREVIOUS_VERSION, e
              #                sem versao anterior nao ha o que comparar: o
              #                project_status volta com a lista de condicoes
              #                VAZIA. Um portao verde que nao olhou nada.
              #   2a em diante avalia de verdade. Reprovou com new_violations=4
              #                (limite 0) na primeira vez que houve linha de
              #                base.
              #
              # Consequencia para o palco: o portao so morde a partir da
              # segunda execucao. Se a demo precisa MOSTRAR uma reprovacao,
              # rode o build duas vezes antes -- ou introduza a violacao na
              # segunda. E se ele reprovar, o buildah nao roda e a imagem nao
              # e assinada: o portao interrompe a cadeia, que e o ponto.
              #
              # A cobertura hoje e 8,2% e ainda assim passa, porque
              # new_coverage so conta LINHA NOVA nao coberta. Nao confunda
              # 'passou' com 'esta coberto'.
              mvn -B -ntp \
                  -s $(workspaces.settings.path)/settings.xml \
                  -Dmaven.repo.local=$(workspaces.cache-maven.path) \
                  sonar:sonar \
                  -Dsonar.host.url="$(params.sonar-host)" \
                  -Dsonar.token="$(cat $(workspaces.sonar.path)/token)" \
                  -Dsonar.qualitygate.wait=true

    # -----------------------------------------------------------------------
    # ----- publica o artefato Maven no Nexus --------------------------------
    # O elo do artefato (2026-08-31): a imagem ia para o Quay e o .war nao ia
    # para lugar nenhum -- o Nexus era so espelho vazio e a aba do portal nao
    # tinha o que mostrar (real-only: por isso a anotacao nao existia). Roda
    # DEPOIS do portao de qualidade -- artefato reprovado nao se publica -- e
    # em paralelo ao build da imagem: binario no Quay, artefato no Nexus, os
    # dois rastreaveis do mesmo commit.
    #
    # deploy:deploy-file, e nao 'mvn deploy': o .war ja esta em target/ do
    # compila; rebuildar para publicar dobraria o tempo da pipeline.
    #
    # A credencial vem do secret nexus-deploy (optional: sem ele o passo
    # PULA com aviso alto no log -- a credenciais e quem o cria, e ela roda
    # depois da entrega na primeira montagem).
    - name: publica-artefato
      runAfter: [portao-de-qualidade]
      workspaces:
        - name: fonte
          workspace: fonte
        - name: cache-maven
          workspace: cache-maven
      taskSpec:
        workspaces:
          - name: fonte
          - name: cache-maven
        steps:
          - name: deploy
            image: registry.access.redhat.com/ubi9/openjdk-17:latest
            workingDir: $(workspaces.fonte.path)
            env:
              - name: NEXUS_USER
                valueFrom:
                  secretKeyRef: {name: nexus-deploy, key: username, optional: true}
              - name: NEXUS_PASS
                valueFrom:
                  secretKeyRef: {name: nexus-deploy, key: password, optional: true}
              - name: NEXUS_URL
                valueFrom:
                  secretKeyRef: {name: nexus-deploy, key: url, optional: true}
            script: |
              #!/bin/bash
              set -euo pipefail
              if [[ -z "${NEXUS_USER:-}" || -z "${NEXUS_PASS:-}" || -z "${NEXUS_URL:-}" ]]; then
                # exit 1, e nao 0: com exit 0 a run aparecia Succeeded na aba
                # CI do RHDH com o artefato NAO publicado -- falso positivo
                # relatado em 2026-09-01. A mesma licao do qualitygate.wait
                # logo acima: task que nao pode falhar e portao que nao existe.
                echo "FALHA: secret nexus-deploy ausente -- artefato NAO publicado."
                echo "       rode 'bash scripts/provision.sh credenciais' e reexecute a pipeline."
                exit 1
              fi
              WAR="$(ls target/*.war 2>/dev/null | head -1)"
              [[ -n "$WAR" ]] || { echo "nenhum .war em target/ -- o compila rodou?"; exit 1; }
              cat > /tmp/settings-deploy.xml <<FIM
              <settings><servers><server>
                <id>nexus</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_PASS}</password>
              </server></servers></settings>
              FIM
              mvn -B -ntp -s /tmp/settings-deploy.xml \
                  -Dmaven.repo.local=$(workspaces.cache-maven.path) \
                  deploy:deploy-file \
                  -DrepositoryId=nexus \
                  -Durl="${NEXUS_URL}/repository/maven-releases/" \
                  -DpomFile=pom.xml -Dfile="$WAR" -Dpackaging=war
              echo "artefato publicado em maven-releases (grupo com.redhat.travel)"
    - name: constroi-imagem
      runAfter: [portao-de-qualidade]
      params:
        - name: imagem
          value: $(params.imagem)
        - name: tag
          value: $(params.tag)
      workspaces:
        - name: fonte
          workspace: fonte
        - name: quay
          workspace: quay
        - name: redhat
          workspace: redhat
      taskSpec:
        params:
          - name: imagem
            type: string
          - name: tag
            type: string
        workspaces:
          - name: fonte
          - name: quay
          - name: redhat
        results:
          - name: IMAGE_URL
            description: referencia completa da imagem publicada
          - name: IMAGE_DIGEST
            description: digest da imagem publicada
        steps:
          - name: buildah
            image: registry.redhat.io/rhel9/buildah:latest
            workingDir: $(workspaces.fonte.path)
            securityContext:
              # O buildah precisa de SETFCAP para montar camadas. E por isso
              # que o provision.sh vincula a SCC 'privileged' a ServiceAccount
              # 'pipeline' deste namespace -- sem isso o sintoma e um erro de
              # 'operation not permitted' no meio do commit da imagem, que nao
              # menciona SCC nenhuma.
              capabilities:
                add: ["SETFCAP"]
            script: |
              #!/bin/bash
              set -euo pipefail
              DESTINO="$(params.imagem):$(params.tag)"

              # vfs, e nao overlay: overlay dentro de container exige
              # /dev/fuse, que a SCC nao concede. vfs e mais lento e sempre
              # funciona -- a troca certa para uma imagem que se constroi
              # uma vez por demo.
              # DOIS authfile, e nao um: o FROM puxa de registry.redhat.io e o
              # push vai para o Quay. Sao credenciais diferentes, de donos
              # diferentes, e juntar as duas num secret so economizaria um
              # workspace ao custo de nao se saber qual expirou.
              buildah --storage-driver=vfs bud \
                      --format=oci \
                      --tls-verify=true \
                      --authfile "$(workspaces.redhat.path)/.dockerconfigjson" \
                      -f ./Dockerfile -t "$DESTINO" .

              buildah --storage-driver=vfs push \
                      --authfile "$(workspaces.quay.path)/.dockerconfigjson" \
                      --digestfile /tmp/digest \
                      --tls-verify=true \
                      "$DESTINO" "docker://$DESTINO"

              tr -d '\n' < /tmp/digest > $(results.IMAGE_DIGEST.path)
              printf '%s' "$DESTINO" > $(results.IMAGE_URL.path)
              echo "publicado $DESTINO"
              echo "digest: $(cat $(results.IMAGE_DIGEST.path))"
---
# ===========================================================================
# Modelo de execucao. generateName porque cada disparo e um objeto novo:
#   oc create -f platform-reference/pipelines/build-travel-packages.yaml
# (o oc create aplica so o PipelineRun se voce recortar este documento; para
#  disparar sem recortar, use scripts/build-app.sh)
#
# O volumeClaimTemplate do workspace 'fonte' morre com o PipelineRun. O do
# cache do Maven NAO -- ele e um PVC nomeado, criado pelo provision.sh, e e
# ele que faz o segundo build levar um minuto em vez de oito. Perder esse
# cache no palco e a diferenca entre uma cena e um silencio.
# ===========================================================================
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-travel-packages-
  namespace: travel-packages
  labels:
    app: travel-packages
    # O MESMO selector da entidade no catalogo (dados.yaml): a aba Tekton le
    # por backstage.io/kubernetes-label-selector, e run sem este label e
    # exatamente 'aba CI vazia com pipeline rodando'.
    app.kubernetes.io/part-of: travel-packages
    backstage.io/kubernetes-id: travel-packages
spec:
  pipelineRef:
    name: build-travel-packages
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
    - name: repo
      value: https://gitlab.__DOMAIN__/rhcl/travel/travel-packages.git
    - name: imagem
      value: __IMAGEM__
    - name: tag
      value: latest
  workspaces:
    - name: fonte
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 4Gi
    - name: cache-maven
      persistentVolumeClaim:
        claimName: cache-maven
    - name: settings
      configMap:
        name: maven-settings
    - name: sonar
      secret:
        secretName: sonarqube-token
    - name: quay
      secret:
        secretName: quay-push
    - name: redhat
      secret:
        secretName: redhat-pull
