# ---------------------------------------------------------------------------
# AS DUAS ROTAS DO BOOKINFO -- e elas sao o argumento inteiro desta amostra.
#
# Mesmo hostname, mesmo backend, fronteiras diferentes. A Gateway API casa pelo
# prefixo mais longo, entao '/api/v1' vence '/' independentemente de qual rota
# foi criada primeiro -- e por isso as duas podem ser arquivos separados sem
# virar armadilha de ordem.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bookinfo-ui-route
  title: HTTPRoute — bookinfo (UI)
  description: >-
    A rota publica. Path prefix '/', sem AuthPolicy: quem entra e qualquer um, e o que a governa e um limite de capacidade no hostname inteiro. 'Sem chave' nao pode significar 'sem governanca'.
  annotations:
    rhcl.demo/cluster-object: httproute/bookinfo/bookinfo-ui
    backstage.io/kubernetes-namespace: bookinfo
    backstage.io/kubernetes-label-selector: app=bookinfo
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - gateway-api
spec:
  type: httproute
  owner: group:default/platform-team
  system: sample-bookinfo

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bookinfo-api-route
  title: HTTPRoute — bookinfo (API)
  description: >-
    A rota da API. Path prefix '/api/v1', e e sobre ela que valem a AuthPolicy e o PlanPolicy. Os quatro caminhos que o bookinfo publica de verdade estao descritos na API bookinfo-api.
  annotations:
    rhcl.demo/cluster-object: httproute/bookinfo/bookinfo-api
    backstage.io/kubernetes-namespace: bookinfo
    backstage.io/kubernetes-label-selector: app=bookinfo
  labels:
    rhcl.demo/camada: borda
    rhcl.demo/origem: repo
    rhcl.demo/produto: bookinfo
  tags:
    - rhcl
    - sample
    - gateway-api
spec:
  type: httproute
  owner: group:default/platform-team
  system: sample-bookinfo

---
