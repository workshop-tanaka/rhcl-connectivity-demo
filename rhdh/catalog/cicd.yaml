# ===========================================================================
# Catalogo RHDH — a camada de CI/CD.
#
# Modela platform-reference/cicd/: o Nexus (artefatos) e o SonarQube (qualidade).
# Sao ferramentas que o golden path usa, e que ate 2026-08-28 nao existiam no
# catalogo -- a plateia via os templates criarem projeto e nao via onde o
# artefato ia parar.
#
# ROTULOS: vocabulario de docs/CATALOGO.md. A camada e 'cicd', reservada na
# tabela para isto.
#
# Ambas trazem rhcl.demo/cluster-object: num cluster sem a etapa 'cicd' do
# provision.sh, saem do portal sozinhas em vez de virar dois cards que nunca
# carregam.
# ===========================================================================
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: cicd
  title: CI/CD
  description: >-
    Onde o codigo gerado pelo golden path e construido e medido: Nexus guarda o
    artefato, SonarQube mede a qualidade. Nao e a demo -- e o que a sustenta do
    lado da entrega.
  annotations:
    # Ancorado no Namespace pelo mesmo motivo do System travel-packages: sem
    # isto, um cluster sem a etapa 'cicd' publicaria um System vazio. Namespace
    # e cluster-scoped, dai o campo do meio vazio.
    rhcl.demo/cluster-object: namespace//cicd
  labels:
    rhcl.demo/camada: cicd
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - ato-6
spec:
  owner: group:default/platform-team
  domain: plataforma
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: nexus
  title: Nexus — repositorio de artefatos
  description: >-
    Guarda os artefatos e as imagens que a pipeline produz. E o destino do
    push, e por isso o primeiro lugar a conferir quando um build "passa" e o
    deploy nao encontra a imagem.
  annotations:
    rhcl.demo/cluster-object: deployment/cicd/nexus
    backstage.io/kubernetes-namespace: cicd
    backstage.io/kubernetes-label-selector: app=nexus
  labels:
    rhcl.demo/camada: cicd
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - ato-6
spec:
  type: artifact-repository
  owner: group:default/platform-team
  system: cicd
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: sonarqube
  title: SonarQube — qualidade de codigo
  description: >-
    Analise estatica do que o golden path gera. O banco dele e um Cluster CNPG
    proprio (sonar-db, no mesmo namespace) -- vale saber antes de diagnosticar
    "SonarQube nao sobe" como problema da aplicacao.
  annotations:
    rhcl.demo/cluster-object: deployment/cicd/sonarqube
    backstage.io/kubernetes-namespace: cicd
    backstage.io/kubernetes-label-selector: app=sonarqube
  labels:
    rhcl.demo/camada: cicd
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - ato-6
spec:
  type: code-quality
  owner: group:default/platform-team
  system: cicd
---
# ---------------------------------------------------------------------------
# Quay NO PROPRIO CLUSTER — o destino do push.
#
# Entrou junto com as amostras (2026-08-28): a cadeia de suprimento delas
# espelha as imagens de terceiro aqui, e sem a entidade a plateia via o
# 'skopeo copy' na aba CI e nao via para onde a imagem ia.
#
# NAO CONFUNDIR com o quay.io publico. O plugin de Quay do portal aponta para
# quay.io (rhdh/setup-plugins.sh), entao a anotacao quay.io/repository-slug dos
# componentes fala do registry PUBLICO; este Resource e o registry do cluster,
# que so aparece pelo Kubernetes e pela rota.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: quay
  title: Quay — registry do cluster
  description: >-
    Registry no proprio cluster: destino do push da pipeline de entrega e do
    espelho assinado das imagens das amostras. Conta externa foi recusada em
    2026-08-27 pelo mesmo criterio do GitLab -- estado que o repositorio nao
    reconstroi nasce vazio num cluster novo.
  annotations:
    rhcl.demo/cluster-object: quayregistry/quay/registry
    backstage.io/kubernetes-namespace: quay
    # quay-operator/quayregistry, e nao quay-component: o deploy do app leva
    # quay-component=quay (sem sufixo -app), e o rotulo do operador casa a
    # cadeia inteira (app + postgres + redis) -- Topology com o quadro real.
    backstage.io/kubernetes-label-selector: quay-operator/quayregistry=registry
  labels:
    rhcl.demo/camada: cicd
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - sample
spec:
  type: container-registry
  owner: group:default/platform-team
  system: cicd
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: tekton-pipelines
  title: OpenShift Pipelines (Tekton)
  description: >-
    Executa as tres pipelines deste ambiente: valida-policies, o build assinado
    do travel-packages, e a cadeia de suprimento das amostras. E tambem quem
    hospeda o Tekton Chains, que assina sem que pipeline nenhuma peca.
  annotations:
    rhcl.demo/cluster-object: deployment/openshift-pipelines/tekton-pipelines-controller
    backstage.io/kubernetes-namespace: openshift-pipelines
    # part-of, e nao app: os deployments do operator nao carregam 'app' --
    # selector antigo deixava a Topology vazia sem erro (medido 2026-09-01).
    backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of=tekton-pipelines
  labels:
    rhcl.demo/camada: cicd
    rhcl.demo/origem: repo
  tags:
    - rhcl
    - ato-6
spec:
  type: ci
  owner: group:default/platform-team
  system: cicd
